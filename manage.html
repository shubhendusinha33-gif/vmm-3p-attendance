<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://phyllziizajuphenpwxz.supabase.co; media-src 'self' blob:; connect-src 'self' https://phyllziizajuphenpwxz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · 3rd Party Attendance</title>
<meta name="theme-color" content="#1565C0">
<link rel="preconnect" href="https://phyllziizajuphenpwxz.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" media="print" onload="this.media=\'all\'">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="view"><div class="spin"></div></main>
</div>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/dash.js"></script>
<script>
(async function () {
  Layout.apply();
  const me = await requireSession(['am', 'zfm', 'hodept']); if (!me) return;
  const items = [{ grp: 'OPERATE' }, { id: 'live', label: 'Live Dashboard' }];
  if (me.role === 'am') items.push({ id: 'approvals', label: 'Approvals' }, { id: 'team', label: 'Store team' });
  if (me.role === 'zfm') items.push({ id: 'team', label: 'Store team' });
  items.push({ id: 'churn', label: 'Staff Churn' }, { id: 'reports', label: 'Attendance Reports' });
  if (me.role === 'zfm') items.push({ grp: 'MANAGE' }, { id: 'pins', label: 'Users & PIN' });
  const view = $('#view');
  Shell(me, items, (id) => {
    view.innerHTML = '';
    if (id === 'live') LiveDash(view, me);
    if (id === 'churn') ChurnView(view, me);
    if (id === 'approvals') ApprovalsView(view, me);
    if (id === 'team') StoreTeamView(view, me);
    if (id === 'pins') PinReset(view, me, async () => { const r = await rpc('zone_users', { p_token: me.token }); return (r && r.rows) || []; });
    if (id === 'reports') {
      view.innerHTML = `<div class="top"><h1>Attendance Reports</h1></div>
        <div class="panel"><h3>Monthly statement (A4)</h3><p class="crumb">Pick store, associate and month. Print, save as PDF or download Excel.</p>
        <div><a class="btn sm" href="statement.html" style="display:inline-block;text-decoration:none">Open statement</a></div></div>
        <div class="panel"><h3>Store-wise attendance (Excel)</h3><p class="crumb">On Live Dashboard, pick date, shift and checkpoint, then tap ⬇ Excel.</p></div>`;
    }
  });
})();
</script>
</body>
</html>
