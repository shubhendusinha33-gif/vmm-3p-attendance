<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · 3rd Party Attendance</title>
<meta name="theme-color" content="#1565C0">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="view"><div class="spin"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/dash.js"></script>
<script>
(async function () {
  const me = await requireSession(['am', 'zfm', 'hodept']); if (!me) return;
  const items = [{ grp: 'OPERATE' }, { id: 'live', label: 'Live Dashboard' }, { id: 'churn', label: 'Staff Churn' }, { id: 'reports', label: 'Attendance Reports' }];
  if (me.role === 'zfm') items.push({ grp: 'MANAGE' }, { id: 'pins', label: 'Users & PIN' });
  const view = $('#view');
  Shell(me, items, (id) => {
    view.innerHTML = '';
    if (id === 'live') LiveDash(view, me);
    if (id === 'churn') ChurnView(view, me);
    if (id === 'pins') PinReset(view, me, async () => { const r = await rpc('zone_users', { p_token: me.token }); return (r && r.rows) || []; });
    if (id === 'reports') {
      view.innerHTML = `<div class="top"><h1>Attendance Reports</h1></div>
        <div class="panel"><h3>Monthly statement (A4)</h3><p class="crumb">Pick store, associate and month. Print, save as PDF or download Excel.</p>
        <div><a class="btn sm" href="statement.html" style="display:inline-block;text-decoration:none">Open statement</a></div></div>
        <div class="panel"><h3>Store-wise attendance (Excel)</h3><p class="crumb">On Live Dashboard, pick date, shift and checkpoint, then tap ⬇ Excel.</p></div>`;
    }
  });
})();
</script>
</body>
</html>
