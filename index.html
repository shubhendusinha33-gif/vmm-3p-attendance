<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://phyllziizajuphenpwxz.supabase.co; media-src 'self' blob:; connect-src 'self' https://phyllziizajuphenpwxz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3rd Party Attendance</title>
<meta name="theme-color" content="#1565C0">
<link rel="preconnect" href="https://phyllziizajuphenpwxz.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" media="print" onload="this.media=\'all\'">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="blue-page">
  <form class="card" id="card" autocomplete="off" novalidate>
    <div id="langSlot" style="display:flex;justify-content:flex-end"></div>
    <img class="logo" src="assets/logo.png" alt="Vishal Mega Mart">

    <!-- step 1: details -->
    <section id="s1">
      <h1 class="ttl" data-t="appTitle"></h1>
      <p class="sub" data-t="appSub"></p>
      <div class="roles" id="roles" role="tablist" style="margin-top:12px">
        <button type="button" class="role on" data-role="store"><span class="ic">🏪</span><span data-t="roleStore"></span></button>
        <button type="button" class="role" data-role="am"><span class="ic">🧭</span><span data-t="roleAm"></span></button>
        <button type="button" class="role" data-role="zfm"><span class="ic">🗺️</span><span data-t="roleZfm"></span></button>
        <button type="button" class="role" data-role="hodept"><span class="ic">🏢</span><span data-t="roleHodept"></span></button>
        <button type="button" class="role" data-role="admin"><span class="ic">🛡️</span><span data-t="roleAdmin"></span></button>
      </div>
      <div class="steps" style="margin:12px 0"><b class="on">1</b><span data-t="stepDetails"></span><span>—</span><b>2</b><span data-t="stepPin"></span></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="field"><label class="lbl" for="emp" data-t="empCode"></label>
          <input class="in" id="emp" inputmode="numeric" maxlength="10" data-tp="empHint"></div>
        <div class="field" data-for="store"><label class="lbl" for="post" data-t="post"></label>
          <select class="in" id="post"><option>SM</option><option>ASM</option><option>DM Apps</option><option>DM FMCG</option><option>DM GM</option></select></div>
        <div class="field" data-for="store"><label class="lbl" for="storeCode" data-t="storeCode"></label>
          <input class="in" id="storeCode" maxlength="4" style="text-transform:uppercase" data-tp="storeHint"></div>
        <div class="field" data-for="hodept" hidden><label class="lbl" for="dept" data-t="department"></label>
          <select class="in" id="dept"><option value="" data-t="selectDept"></option></select></div>
        <div id="err1" class="note r" hidden></div>
        <button class="btn" id="btnNext" type="submit" data-t="next"></button>
      </div>
    </section>

    <!-- step 2: PIN -->
    <section id="s2" hidden>
      <h1 class="ttl"><span data-t="welcome"></span>, <span id="who"></span></h1>
      <p class="sub" id="whoSub" style="margin-top:2px"></p>
      <div class="steps" style="margin:12px 0"><b>1</b><span data-t="stepDetails"></span><span>—</span><b class="on">2</b><span data-t="stepPin"></span></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="note k" data-t="verified"></div>
        <div class="lbl" style="text-align:center" data-t="enterPin"></div>
        <div class="pins" id="pinLogin"></div>
        <div id="err2" class="note r" hidden></div>
        <button class="btn" id="btnLogin" type="button" data-t="login"></button>
        <div data-layout-slot></div>
        <p class="sub" style="margin:0" data-t="forgotPin"></p>
        <button class="link" type="button" data-back data-t="back"></button>
      </div>
    </section>

    <!-- create PIN -->
    <section id="s3" hidden>
      <h1 class="ttl" data-t="createPin"></h1>
      <p class="sub" id="whoSub3" style="margin-top:2px"></p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <div id="regBox" hidden style="display:flex;flex-direction:column;gap:8px">
          <div class="note i" style="text-align:left"><b id="regNote"></b><br><span style="font-size:12px" data-t="registerSub"></span></div>
          <div class="lbl" data-t="fullName"></div>
          <input class="in" id="regName" maxlength="60" autocomplete="name">
        </div>
        <div id="codeBox" hidden style="display:flex;flex-direction:column;gap:6px">
          <div class="lbl" data-t="setupCode"></div>
          <input class="in" id="setupCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="text-align:center;font-size:20px;font-weight:700;letter-spacing:6px">
          <p class="sub" style="margin:0" data-t="setupHint"></p>
        </div>
        <div class="lbl" data-t="answerQ"></div>
        <div class="math" id="mathQ"></div>
        <input class="in" id="mathA" inputmode="numeric" maxlength="3" style="text-align:center;font-size:20px;font-weight:700">
        <div class="lbl" data-t="newPin"></div>
        <div class="pins" id="pinNew"></div>
        <div class="lbl" data-t="confirmPin"></div>
        <div class="pins" id="pinNew2"></div>
        <div id="err3" class="note r" hidden></div>
        <button class="btn" id="btnSave" type="button" data-t="savePin"></button>
        <div data-layout-slot></div>
        <button class="link" type="button" data-back data-t="back"></button>
      </div>
    </section>

    <!-- locked -->
    <section id="s4" hidden>
      <h1 class="ttl" data-t="loginLocked"></h1>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <div class="note r" data-t="lockedWhy"></div>
        <div class="big" id="countdown">05:00</div>
        <p class="sub" style="margin:0" data-t="tryAfter"></p>
        <div class="note i" data-t="forgotPin"></div>
        <button class="link" type="button" data-back data-t="back"></button>
      </div>
    </section>

    <!-- store busy -->
    <section id="s5" hidden>
      <h1 class="ttl"><span id="busyStore"></span> <span data-t="storeOpen"></span></h1>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <div class="note w" id="busyWho"></div>
        <div class="note i" id="busyHow"></div>
        <button class="btn o" id="btnRetry" type="button" data-t="checkAgain"></button>
        <button class="link" type="button" data-back data-t="back"></button>
      </div>
    </section>

    <p class="credit" id="credit"></p>
  </form>
</div>

<script src="assets/app.js"></script>
<script>
let role = 'store', checked = null, timer = null, mathAns = 0;

function show(id) { ['s1','s2','s3','s4','s5'].forEach((s) => $('#' + s).hidden = s !== id); }
function err(id, msg) { const e = $('#' + id); e.hidden = !msg; e.textContent = msg || ''; }
function pinBoxes(el) {
  el.innerHTML = [0,1,2,3].map(() => '<input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code">').join('');
  const ins = $$('input', el);
  ins.forEach((i, k) => {
    i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 1); if (i.value && ins[k + 1]) ins[k + 1].focus(); });
    i.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !i.value && ins[k - 1]) ins[k - 1].focus(); });
  });
}
const pinVal = (el) => $$('input', el).map((i) => i.value).join('');
function ident() {
  return { p_role: role, p_emp: $('#emp').value.trim(),
    p_post: role === 'store' ? $('#post').value : null,
    p_store: role === 'store' ? $('#storeCode').value.trim().toUpperCase() : null,
    p_dept: role === 'hodept' ? (Number($('#dept').value) || null) : null };
}
function setRole(r) {
  role = r;
  $$('.role').forEach((b) => b.classList.toggle('on', b.dataset.role === r));
  $$('[data-for="store"]').forEach((e) => e.hidden = r !== 'store');
  $$('[data-for="hodept"]').forEach((e) => e.hidden = r !== 'hodept');
  err('err1');
}
function newMath() {
  const a = 2 + Math.floor(Math.random() * 9), b = 1 + Math.floor(Math.random() * 9);
  mathAns = a + b; $('#mathQ').textContent = `${a} + ${b} = ?`; $('#mathA').value = '';
}
function lockedScreen(sec) {
  show('s4'); clearInterval(timer);
  const end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    $('#countdown').textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
    if (!left) { clearInterval(timer); show('s2'); pinBoxes($('#pinLogin')); }
  };
  tick(); timer = setInterval(tick, 1000);
}
function subLine() {
  const i = ident();
  return role === 'store' ? `${i.p_post} · ${i.p_store}${checked.store_name ? ' · ' + checked.store_name : ''}` : `Emp ${i.p_emp}`;
}

let mode = 'pin';
function createScreen(m) {
  mode = m; newMath(); pinBoxes($('#pinNew')); pinBoxes($('#pinNew2')); err('err3');
  $('#regBox').hidden = m !== 'register'; $('#codeBox').hidden = m !== 'code';
  $('#s3 .ttl').textContent = t(m === 'register' ? 'registerTitle' : 'createPin');
  $('#btnSave').textContent = t(m === 'register' ? 'registerBtn' : 'savePin');
  if (m === 'register') { const i = ident(); $('#regNote').textContent = t('registerNew', { store: `${i.p_store} ${checked.store_name || ''}`.trim(), post: i.p_post }); $('#regName').value = ''; }
  if (m === 'code') $('#setupCode').value = '';
  show('s3');
  setTimeout(() => (m === 'register' ? $('#regName') : m === 'code' ? $('#setupCode') : $('#mathA')).focus(), 50);
}
function layoutSlots() {
  $$('[data-layout-slot]').forEach((el) => { el.innerHTML = ''; if (role !== 'store') el.appendChild(Layout.toggle()); });
}
async function doCheck() {
  const i = ident();
  if (!/^\d{5,}$/.test(i.p_emp)) return err('err1', t('empHint'));
  if (role === 'store' && !/^[A-Z]{2}\d{2}$/.test(i.p_store)) return err('err1', t('storeHint'));
  if (role === 'hodept' && !i.p_dept) return err('err1', t('selectDept'));
  $('#btnNext').disabled = true;
  const r = await rpc('auth_check', i);
  $('#btnNext').disabled = false;
  if (r && r.error === 'POST_TAKEN') return err('err1', t('postTaken', { post: r.post, store: r.store, name: r.by_name, emp: r.by_emp }));
  if (r && r.error === 'EMP_ELSEWHERE') return err('err1', t('empElsewhere', { where: r.where }));
  if (!r || !r.ok) return err('err1', errText(r && r.error));
  checked = r; err('err1');
  layoutSlots();
  if (r.register) { $('#whoSub3').textContent = `Emp ${i.p_emp}`; return createScreen('register'); }
  $('#who').textContent = r.name; $('#whoSub').textContent = subLine(); $('#whoSub3').textContent = subLine();
  if (r.locked_sec > 0) return lockedScreen(r.locked_sec);
  if (!r.pin_set) return createScreen(r.need_code ? 'code' : 'pin');
  pinBoxes($('#pinLogin')); err('err2'); show('s2'); setTimeout(() => $('#pinLogin input').focus(), 50);
}

async function doLogin() {
  const pin = pinVal($('#pinLogin'));
  if (!/^\d{4}$/.test(pin)) return err('err2', t('enterPin'));
  const id = ident(); let perm = { pos: null };
  if (role === 'store') {
    const ctx = await rpc('punch_context', { p_store: id.p_store });
    perm = (await permissionsReady('user', true)) || (await consentGate({ kind: 'user', store: id.p_store, emp: id.p_emp, testMode: ctx && ctx.test_mode, needCamera: true }));
  } else if (!hasConsent('user')) {
    await consentGate({ kind: 'user', emp: id.p_emp, requirePerms: false, needCamera: false });
  }
  $('#btnLogin').disabled = true;
  const r = await rpc('auth_login', { ...id, p_pin: pin, p_device: deviceId(), p_lat: perm.pos ? perm.pos.lat : null, p_lng: perm.pos ? perm.pos.lng : null });
  $('#btnLogin').disabled = false;
  if (r && r.ok) { Session.set(r); location.href = homeFor(r.role); return; }
  const e = r && r.error;
  if (e === 'WRONG_PIN') { pinBoxes($('#pinLogin')); return err('err2', t('wrongPin', { n: r.tries_left })); }
  if (e === 'LOCKED') return lockedScreen(r.locked_sec);
  if (e === 'OUT_OF_RANGE') return err('err2', t('outsideLogin', { d: r.dist_m, r: r.radius_m }));
  if (e === 'NO_GPS') return err('err2', t('noGps') + ' ' + t('permHow'));
  if (e === 'PIN_NOT_SET') return createScreen(role === 'store' ? 'pin' : 'code');
  if (e === 'STORE_BUSY') {
    $('#busyStore').textContent = ident().p_store;
    $('#busyWho').textContent = t('openOnPhone', { name: r.by_name, emp: r.by_emp, since: r.since });
    $('#busyHow').textContent = t('askLogout', { at: r.unlock_at });
    return show('s5');
  }
  err('err2', errText(e));
}

async function doSave() {
  if (Number($('#mathA').value) !== mathAns) { newMath(); return err('err3', t('wrongAnswer')); }
  const p1 = pinVal($('#pinNew')), p2 = pinVal($('#pinNew2'));
  if (!/^\d{4}$/.test(p1)) return err('err3', t('newPin'));
  if (p1 !== p2) { pinBoxes($('#pinNew2')); return err('err3', t('pinMismatch')); }
  const id = ident(); let perm = { pos: null };
  if (mode === 'register' && !/^[A-Za-z][A-Za-z .]{2,59}$/.test($('#regName').value.trim())) return err('err3', t('badNameReg'));
  if (mode === 'code' && !/^\d{6}$/.test($('#setupCode').value.trim())) return err('err3', t('badCode'));
  if (role === 'store') {
    const ctx = await rpc('punch_context', { p_store: id.p_store });
    perm = (await permissionsReady('user', true)) || (await consentGate({ kind: 'user', store: id.p_store, emp: id.p_emp, testMode: ctx && ctx.test_mode, needCamera: true }));
  }
  const geo = { p_lat: perm.pos ? perm.pos.lat : null, p_lng: perm.pos ? perm.pos.lng : null };
  $('#btnSave').disabled = true;
  const r = mode === 'register'
    ? await rpc('auth_register', { p_emp: id.p_emp, p_post: id.p_post, p_store: id.p_store, p_name: $('#regName').value.trim(), p_pin: p1, ...geo })
    : await rpc('auth_set_pin', { ...id, p_pin: p1, ...geo, p_code: mode === 'code' ? $('#setupCode').value.trim() : null });
  $('#btnSave').disabled = false;
  if (r && r.error === 'OUT_OF_RANGE') return err('err3', t('outsideLogin', { d: r.dist_m, r: r.radius_m }));
  if (r && r.error === 'LOCKED') return lockedScreen(r.locked_sec);
  if (r && r.error === 'BAD_NAME') return err('err3', t('badNameReg'));
  if (!r || !r.ok) { if (r && r.error === 'WEAK_PIN') { pinBoxes($('#pinNew')); pinBoxes($('#pinNew2')); } return err('err3', errText(r && r.error)); }
  toast(t('pinSaved'));
  if (mode === 'register') { checked.name = $('#regName').value.trim(); $('#who').textContent = checked.name; }
  checked.pin_set = true; pinBoxes($('#pinLogin')); err('err2'); show('s2');
  $$('#pinLogin input').forEach((inp, k) => { inp.value = p1[k]; });
  doLogin();
}

(async function init() {
  $('#langSlot').appendChild(langToggle());
  $('#credit').innerHTML = credit();
  applyI18n();
  const q = new URLSearchParams(location.search);
  if (q.get('r') === 'expired') toast(t('sessionExpired'));
  const s = Session.get();
  const last = store.get('vmm3p_last_login');
  if (last) { setRole(last.role || 'store'); $('#emp').value = last.emp || ''; if (last.post) $('#post').value = last.post; $('#storeCode').value = last.store || ''; }
  const fillDepts = (opts) => { if (!opts || !opts.departments) return; $('#dept').innerHTML = $('#dept').options[0] ? $('#dept').options[0].outerHTML : ''; opts.departments.forEach((d) => $('#dept').insertAdjacentHTML('beforeend', `<option value="${d.id}">${esc(d.name)}</option>`)); if (last && last.dept) $('#dept').value = last.dept; };
  let cached = null; try { cached = JSON.parse(localStorage.getItem('vmm3p_opts') || 'null'); } catch (e) {}
  fillDepts(cached);
  // network calls run in the background: the form is usable straight away
  rpc('login_options').then((opts) => { if (opts && opts.departments) { fillDepts(opts); try { localStorage.setItem('vmm3p_opts', JSON.stringify(opts)); } catch (e) {} } });
  if (s && s.token) rpc('auth_me', { p_token: s.token }).then((me) => { if (me && me.ok) location.href = homeFor(me.role); else Session.clear(); });

  $('#roles').addEventListener('click', (e) => { const b = e.target.closest('.role'); if (b) setRole(b.dataset.role); });
  $('#card').addEventListener('submit', (e) => { e.preventDefault(); store.set('vmm3p_last_login', { role, emp: $('#emp').value, post: $('#post').value, store: $('#storeCode').value, dept: $('#dept').value }); doCheck(); });
  $('#btnLogin').addEventListener('click', doLogin);
  $('#pinLogin').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('#btnSave').addEventListener('click', doSave);
  $('#btnRetry').addEventListener('click', doLogin);
  $$('[data-back]').forEach((b) => b.addEventListener('click', () => { clearInterval(timer); show('s1'); }));
  $('#storeCode').addEventListener('input', (e) => e.target.value = e.target.value.toUpperCase());
})();
</script>
</body>
</html>
