<script>
let me = null;
const view = () => $('#view');
const fileBtn = (id, label) => `<label class="btn sm" style="display:inline-block;cursor:pointer">${label}<input type="file" id="${id}" accept=".xlsx,.xls,.csv" hidden></label>`;

/* ---------- v4: common master screen (search · filters · Template · Import check · Export · Add · Edit) ---------- */
function MasterView(root, cfg) {
  const st = { rows: [], q: '', f: {}, pending: null };
  root.innerHTML = `<div class="panel mhead"><div class="top"><h1>${esc(cfg.title)} <span class="mini" id="mvCount" style="font-size:13px;font-weight:400"></span></h1>
      <div class="flt">${cfg.headExtra || ''}<button class="btn o sm" data-act="tpl">⬇ Template</button>
        <label class="btn o sm" style="cursor:pointer">⬆ Import Excel<input type="file" data-act="file" accept=".xlsx,.xls,.csv" hidden></label>
        <button class="btn o sm" data-act="exp">⬇ Export Excel</button>${cfg.add ? `<button class="btn sm" data-act="add">+ ${esc(cfg.addLabel || 'Add')}</button>` : ''}</div></div>
      <div class="flt"><input data-q placeholder="🔍 ${esc(cfg.searchHint || 'Search')}" style="min-width:220px">${(cfg.filters || []).map((f) => `<select data-f="${f.id}"></select>`).join('')}</div>
      ${cfg.note ? `<div class="mini">${cfg.note}</div>` : ''}</div>
    <div id="mvImp"></div><div class="tbl" id="mvTbl"><div class="spin"></div></div>${cfg.after || ''}`;
  const $r = (s) => root.querySelector(s);
  async function load() { st.rows = await cfg.load(); fillFilters(); paint(); }
  function fillFilters() {
    (cfg.filters || []).forEach((f) => { const el = root.querySelector(`[data-f="${f.id}"]`);
      el.innerHTML = `<option value="">${esc(f.label)}: All</option>` + f.options(st.rows).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
      el.value = st.f[f.id] || ''; });
  }
  function filtered() {
    const q = st.q.toLowerCase();
    return st.rows.filter((r) => (!q || cfg.search(r).toLowerCase().includes(q)) && (cfg.filters || []).every((f) => !st.f[f.id] || f.match(r, st.f[f.id])));
  }
  function paint() {
    const f = filtered();
    $r('#mvCount').textContent = `· ${f.length.toLocaleString('en-IN')}${f.length !== st.rows.length ? ' of ' + st.rows.length.toLocaleString('en-IN') : ''} ${cfg.unit || ''}`;
    $r('#mvTbl').innerHTML = `<table><thead><tr>${cfg.columns.map((c) => `<th>${c.h}</th>`).join('')}${cfg.edit ? '<th></th>' : ''}</tr></thead><tbody>
      ${f.slice(0, 1500).map((r, i) => `<tr>${cfg.columns.map((c) => `<td>${c.v(r)}</td>`).join('')}${cfg.edit ? `<td><button class="btn o sm" data-edit="${st.rows.indexOf(r)}">✎ Edit</button></td>` : ''}</tr>`).join('')
        || `<tr><td colspan="${cfg.columns.length + 1}" class="empty">Nothing found</td></tr>`}</tbody></table>${f.length > 1500 ? '<p class="crumb">Showing first 1,500. Search to narrow.</p>' : ''}`;
  }
  function showImport(file, res) {
    st.pending = res;
    const errs = res.errors.slice(0, 4).map((e) => `row ${e.row}: ${e.msg}`).join(', ');
    $r('#mvImp').innerHTML = `<div class="note i" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>Import check · ${esc(file)}</b>
      <span>${res.newCount} new · ${res.updCount} updated${res.same ? ` · ${res.same} unchanged` : ''}${res.note ? ' ' + esc(res.note) : ''}</span>${res.errors.length ? `<span style="color:var(--red);font-weight:700">${res.errors.length} error${res.errors.length === 1 ? '' : 's'} (${esc(errs)}${res.errors.length > 4 ? ' …' : ''})</span>` : ''}
      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">${res.errors.length ? '<button class="btn o sm" data-act="errs">⬇ Download errors</button>' : ''}<button class="btn o sm" data-act="cancel">Cancel</button>
      ${res.good.length ? `<button class="btn sm" data-act="save" style="background:var(--blue)">Save ${res.good.length} good row${res.good.length === 1 ? '' : 's'}</button>` : ''}</span></div>`;
  }
  root.addEventListener('input', (e) => { if (e.target.matches('[data-q]')) { st.q = e.target.value; paint(); } });
  root.addEventListener('change', async (e) => {
    if (e.target.matches('[data-f]')) { st.f[e.target.dataset.f] = e.target.value; paint(); return; }
    if (e.target.matches('[data-act="file"]')) {
      const file = e.target.files[0]; if (!file) return; e.target.value = '';
      const raw = (await readXlsx(file)).map(normRow);
      showImport(file.name, await cfg.parse(raw, st.rows));
    }
  });
  root.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act],[data-edit]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'tpl') downloadXlsx(cfg.template(), `${cfg.file}_template.xlsx`);
    if (act === 'exp') downloadXlsx(cfg.exportRows(filtered()), `${cfg.file}_${todayIST()}.xlsx`);
    if (act === 'cancel') { st.pending = null; $r('#mvImp').innerHTML = ''; }
    if (act === 'errs') downloadXlsx(st.pending.errors.map((x) => ({ Row: x.row, Problem: x.msg, ...x.data })), `${cfg.file}_errors.xlsx`);
    if (act === 'save') {
      b.disabled = true; const r = await cfg.save(st.pending.good);
      $r('#mvImp').innerHTML = r && r.ok ? `<div class="note k">Saved. ${esc(r.msg || '')}</div>` : `<div class="note r">${esc(errText(r && r.error))}</div>`;
      st.pending = null; load();
    }
    if (act === 'add' || b.dataset.edit !== undefined) {
      const row = act === 'add' ? null : st.rows[Number(b.dataset.edit)];
      const fields = cfg.fields(row, st.rows);
      const m = modal(`<h3>${row ? '✎ Edit ' + esc(cfg.label(row)) : '+ ' + esc(cfg.addLabel || 'Add')}</h3>
        <div class="fgrid">${fields.map((f) => `<label class="lbl"${f.wide ? ' style="grid-column:1/-1"' : ''}>${esc(f.label)}${
          f.type === 'select' ? `<select class="in" name="${f.k}"${f.lock ? ' disabled' : ''}>${f.options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(f.v ?? '') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`
          : f.type === 'multi' ? `<span style="display:flex;flex-wrap:wrap;gap:8px;font-weight:400">${f.options.map(([v, l]) => `<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" name="${f.k}" value="${esc(v)}"${(f.v || []).includes(v) ? ' checked' : ''}>${esc(l)}</label>`).join('')}</span>`
          : `<input class="in" name="${f.k}" type="${f.type || 'text'}" value="${esc(f.v ?? '')}"${f.lock ? ' disabled' : ''}${f.max ? ` maxlength="${f.max}"` : ''}>`}</label>`).join('')}</div>
        <p class="mini" style="margin:0">${row ? 'Every change is saved in the Access Log (who, when, old → new).' : ''}</p>`, async (form, close) => {
        const val = {}; fields.forEach((f) => { val[f.k] = f.type === 'multi' ? [...form.querySelectorAll(`[name="${f.k}"]:checked`)].map((x) => x.value) : f.lock ? f.v : (form.elements[f.k].value || '').trim(); });
        const err = cfg.validate ? cfg.validate(val, row, st.rows) : null; if (err) return err;
        const r = await cfg.saveOne(val, row);
        if (r && r.ok) { close(); toast('Saved'); load(); return null; }
        return errText(r && r.error);
      });
      m.okLabel('Save'); m.el.querySelector('.box').style.maxWidth = '560px';
    }
  });
  load();
  return { reload: load };
}
const empOk = (e, role) => /^\d{5,}$/.test(e) || (role === 'hodept' && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
const isEmail = (v) => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const yes = (v) => !['false', 'no', 'n', '0', 'inactive'].includes(String(v ?? 'true').trim().toLowerCase());

/* ---------- Store Master ---------- */
async function StoresView(root) {
  const ur = await rpc('admin_get', { p_token: me.token, p_kind: 'users' }); const users = (ur && ur.rows) || [];
  const ams = users.filter((u) => u.role === 'am'), zfms = users.filter((u) => u.role === 'zfm');
  const uname = (e) => { const u = users.find((x) => x.emp_code === e); return u ? u.name : e; };
  MasterView(root, {
    title: 'Store Master', unit: 'stores', file: 'Store_Master', addLabel: 'Add store', add: true, edit: true,
    headExtra: '<a class="btn o sm" href="qr.html?all=1" style="text-decoration:none">🖨 All QR posters</a>',
    searchHint: 'Search code / name / city',
    note: 'Sheet header: StoreCode · StoreName · SM Name · SM Mail · AM Name · AM Code · AM Mail · ZFM Name · ZFM Code · ZFM Email · City · State · Latitude · Longitude · Active · Updated By. SM Mail feeds the Mail Center store mails. Names and State are for reference. AM / ZFM not yet in Users are created from this sheet. Lat / Lng are needed for the 500 m geo-fence.',
    load: async () => { const r = await rpc('admin_get', { p_token: me.token, p_kind: 'stores' }); return (r && r.rows) || []; },
    search: (s) => `${s.store_code} ${s.name} ${s.city || ''}`,
    filters: [
      { id: 'zfm', label: 'ZFM', options: (rs) => [...new Set(rs.map((s) => s.zfm_emp).filter(Boolean))].map((e) => [e, uname(e)]), match: (s, v) => s.zfm_emp === v },
      { id: 'am', label: 'AM', options: (rs) => [...new Set(rs.map((s) => s.am_emp).filter(Boolean))].map((e) => [e, uname(e)]), match: (s, v) => s.am_emp === v },
      { id: 'st', label: 'Status', options: () => [['1', 'Active'], ['0', 'Inactive']], match: (s, v) => String(s.active ? 1 : 0) === v },
      { id: 'gaps', label: 'Gaps', options: () => [['gps', 'GPS missing'], ['mail', 'Email missing']], match: (s, v) => v === 'gps' ? !s.lat : !(s.store_email && s.am_email && s.zfm_email) },
    ],
    columns: [
      { h: 'Code', v: (s) => `<b>${esc(s.store_code)}</b>` }, { h: 'Store', v: (s) => esc(s.name) }, { h: 'City', v: (s) => esc(s.city || '') },
      { h: 'AM', v: (s) => esc(s.am_emp ? uname(s.am_emp) : '—') }, { h: 'ZFM', v: (s) => esc(s.zfm_emp ? uname(s.zfm_emp) : '—') },
      { h: 'GPS', v: (s) => s.lat ? `${(+s.lat).toFixed(4)}, ${(+s.lng).toFixed(4)}` : '<span class="tag r">Missing</span>' },
      { h: 'Emails', v: (s) => s.store_email && s.am_email && s.zfm_email ? '<span class="tag ok">3 / 3</span>' : `<span class="tag w">${[s.store_email, s.am_email, s.zfm_email].filter(Boolean).length} / 3</span>` },
      { h: 'Status', v: (s) => `<span class="tag ${s.active ? 'ok' : 'w'}">${s.active ? 'Active' : 'Inactive'}</span>` },
      { h: 'QR', v: (s) => `<a href="qr.html?s=${esc(s.store_code)}">Poster</a>` }],
    template: () => [{ StoreCode: 'AA01', StoreName: 'Rajouri Garden', 'SM Name': 'Store Manager', 'SM Mail': 'aa01@company.com', 'AM Name': 'AM Name', 'AM Code': '20117', 'AM Mail': 'am@company.com', 'ZFM Name': 'ZFM Name', 'ZFM Code': '30001', 'ZFM Email': 'zfm@company.com', City: 'Delhi', State: 'Delhi', Latitude: 28.6415, Longitude: 77.1209, Active: 'TRUE', 'Updated By': '' }],
    exportRows: (rs) => { const sm = (c) => (users.find((u) => u.role === 'store' && u.store_code === c && u.post === 'SM') || {}).name || '';
      return rs.map((s) => ({ StoreCode: s.store_code, StoreName: s.name, 'SM Name': sm(s.store_code), 'SM Mail': s.store_email || '', 'AM Name': s.am_emp ? uname(s.am_emp) : '', 'AM Code': s.am_emp || '', 'AM Mail': s.am_email || '', 'ZFM Name': s.zfm_emp ? uname(s.zfm_emp) : '', 'ZFM Code': s.zfm_emp || '', 'ZFM Email': s.zfm_email || '', City: s.city || '', State: '', Latitude: s.lat ?? '', Longitude: s.lng ?? '', Active: s.active ? 'TRUE' : 'FALSE', 'Updated By': '' })); },
    parse: (raw, cur) => {
      const res = { good: [], errors: [], newCount: 0, updCount: 0, same: 0 }; const seen = new Set(); const people = new Map();
      raw.forEach((r, i) => {
        const g = (...ks) => { for (const k of ks) if (r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== '') return String(r[k]).trim(); return ''; };
        // accepts the Store Master sheet header: StoreCode, StoreName, SM Name, SM Mail, AM Name, AM Code, AM Mail, ZFM Name, ZFM Code, ZFM Email, City, State, Latitude, Longitude, Active, Updated By
        const o = { store_code: g('storecode', 'store_code', 'store').toUpperCase(), name: g('storename', 'name', 'store_name'), city: g('city'),
          am_emp: g('am_code', 'am_emp', 'am'), zfm_emp: g('zfm_code', 'zfm_emp', 'zfm'), lat: g('latitude', 'lat'), lng: g('longitude', 'lng', 'long'),
          active: yes(r.active), store_email: g('sm_mail', 'store_email'), am_email: g('am_mail', 'am_email'), zfm_email: g('zfm_email', 'zfm_mail') };
        const clash = (e, role) => { const u = users.find((x) => x.emp_code === e); return u && u.role !== role ? u.role : ''; };
        const bad = !/^[A-Z]{2}\d{2}$/.test(o.store_code) ? 'Store Code must be 2 letters + 2 digits' : !o.name ? 'Name missing'
          : seen.has(o.store_code) ? 'Store Code repeated in file' : (o.lat && isNaN(+o.lat)) || (o.lng && isNaN(+o.lng)) ? 'Lat / Lng not a number'
          : o.am_emp && clash(o.am_emp, 'am') ? `AM Code ${o.am_emp} already exists as ${clash(o.am_emp, 'am')} in Users` : o.zfm_emp && clash(o.zfm_emp, 'zfm') ? `ZFM Code ${o.zfm_emp} already exists as ${clash(o.zfm_emp, 'zfm')} in Users`
          : ![o.store_email, o.am_email, o.zfm_email].every(isEmail) ? 'Email format wrong' : null;
        if (bad) { res.errors.push({ row: i + 2, msg: bad, data: r }); return; }
        // AM / ZFM not in Users yet: create them from this sheet (name, code, mail). PIN is set later via the setup code.
        [['am', o.am_emp, g('am_name'), o.am_email], ['zfm', o.zfm_emp, g('zfm_name'), o.zfm_email]].forEach(([role, code, nm, em]) => {
          if (!code || users.some((x) => x.emp_code === code)) return;
          const k = people.get(code); if (!k) people.set(code, { emp_code: code, name: nm || code, role, email: em, active: true }); else if (!k.email && em) k.email = em;
        });
        seen.add(o.store_code);
        const ex = cur.find((s) => s.store_code === o.store_code);
        if (!ex) res.newCount++; else if (['name', 'city', 'am_emp', 'zfm_emp', 'store_email', 'am_email', 'zfm_email'].some((k) => (ex[k] || '') !== o[k] && !(o[k] === '' && k.endsWith('email'))) || ex.active !== o.active || (o.lat && +o.lat !== +ex.lat)) res.updCount++; else { res.same++; return; }
        res.good.push(o);
      });
      res.good.people = [...people.values()];
      if (res.good.people.length) res.note = `+ ${res.good.people.filter((x) => x.role === 'am').length} AM and ${res.good.people.filter((x) => x.role === 'zfm').length} ZFM logins will be created (PIN via setup code)`;
      return res;
    },
    save: async (rows) => { if (rows.people && rows.people.length) { const pr = await rpc('admin_users_upsert', { p_token: me.token, p_rows: rows.people }); if (!pr || !pr.ok) return pr; }
      const r = await rpc('admin_stores_upsert', { p_token: me.token, p_rows: rows }); if (r && r.ok) r.msg = `${r.added} new · ${r.updated} updated`; return r; },
    label: (s) => s.store_code,
    fields: (s) => [
      { k: 'store_code', label: 'Store code', v: s ? s.store_code : '', lock: !!s, max: 4 }, { k: 'name', label: 'Store name', v: s ? s.name : '' },
      { k: 'city', label: 'City', v: s ? s.city : '' },
      { k: 'active', label: 'Status', type: 'select', v: s ? String(s.active) : 'true', options: [['true', 'Active'], ['false', 'Inactive']] },
      { k: 'am_emp', label: 'AM', type: 'select', v: s ? s.am_emp : '', options: [['', '—']].concat(ams.map((u) => [u.emp_code, `${u.name} · ${u.emp_code}`])) },
      { k: 'zfm_emp', label: 'ZFM', type: 'select', v: s ? s.zfm_emp : '', options: [['', '—']].concat(zfms.map((u) => [u.emp_code, `${u.name} · ${u.emp_code}`])) },
      { k: 'lat', label: 'Lat', v: s ? s.lat ?? '' : '' }, { k: 'lng', label: 'Lng', v: s ? s.lng ?? '' : '' },
      { k: 'store_email', label: 'Store email', v: s ? s.store_email : '', type: 'email', wide: true },
      { k: 'am_email', label: 'AM email', v: s ? s.am_email : '', type: 'email' }, { k: 'zfm_email', label: 'ZFM email', v: s ? s.zfm_email : '', type: 'email' }],
    validate: (v, s, rows) => !/^[A-Z]{2}\d{2}$/.test(String(v.store_code).toUpperCase()) ? 'Store code must be 2 letters + 2 digits (e.g. AA01).'
      : !s && rows.some((x) => x.store_code === String(v.store_code).toUpperCase()) ? 'This store code already exists.' : !v.name ? 'Enter the store name.'
      : (v.lat && isNaN(+v.lat)) || (v.lng && isNaN(+v.lng)) ? 'Lat / Lng must be numbers.' : ![v.store_email, v.am_email, v.zfm_email].every(isEmail) ? 'Check the email format.' : null,
    saveOne: (v) => rpc('admin_stores_upsert', { p_token: me.token, p_rows: [{ ...v, store_code: String(v.store_code).toUpperCase(), active: v.active === 'true' }] }),
  });
}

/* ---------- Manpower Master ---------- */
async function ManpowerView(root) {
  const cats = (await rpc('admin_get', { p_token: me.token, p_kind: 'categories' })).rows || [];
  const sr = await rpc('admin_get', { p_token: me.token, p_kind: 'stores' }); const stores = (sr && sr.rows) || [];
  const catOf = (v) => { const s = String(v || '').trim().toLowerCase(); return cats.find((c) => c.id.toLowerCase() === s || c.name.toLowerCase() === s); };
  const toDate = (v) => { if (!v) return ''; if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10); return String(v).slice(0, 10); };
  const eff = () => root.querySelector('#mpEff').value || todayIST();
  const v = MasterView(root, {
    title: 'Manpower Master', unit: 'rows', file: 'Manpower_Master', addLabel: 'Add requirement', add: true, edit: true,
    headExtra: '<label class="mini" style="display:flex;align-items:center;gap:6px">Effective from<input type="date" id="mpEff" style="border:1px solid var(--line);border-radius:8px;padding:6px"></label>',
    searchHint: 'Search store / vendor / brand',
    note: 'Required people per store, category and brand. Every save adds a new version from the effective date; old attendance keeps the old numbers.',
    load: async () => { const r = await rpc('admin_get', { p_token: me.token, p_kind: 'manpower' }); return (r && r.rows) || []; },
    search: (x) => `${x.store_code} ${x.vendor || ''} ${x.brand || ''}`,
    filters: [
      { id: 'cat', label: 'Category', options: () => cats.map((c) => [c.id, c.name]), match: (x, v) => x.category_id === v },
      { id: 'ven', label: 'Vendor', options: (rs) => [...new Set(rs.map((x) => x.vendor).filter(Boolean))].sort().map((x) => [x, x]), match: (x, v) => x.vendor === v }],
    columns: [{ h: 'Store', v: (x) => `<b>${esc(x.store_code)}</b>` }, { h: 'Category', v: (x) => esc((catOf(x.category_id) || {}).name || x.category_id) }, { h: 'Brand', v: (x) => esc(x.brand || '—') },
      { h: 'Vendor', v: (x) => esc(x.vendor || '—') }, { h: 'Morning', v: (x) => x.morning }, { h: 'Evening', v: (x) => x.evening }, { h: 'Effective from', v: (x) => esc(x.effective_from || '') }],
    template: () => [{ 'Store Code': 'AA01', Category: 'HK', Brand: '', Vendor: 'CleanPro Services', Morning: 3, Evening: 1, 'Effective From': '' },
      { 'Store Code': 'AA01', Category: 'SEC', Brand: '', Vendor: 'Shield Guards', Morning: 1, Evening: 1, 'Effective From': '' },
      { 'Store Code': 'AA01', Category: 'TRAVEL', Brand: 'VIP', Vendor: 'Shree Travels Mktg', Morning: 1, Evening: 0, 'Effective From': '' },
      { 'Store Code': 'AA01', Category: 'CDIT', Brand: 'Prestige', Vendor: 'Prime Field Force', Morning: 1, Evening: 1, 'Effective From': '' }],
    exportRows: (rs) => rs.map((x) => ({ 'Store Code': x.store_code, Category: x.category_id, Brand: x.brand, Vendor: x.vendor, Morning: x.morning, Evening: x.evening, 'Effective From': x.effective_from })),
    parse: (raw, cur) => {
      const res = { good: [], errors: [], newCount: 0, updCount: 0, same: 0 };
      raw.forEach((r, i) => {
        const c = catOf(r.category); const o = { store_code: String(r.store_code || r.store || '').trim().toUpperCase(), category: c ? c.id : '', brand: String(r.brand || '').trim(),
          vendor: String(r.vendor || '').trim(), morning: Number(r.morning || 0), evening: Number(r.evening || 0), effective_from: toDate(r.effective_from) };

          : (c.brands || []).length && !c.brands.includes(o.brand) ? `Brand must be one of ${c.brands.join(' / ')}` : !(c.brands || []).length && o.brand ? 'This category has no brand, leave it blank'
          : [o.morning, o.evening].some((n) => !Number.isInteger(n) || n < 0 || n > 50) ? 'Morning / Evening must be 0–50' : null;
        if (bad) { res.errors.push({ row: i + 2, msg: bad, data: r }); return; }
        const ex = cur.find((x) => x.store_code === o.store_code && x.category_id === o.category && (x.brand || '') === o.brand);

        res.good.push(o);

      { k: 'morning', label: 'Morning', type: 'number', v: x ? x.morning : 1 }, { k: 'evening', label: 'Evening', type: 'number', v: x ? x.evening : 0 },

      if (!(c.brands || []).length && val.brand) return 'This category has no brand.'; if (+val.morning < 0 || +val.evening < 0) return 'Numbers must be 0 or more.'; return null; },
    saveOne: (val) => rpc('admin_manpower_upload', { p_token: me.token, p_rows: [{ ...val, morning: +val.morning, evening: +val.evening }], p_effective: val.effective_from || todayIST() }),

      <div class="panel"><h3>Login security</h3>
        <label class="row"><span class="grow">Wrong PIN limit</span><input class="in" type="number" id="sTries" min="1" max="10" style="width:90px"></label>
        <label class="row"><span class="grow">Lock time (minutes)</span><input class="in" type="number" id="sLock" min="1" max="60" style="width:90px"></label>
        <label class="row"><span class="grow">Store auto-unlock (minutes idle)</span><input class="in" type="number" id="sIdle" min="5" max="240" style="width:90px"></label></div>
      <div class="panel"><h3>Geo-fence &amp; alerts</h3>
        <label class="row"><span class="grow">Test mode (no GPS check)</span><input type="checkbox" id="sTest" style="width:22px;height:22px"></label>
        <label class="row"><span class="grow">Radius (metres)</span><input class="in" type="number" id="sRadius" min="50" max="3800000" style="width:120px"></label>
        <label class="row"><span class="grow">Storage alert at (%)</span><input class="in" type="number" id="sAlert" min="10" max="99" style="width:90px"></label></div>
    </div>
    <div class="note w" id="testWarn" hidden>Test mode is ON: punches are accepted from anywhere. Turn it OFF before go-live.</div>
    <div class="k5" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
      <div class="panel"><h3>Dashboard alerts start at</h3>
        <label class="row"><span class="grow">Morning shift</span><input class="in" type="time" id="sAm" style="width:130px"></label>
        <label class="row"><span class="grow">Evening shift</span><input class="in" type="time" id="sAe" style="width:130px"></label>
        <p class="crumb" style="margin:0">Before this time the “Action needed” cards stay quiet, so staff can arrive.</p></div>
      <div class="panel"><h3>Store can ask AM to change</h3>
        <label class="row"><span class="grow">Comp-off</span><input type="checkbox" data-et="compoff" style="width:22px;height:22px"></label>
        <label class="row"><span class="grow">Staff details (name / vendor / brand)</span><input type="checkbox" data-et="staff" style="width:22px;height:22px"></label>
        <label class="row"><span class="grow">Missed OUT time</span><input type="checkbox" data-et="missed_out" style="width:22px;height:22px" disabled></label>
        <label class="row"><span class="grow">Missed IN</span><input type="checkbox" data-et="missed_in" style="width:22px;height:22px" disabled></label>
        <p class="crumb" style="margin:0">Every request needs a reason; AM approves. Missed IN / OUT: switch on later when decided.</p></div>
      <div class="panel"><h3>Invites</h3>
        <label class="row"><span class="grow">Setup code valid for (days)</span><input class="in" type="number" id="sDays" min="1" max="30" style="width:90px"></label>
        <p class="crumb" style="margin:0">AM / ZFM / HO / Admin need this one-time code (from the invite mail) to create their first PIN.</p></div>
    </div>
    <div class="panel" id="tdPanel"><h3>Test data</h3><p class="crumb" id="tdText">Checking…</p>
      <div class="row"><button class="btn red sm" id="tdDel">Delete all test data</button></div></div>`;
  const s = (await rpc('admin_get', { p_token: me.token, p_kind: 'settings' })).rows;
  $('#sTries').value = s.pin_max_tries; $('#sLock').value = s.pin_lock_min; $('#sIdle').value = s.store_idle_min;
  $('#sTest').checked = s.test_mode; $('#sRadius').value = s.radius_m; $('#sAlert').value = s.storage_alert_pct; $('#testWarn').hidden = !s.test_mode;
  $('#stSave').addEventListener('click', async () => {
    const r = await rpc('admin_settings_set', { p_token: me.token, p: { pin_max_tries: +$('#sTries').value, pin_lock_min: +$('#sLock').value, store_idle_min: +$('#sIdle').value,
      test_mode: $('#sTest').checked, radius_m: +$('#sRadius').value, storage_alert_pct: +$('#sAlert').value,
      alert_m: $('#sAm').value, alert_e: $('#sAe').value, setup_days: +$('#sDays').value, edit_types: $$('[data-et]').filter((c) => c.checked).map((c) => c.dataset.et) } });
    $('#testWarn').hidden = !$('#sTest').checked; toast(r && r.ok ? 'Settings saved' : errText(r && r.error));
  });
  $('#sAm').value = (s.alert_m || '10:00').slice(0, 5); $('#sAe').value = (s.alert_e || '16:00').slice(0, 5); $('#sDays').value = s.setup_days || 7;
  $$('[data-et]').forEach((c) => { c.checked = (s.edit_types || []).includes(c.dataset.et); });
  async function tdCount() { const r = await rpc('admin_test_data', { p_token: me.token, p_action: 'count' });
    $('#tdText').textContent = r && r.ok ? (r.stores ? `${r.stores} test stores, ${r.users} test users, ${r.punches.toLocaleString('en-IN')} test punches. Delete them before go-live.` : 'No test data.') : errText(r && r.error);
    $('#tdDel').hidden = !(r && r.stores); }
  $('#tdDel').addEventListener('click', async (e) => {
    const b = e.currentTarget; if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again: delete ALL test stores, users, punches'; return; }
    b.disabled = true; const r = await rpc('admin_test_data', { p_token: me.token, p_action: 'delete' }); b.disabled = false; b.dataset.confirm = ''; b.textContent = 'Delete all test data';
    toast(r && r.ok ? `${r.stores} test stores deleted` : errText(r && r.error)); tdCount(); });
  tdCount();
  // storage
  $('#psFrom').value = monthStart(todayIST()); $('#psTo').value = todayIST();
  async function usage() {
    const u = await photoFn({ action: 'usage', session: me.token });
    if (!u || !u.ok) { $('#psText').textContent = 'Could not read storage (' + ((u && u.error) || 'error') + ')'; return; }
    const p = Math.round((u.bytes / u.limit) * 100);
    $('#psText').textContent = `${(u.bytes / 1048576).toFixed(0)} MB of 1 GB used · ${u.photos.toLocaleString('en-IN')} photos`;
    $('#psPct').textContent = p + '%'; $('#psPct').style.color = p >= s.storage_alert_pct ? 'var(--red)' : 'var(--ok)';
    $('#psBar').style.width = Math.min(p, 100) + '%'; $('#psBar').style.background = p >= s.storage_alert_pct ? 'var(--red)' : p >= 50 ? 'var(--amb)' : 'var(--ok)';
  }
  $('#psZip').addEventListener('click', async () => {
    $('#psMsg').textContent = 'Preparing list…';
    const l = await photoFn({ action: 'list', session: me.token, from: $('#psFrom').value, to: $('#psTo').value });
    if (!l || !l.ok) { $('#psMsg').textContent = 'Error: ' + ((l && l.error) || ''); return; }
    if (!l.files.length) { $('#psMsg').textContent = 'No photos in these dates.'; return; }
    const zip = new JSZip(); let done = 0;
    for (const f of l.files) {
      try { const b = await (await fetch(f.url)).blob(); zip.file(f.path.split('/').slice(1).join('/'), b); } catch (e) {}
      done++; if (done % 25 === 0) $('#psMsg').textContent = `Downloading ${done} / ${l.files.length}…`;
    }
    $('#psMsg').textContent = 'Making ZIP…';
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Selfies_${$('#psFrom').value}_${$('#psTo').value}.zip`; a.click();
    $('#psMsg').textContent = `${l.files.length} photos saved in the ZIP. Keep it on your drive, then remove from portal.`;
  });
  $('#psDel').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = `Tap again: remove photos ${$('#psFrom').value} to ${$('#psTo').value}`; return; }
    b.disabled = true; $('#psMsg').textContent = 'Removing…';
    const r = await photoFn({ action: 'delete', session: me.token, from: $('#psFrom').value, to: $('#psTo').value });
    b.disabled = false; b.dataset.confirm = ''; b.textContent = 'Downloaded, remove from portal';
    $('#psMsg').textContent = r && r.ok ? `${r.deleted} photos removed.` : 'Error: ' + ((r && r.error) || ''); usage();
  });
  usage();
}

/* ---------- Access Log ---------- */
function AccessView(root) {
  const st = { role: 'store', date: todayIST() };
  root.innerHTML = `<div class="top"><h1>Access Log</h1><div class="flt"><input type="date" id="alDate"><button class="btn o sm" id="alXls">⬇ Excel</button></div></div>
    <div class="seg blue" id="alTabs"></div><div class="k5" id="alKpi"></div>
    <div class="k5" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start">
      <div class="tbl" id="alUsers"></div><div class="tbl" id="alResets"></div></div>`;
  $('#alDate').value = st.date; $('#alDate').max = todayIST();
  let data = null;
  const names = { store: 'Store', am: 'AM', zfm: 'ZFM', hodept: 'HO Dept', admin: 'Admin' };
  const ev = { login: ['ok', 'Login'], logout: ['i', 'Logout'], auto_logout: ['w', 'Auto logout'], pin_lock: ['r', 'PIN lock'], pin_set: ['i', 'PIN created'], pin_reset: ['w', 'PIN reset'], store_busy: ['w', 'Blocked: store open'], settings: ['i', 'Settings'] };
  async function load() {
    $('#alKpi').innerHTML = '<div class="spin"></div>';
    data = await rpc('access_view', { p_token: me.token, p_role: st.role, p_date: st.date });
    if (!data || !data.ok) { $('#alKpi').innerHTML = `<div class="note r">${esc(errText(data && data.error))}</div>`; return; }
    const c = data.counts || {};
    $('#alTabs').innerHTML = Object.keys(names).map((k) => `<button data-r="${k}" class="${k === st.role ? 'on' : ''}">${names[k]} (${c[k] || 0})</button>`).join('');
    const k = data.kpi;
    $('#alKpi').innerHTML = kpi('Logged in on this day', k.today, `<span class="p" style="color:var(--ok)">${pct(k.today, k.total)}%</span>`) + kpi('Logged in till date', k.ever, `<span class="p">${pct(k.ever, k.total)}%</span>`)
      + kpi('Never logged in', k.total - k.ever, '', 'var(--red)') + kpi('Auto logouts', k.auto_logout) + kpi('PIN resets', k.pin_resets);
    $('#alUsers').innerHTML = `<table><thead><tr><th>${st.role === 'store' ? 'Store' : 'Emp'}</th><th>User</th><th>Last login</th><th>Event on this day</th></tr></thead><tbody>
      ${data.users.map((u) => { const e = u.last_event ? ev[u.last_event.event] || ['i', u.last_event.event] : null;
        return `<tr><td>${esc(st.role === 'store' ? u.store_code : u.emp_code)}</td><td>${esc(u.name)}${u.post ? ' · ' + esc(u.post) : ''}${u.dept ? ' · ' + esc(u.dept) : ''}</td>
        <td>${esc(u.last_login || '—')}</td><td>${u.active_now ? '<span class="tag ok">Active now</span> ' : ''}${e ? `<span class="tag ${e[0]}">${e[1]} ${u.last_event.at}</span>` : u.ever ? '<span class="tag w">Not on this day</span>' : '<span class="tag r">Never logged in</span>'}</td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">No users</td></tr>'}</tbody></table>`;
    $('#alResets').innerHTML = `<table><thead><tr><th>PIN reset</th><th>Reset by</th><th>Time</th></tr></thead><tbody>
      ${data.resets.map((x) => `<tr><td>${esc(x.name || x.emp)}${x.store ? ' · ' + esc(x.store) : ''}</td><td>${esc(x.by_name || x.by || '—')}</td><td>${x.at}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No PIN resets on this day</td></tr>'}</tbody></table>`;
  }
  root.addEventListener('click', (e) => { const b = e.target.closest('#alTabs button'); if (b) { st.role = b.dataset.r; load(); } });
  $('#alDate').addEventListener('change', (e) => { st.date = e.target.value || todayIST(); load(); });
  $('#alXls').addEventListener('click', () => { if (data) downloadXlsx(data.users.map((u) => ({ Role: names[st.role], Emp: u.emp_code, Name: u.name, Post: u.post, Store: u.store_code, Dept: u.dept, 'Last login': u.last_login, 'Ever logged in': u.ever ? 'Yes' : 'No',
      'Event on day': u.last_event ? u.last_event.event + ' ' + u.last_event.at : '' })), `Access_${st.role}_${st.date}.xlsx`); });
  load();
}


/* ---------- Consent Log ---------- */
function ConsentView(root) {
  const st = { from: monthStart(todayIST()), to: todayIST(), kind: '' };
  root.innerHTML = `<div class="top"><h1>Consent Log</h1><div class="flt"><input type="date" id="cnFrom"> to <input type="date" id="cnTo">
      <select id="cnKind"><option value="">All</option><option value="associate">Associate (own phone)</option><option value="mod_associate">Associate via MOD</option><option value="user">Store / AM / ZFM / HO users</option></select>
      <button class="btn o sm" id="cnXls">⬇ Excel</button><a class="btn o sm" href="privacy.html" target="_blank" style="text-decoration:none">Privacy policy</a></div></div>
    <div class="note i">Every consent to camera and location is recorded with date, time, device and policy version (current: ${esc(CONFIG.policy)}). Changing the policy version asks everyone again.</div>
    <div class="k5" id="cnKpi"></div><div class="tbl" id="cnTbl"></div>`;
  $('#cnFrom').value = st.from; $('#cnTo').value = st.to; $('#cnFrom').max = $('#cnTo').max = todayIST();
  let data = null;
  const kn = { associate: 'Associate · own phone', mod_associate: 'Associate · via MOD', user: 'User login' };
  async function load() {
    $('#cnKpi').innerHTML = '<div class="spin"></div>';
    data = await rpc('consent_view', { p_token: me.token, p_from: st.from, p_to: st.to, p_kind: st.kind || null });
    if (!data || !data.ok) { $('#cnKpi').innerHTML = `<div class="note r">${esc(errText(data && data.error))}</div>`; return; }
    const c = data.counts || {};
    $('#cnKpi').innerHTML = kpi('Associates · own phone', c.associate || 0) + kpi('Associates · via MOD', c.mod_associate || 0) + kpi('User logins', c.user || 0);
    $('#cnTbl').innerHTML = `<table><thead><tr><th>Date & time</th><th>Type</th><th>Store</th><th>Person</th><th>Confirmed by</th><th>Policy</th><th>Language</th><th>Device</th></tr></thead><tbody>
      ${data.rows.map((r) => `<tr><td>${esc(r.at)}</td><td>${esc(kn[r.kind] || r.kind)}</td><td>${esc(r.store || '—')}</td>
        <td>${esc(r.associate || r.user_name || r.emp || '—')}${r.associate && r.emp ? ' · ' + esc(r.emp) : ''}</td>
        <td>${r.mod_emp ? esc((r.mod_name || '') + ' · ' + r.mod_emp) : 'Self'}</td><td>${esc(r.version)}</td><td>${esc(r.lang || '—')}</td>
        <td title="${esc(r.ua || '')}">${esc((r.device || '').slice(0, 10))}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">No consent records in these dates</td></tr>'}</tbody></table>`;
  }
  root.addEventListener('change', (e) => {
    if (e.target.id === 'cnFrom') st.from = e.target.value; if (e.target.id === 'cnTo') st.to = e.target.value; if (e.target.id === 'cnKind') st.kind = e.target.value;
    if (['cnFrom', 'cnTo', 'cnKind'].includes(e.target.id)) load();
  });
  $('#cnXls').addEventListener('click', () => { if (data) downloadXlsx(data.rows.map((r) => ({ 'Date & time': r.at, Type: kn[r.kind] || r.kind, Store: r.store, Person: r.associate || r.user_name || r.emp,
    Code: r.emp, 'Confirmed by': r.mod_emp ? `${r.mod_name || ''} ${r.mod_emp}` : 'Self', Policy: r.version, Language: r.lang, Device: r.device, Browser: r.ua })), `Consent_${st.from}_${st.to}.xlsx`); });
  load();
}

function ViewAsView(root) {
  root.innerHTML = `<div class="top"><h1>View as user</h1><div class="flt"><select id="vaRole"><option value="">All roles</option><option value="store">Store (SM / ASM / DM)</option><option value="am">AM</option><option value="zfm">ZFM</option><option value="hodept">HO Dept</option></select>
      <input id="vaQ" placeholder="Search name / emp / store"></div></div>
    <div class="note i">Opens the portal in a new tab exactly as this person sees it. Read-only: nothing can be punched, reset or changed. The store's own login is not blocked. Every view is saved in the Access Log.</div>
    <div class="tbl" id="vaTbl"><div class="spin"></div></div>`;
  const $r = (x) => root.querySelector(x); let rows = [];
  const roleName = { store: 'Store', am: 'AM', zfm: 'ZFM', hodept: 'HO Dept' };
  function paint() {
    const qv = $r('#vaQ').value.trim().toLowerCase(), rv = $r('#vaRole').value;
    const f = rows.filter((u) => u.role !== 'admin' && u.active !== false && (!rv || u.role === rv) && (!qv || `${u.name} ${u.emp_code} ${u.store_code || ''} ${u.dept || ''}`.toLowerCase().includes(qv)));
    $r('#vaTbl').innerHTML = `<table><thead><tr><th>Emp</th><th>Name</th><th>Role</th><th>Post / Dept</th><th>Store</th><th>Last login</th><th></th></tr></thead><tbody>
      ${f.slice(0, 300).map((u) => `<tr><td>${esc(u.emp_code)}</td><td>${esc(u.name)}</td><td>${esc(roleName[u.role] || u.role)}</td><td>${esc(u.post || u.dept || '—')}</td><td>${esc(u.store_code || '—')}</td><td>${esc(u.last_login || '—')}</td>
        <td><button class="btn o sm" data-va="${esc(u.emp_code)}">👁 View as</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">No users</td></tr>'}</tbody></table>
      ${f.length > 300 ? `<p class="crumb">Showing 300 of ${f.length}. Search to narrow.</p>` : ''}`;
  }
  root.addEventListener('input', paint); root.addEventListener('change', paint);
  root.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-va]'); if (!b) return;
    const w = window.open('about:blank', '_blank');
    b.disabled = true; const r = await rpc('admin_view_as', { p_token: me.token, p_emp: b.dataset.va }); b.disabled = false;
    if (!r || !r.ok) { if (w) w.close(); return toast(errText(r && r.error)); }
    store.set('vmm3p_view_handoff', { ...r, at: Date.now() });
    const url = homeFor(r.role) + '?view=1';
    if (w) w.location.href = url; else location.href = url;
  });
  rpc('admin_get', { p_token: me.token, p_kind: 'users' }).then((r) => { rows = (r && r.rows) || []; paint(); });
}

(async function () {
  Layout.apply();
  me = await requireSession(['admin']); if (!me) return;
  const items = [{ grp: 'OPERATE' }, { id: 'live', label: 'Live Dashboard' }, { id: 'churn', label: 'Staff Churn' }, { id: 'reports', label: 'Attendance Reports' },
    { id: 'approvals', label: 'Approvals' }, { id: 'team', label: 'Store team' },
    { grp: 'MASTERS' }, { id: 'stores', label: 'Store Master' }, { id: 'manpower', label: 'Manpower Master' }, { id: 'users', label: 'Users & PIN' }, { id: 'depts', label: 'HO Dept Master' },
    { grp: 'ADMIN' }, { id: 'mail', label: 'Mail Center (.eml)' }, { id: 'viewas', label: 'View as User' }, { id: 'settings', label: 'Settings' }, { id: 'access', label: 'Access Log' }, { id: 'consent', label: 'Consent Log' }];
  Shell(me, items, (id) => {
    const v = view(); v.innerHTML = '';
    ({ live: () => LiveDash(v, me), churn: () => ChurnView(v, me), reports: () => ReportsView(v), stores: () => StoresView(v), manpower: () => ManpowerView(v),
       users: () => UsersView(v), settings: () => SettingsView(v), access: () => AccessView(v), consent: () => ConsentView(v), viewas: () => ViewAsView(v),
       approvals: () => ApprovalsView(v, me), team: () => StoreTeamView(v, me), depts: () => DeptView(v), mail: () => MailView(v) })[id]();
  });
})();
</script>
