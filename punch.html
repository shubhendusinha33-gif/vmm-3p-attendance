<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://phyllziizajuphenpwxz.supabase.co; media-src 'self' blob:; connect-src 'self' https://phyllziizajuphenpwxz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punch · 3rd Party Attendance</title>
<meta name="theme-color" content="#1565C0">
<link rel="preconnect" href="https://phyllziizajuphenpwxz.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" media="print" onload="this.media=\'all\'">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="hdr">
  <div class="t"><b id="hTitle">Punch</b><small id="hSub"></small></div>
  <span id="langSlot"></span>
  <button class="x" id="btnBack" hidden>✕</button>
</header>

<main class="wrap">
  <div id="loading" class="spin"></div>

  <!-- form -->
  <section id="form" hidden style="display:flex;flex-direction:column;gap:12px">
    <div id="storeNote" class="note k"></div>
    <div id="gpsNote" class="note i" data-t="getLocation"></div>
    <div id="modNote" class="note w" hidden></div>

    <div><div class="lbl" data-t="department"></div><div class="pills" id="cats"></div></div>
    <div id="brandWrap" hidden><div class="lbl" data-t="brand"></div><div class="pills" id="brands"></div></div>

    <div id="rosterWrap" hidden>
      <div class="lbl" data-t="selectAssociate"></div>
      <div class="list" id="roster"></div>
    </div>

    <div class="field" id="vendorWrap"><label class="lbl" for="vendor" data-t="vendor"></label>
      <select class="in" id="vendor"></select>
      <input class="in" id="vendorOther" style="margin-top:6px" hidden maxlength="60">
    </div>
    <div class="field" id="nameWrap"><label class="lbl" for="name" data-t="yourName"></label>
      <input class="in" id="name" maxlength="40" autocomplete="name" data-tp="nameHint"></div>
    <div id="lookupNote" class="note i" hidden></div>
    <label id="modConsentWrap" hidden style="display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer">
      <input type="checkbox" id="modConsent" style="width:22px;height:22px;flex-shrink:0"><span data-t="modConsent"></span></label>
    <div id="err" class="note r" hidden></div>
    <button class="btn" id="btnPunch" data-t="punchIn"></button>
    <div class="note i" id="noPhone" data-t="noPhone"></div>
  </section>

  <!-- photo -->
  <section id="photo" hidden style="display:flex;flex-direction:column;gap:12px;align-items:stretch">
    <h2 class="ttl" data-t="photoToday"></h2>
    <p class="sub" id="photoWho" style="margin:0"></p>
    <div class="camwrap"><video id="camVideo" autoplay playsinline muted></video><img id="photoPrev" alt="" hidden><div class="ring" id="photoRing"></div>
      <div class="livebar" id="liveBar" hidden></div><div class="livesub" id="liveSub" hidden></div></div>
    <div class="liveprog" id="liveProg" hidden><i></i><i></i><i></i></div>
    <p class="sub" style="margin:0" id="photoHint" data-t="photoHint"></p>
    <div id="liveFailBox" class="note r" hidden></div>
    <button class="shutter" id="btnShutter" aria-label="Capture"></button>
    <div class="row" id="reviewBtns" hidden><button class="btn o grow" id="btnRetake" data-t="retake"></button><button class="btn grow" id="btnUse" data-t="usePhoto"></button></div>
    <div id="camFallback" hidden style="display:flex;flex-direction:column;gap:8px">
      <div class="note w" data-t="noCamera"></div>
      <label class="btn" for="cam" style="text-align:center">📷 <span data-t="takePhoto"></span></label>
      <input id="cam" type="file" accept="image/*" capture="user" hidden></div>
    <div id="photoErr" class="note r" hidden></div>
  </section>

  <!-- done -->
  <section id="done" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="check">✓</div>
    <h2 class="ttl" id="doneTitle"></h2>
    <p class="sub" id="doneSub" style="margin:0"></p>
    <div class="list" id="doneList"></div>
    <button class="btn" id="btnAgain" data-t="nextPunch"></button>
  </section>

  <p class="foot" id="credit"></p>
</main>

<script src="assets/app.js"></script>
<script>
const q = new URLSearchParams(location.search);
let ctx = null, modToken = null, pos = null, cat = null, brand = '', lastLookup = null, punchRes = null, lookTimer = null, stopCam = null, shot = null;

function show(id) { ['loading','form','photo','done'].forEach((s) => $('#' + s).hidden = s !== id); }
function err(msg, el = '#err') { $(el).hidden = !msg; $(el).textContent = msg || ''; }

async function locate() {
  $('#gpsNote').className = 'note i'; $('#gpsNote').textContent = t('getLocation');
  pos = await getPosition();
  if (ctx.test_mode) { $('#gpsNote').className = 'note w'; $('#gpsNote').textContent = t('testMode'); return; }
  if (!pos) { $('#gpsNote').className = 'note r'; $('#gpsNote').innerHTML = esc(t('noGps')) + ' <button class="link" id="gpsRetry">↻</button>'; $('#gpsRetry').onclick = locate; return; }
  $('#gpsNote').className = 'note k';
  $('#gpsNote').textContent = '📍 ' + t('locFound', { a: Math.round(pos.acc || 0) });
}

function paintCats() {
  $('#cats').innerHTML = ctx.categories.map((c) => `<button type="button" class="pill${cat && cat.id === c.id ? ' on' : ''}" data-c="${c.id}">${esc(catName(c))}</button>`).join('');
}
function paintBrands() {
  const b = cat ? cat.brands : [];
  $('#brandWrap').hidden = !b.length;
  $('#brands').innerHTML = b.map((x) => `<button type="button" class="pill${brand === x ? ' on' : ''}" data-b="${esc(x)}">${esc(x)}</button>`).join('');
}
function paintVendors() {
  const v = cat ? cat.vendors : [];
  $('#vendor').innerHTML = `<option value="">${esc(t('selectVendor'))}</option>` + v.map((x) => `<option>${esc(x)}</option>`).join('') + `<option value="__other">${esc(t('otherVendor'))}</option>`;
  if (v.length === 1) $('#vendor').value = v[0];
  $('#vendorOther').hidden = true;
}
async function paintRoster() {
  if (!modToken || !cat) { $('#rosterWrap').hidden = true; return; }
  $('#rosterWrap').hidden = false; $('#roster').innerHTML = '<div class="spin"></div>';
  const r = await rpc('store_roster', { p_token: modToken, p_cat: cat.id });
  const rows = (r && r.rows) || [];
  $('#roster').innerHTML = rows.map((a) => `<div class="li click" data-n="${esc(a.name)}" data-b="${esc(a.brand)}" data-v="${esc(a.vendor || '')}">
      <div class="m">${esc(a.name)}<span>${esc(a.code)}${a.brand ? ' · ' + esc(a.brand) : ''} · ${a.last_kind ? a.last_kind + ' ' + a.last_time : '—'}</span></div>
      <span class="tag ${a.last_kind === 'IN' ? 'w' : 'ok'}">${a.last_kind === 'IN' ? 'OUT' : 'IN'}</span></div>`).join('')
    + `<div class="li click" data-new="1"><div class="m">${esc(t('newName'))}</div><span class="tag ok">+</span></div>`;
}

async function lookup() {
  const name = $('#name').value.trim();
  if (!cat || name.length < 2 || (cat.brands.length && !brand)) { $('#lookupNote').hidden = true; lastLookup = null; setBtn('IN'); return; }
  const r = await rpc('punch_lookup', { p_store: ctx.store.code, p_cat: cat.id, p_brand: brand, p_name: name });
  if (!r || !r.ok) return;
  lastLookup = r; $('#lookupNote').hidden = false;
  $('#lookupNote').textContent = r.exists ? t('alreadyReg', { code: r.code }) : t('newReg');
  setBtn(r.next);
}
function setBtn(kind) { $('#btnPunch').textContent = kind === 'OUT' ? t('punchOut') : t('punchIn'); $('#btnPunch').classList.toggle('blue', kind === 'OUT'); }

async function doPunch() {
  err();
  if (!cat) return err(t('chooseCat'));
  if (cat.brands.length && !brand) return err(t('brandRequired'));
  const name = $('#name').value.trim();
  if (!/^[\p{L} .]{2,40}$/u.test(name)) return err(t('badName'));
  if (modToken && !$('#modConsent').checked) return err(t('consentRequired'));
  if (!ctx.test_mode) { await locate(); if (!pos) return err(t('noGps')); }
  let vendor = $('#vendor').value; if (vendor === '__other') vendor = $('#vendorOther').value.trim();
  $('#btnPunch').disabled = true;
  const r = await rpc('punch_submit', { p_store: ctx.store.code, p_cat: cat.id, p_brand: brand, p_vendor: vendor || null, p_name: name,
    p_lat: pos ? pos.lat : null, p_lng: pos ? pos.lng : null, p_device: deviceId(), p_mod_token: modToken,
    p_consent: true, p_policy: CONFIG.policy });
  $('#btnPunch').disabled = false;
  if (!r || !r.ok) {
    if (r && r.error === 'OUT_OF_RANGE') return err(t('outside', { d: r.dist_m, r: r.radius_m }));
    if (r && r.error === 'NO_GPS') return err(t('noGps'));
    return err(errText(r && r.error));
  }
  punchRes = r;
  if (r.photo_required) { $('#photoWho').textContent = `${r.name} · ${catName(cat)} · ${ctx.store.code}`; err('', '#photoErr'); show('photo'); openCam(); return; }
  showDone();
}

async function openCam() {
  shot = null; $('#photoPrev').hidden = true; $('#camVideo').hidden = false; $('#photoRing').hidden = false; $('#photoRing').className = 'ring';
  $('#btnShutter').hidden = true; $('#reviewBtns').hidden = true; $('#camFallback').hidden = true; $('#liveFailBox').hidden = true;
  try { if (stopCam) stopCam(); stopCam = await startCamera($('#camVideo')); }
  catch (e) { $('#camVideo').hidden = true; $('#camFallback').hidden = false; liveResult = 'skip'; return; }
  liveResult = await runLive();
  if (liveResult === 'pass') { setTimeout(capture, 350); return; }
  liveUi(null);                       // skip / fail: normal shutter, result is saved with the photo
  $('#btnShutter').hidden = false;
}

/* ---------- live face check: one random challenge (blink / left / right), on the phone, free ---------- */
let liveResult = null;
const LIVE_TRIES = 3;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function loadFaceApi() {
  if (!loadFaceApi.p) loadFaceApi.p = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'assets/face/face-api.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); })
    .then(() => Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('assets/face'), faceapi.nets.faceLandmark68Net.loadFromUri('assets/face')]));
  return loadFaceApi.p;
}
function liveUi(text, step, sub, cls) {
  $('#liveBar').hidden = !text; $('#liveBar').textContent = text || '';
  $('#liveSub').hidden = !sub; $('#liveSub').textContent = sub || '';
  $('#liveProg').hidden = step == null; $$('#liveProg i').forEach((i, k) => i.classList.toggle('on', step != null && k < step));
  $('#photoHint').hidden = !!text;
  if (cls !== undefined) $('#photoRing').className = 'ring' + (cls ? ' ' + cls : '');
}
const pdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const eyeOpen = (e) => (pdist(e[1], e[5]) + pdist(e[2], e[4])) / (2 * pdist(e[0], e[3]));
async function runLive() {
  liveUi(t('liveLoading'), 0, '', '');
  try { await Promise.race([loadFaceApi(), sleep(20000).then(() => { throw new Error('slow'); })]); } catch (e) { return 'skip'; }
  const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 });
  for (let n = 1; n <= LIVE_TRIES; n++) {
    const ch = ['blink', 'left', 'right'][Math.floor(Math.random() * 3)];
    const r = await liveChallenge(opt, ch);
    if (r !== 'fail') return r;
    if (n < LIVE_TRIES) {
      liveUi(t('liveFail'), 1, '', 'bad');
      $('#liveFailBox').hidden = false; $('#liveFailBox').innerHTML = `${esc(t('liveFailWhy'))}<br><button class="btn sm" id="liveAgain" style="margin-top:8px">${esc(t('liveTry', { n: LIVE_TRIES - n }))}</button>`;
      await new Promise((res) => $('#liveAgain').addEventListener('click', res, { once: true }));
      $('#liveFailBox').hidden = true;
    }
  }
  $('#liveFailBox').hidden = false; $('#liveFailBox').textContent = `${t('liveFail')}. ${t('liveSaved')}`;
  return 'fail';
}
async function liveChallenge(opt, ch) {
  const v = $('#camVideo'), t0 = Date.now(); let stage = 0, still = 0, eyes = [], yaw0 = 0, blinks = 0, closed = false, base = 0;
  liveUi(t('liveLook'), 1, '', '');
  while (Date.now() - t0 < 15000) {
    if (!v.videoWidth) { await sleep(150); continue; }
    let d; try { d = await faceapi.detectSingleFace(v, opt).withFaceLandmarks(); } catch (e) { return 'skip'; }
    if (!d) { still = 0; liveUi($('#liveBar').textContent, stage ? 2 : 1, t('liveNoFace')); await sleep(40); continue; }
    const lm = d.landmarks, le = lm.getLeftEye(), re = lm.getRightEye(), nose = lm.getNose()[3];
    const open = (eyeOpen(le) + eyeOpen(re)) / 2, iod = pdist(le[0], re[3]), yaw = (nose.x - (le[0].x + re[3].x) / 2) / iod;
    if (stage === 0) {
      eyes.push(open); yaw0 += yaw; still++; liveUi(t('liveLook'), 1, t('liveFound'));
      if (still >= 4) { stage = 1; yaw0 /= still; base = eyes.sort((a, b) => a - b)[Math.floor(eyes.length / 2)];
        liveUi(t(ch === 'blink' ? 'liveBlink' : ch === 'left' ? 'liveLeft' : 'liveRight'), 2, ch === 'blink' ? t('liveSeen', { n: 0, m: 2 }) : '', 'ask'); }
    } else if (ch === 'blink') {
      if (!closed && open < base * 0.75) closed = true;
      else if (closed && open > base * 0.88) { closed = false; blinks++; liveUi($('#liveBar').textContent, 2, t('liveSeen', { n: blinks, m: 2 })); }
      if (blinks >= 2) break;
    } else {
      const dy = yaw - yaw0;            // camera frames are not mirrored: turning to your LEFT moves the nose to the right of the frame
      if ((ch === 'left' && dy > 0.22) || (ch === 'right' && dy < -0.22)) break;
    }
    await sleep(25);
  }
  if (Date.now() - t0 >= 15000) return 'fail';
  liveUi(t('livePass'), 3, '', 'good');
  return 'pass';
}
async function capture() {
  const v = $('#camVideo'); if (!v.videoWidth) return;
  $('#btnShutter').disabled = true;
  shot = await compressDrawable(v, v.videoWidth, v.videoHeight, 8, 240, 320, true);
  $('#btnShutter').disabled = false;
  if (stopCam) { stopCam(); stopCam = null; }
  $('#photoPrev').src = shot.b64; $('#photoPrev').hidden = false; $('#camVideo').hidden = true; $('#photoRing').hidden = true; liveUi(liveResult === 'pass' ? t('livePass') : null, liveResult === 'pass' ? 3 : null, '');
  $('#btnShutter').hidden = true; $('#reviewBtns').hidden = false;
}
async function sendPhoto() {
  if (!shot) return;
  err('', '#photoErr'); $('#btnUse').disabled = true;
  await rpc('punch_live', { p_photo_token: punchRes.photo_token, p_result: liveResult || 'skip' });
  const r = await photoFn({ action: 'upload', token: punchRes.photo_token, b64: shot.b64 });
  $('#btnUse').disabled = false;
  if (!r || !r.ok) return err(t('photoFailed') + (r && r.error ? ` (${r.error})` : ''), '#photoErr');
  punchRes.photoKB = (shot.bytes / 1024).toFixed(1);
  showDone();
}
async function onPhotoFile(file) {
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    shot = await compressDrawable(img, img.width, img.height, 8);
    $('#photoPrev').src = shot.b64; $('#photoPrev').hidden = false; $('#photoRing').hidden = true;
    sendPhoto();
  } catch (e) { err(t('photoFailed'), '#photoErr'); }
}

function showDone() {
  if (stopCam) { stopCam(); stopCam = null; }
  const r = punchRes;
  $('#doneTitle').textContent = `${r.name} · ${r.kind} ${r.time}`;
  $('#doneSub').textContent = `${r.shift === 'M' ? t('morning') : t('evening')} · ${catName(cat)}${brand ? ' · ' + brand : ''} · ${r.code}`;
  const rows = [];
  if (r.photoKB) rows.push(`<div class="li"><div class="m">${esc(t('photoSaved'))}<span>${r.photoKB} KB${liveResult === 'pass' ? ' · ' + esc(t('livePass')) : liveResult === 'fail' ? ' · ' + esc(t('liveFail')) : ''}</span></div><span class="tag ${liveResult === 'fail' ? 'r' : 'ok'}">${liveResult === 'fail' ? '!' : '✓'}</span></div>`);
  rows.push(`<div class="li"><div class="m">📍<span>${r.dist_m != null ? r.dist_m + ' m' : (ctx.test_mode ? t('testMode') : '—')}</span></div><span class="tag ok">✓</span></div>`);
  if (modToken) rows.push(`<div class="li"><div class="m">${esc(t('modMode'))}<span>${esc((Session.get() || {}).name || '')}</span></div><span class="tag w">${esc(t('modMode'))}</span></div>`);
  $('#doneList').innerHTML = rows.join('');
  show('done');
}

function resetForm(keepCat) {
  $('#name').value = ''; $('#modConsent').checked = false; lastLookup = null; $('#lookupNote').hidden = true; err(); setBtn('IN');
  if (!keepCat) { cat = null; brand = ''; paintCats(); paintBrands(); paintVendors(); }
  if (modToken) paintRoster();
  show('form');
}

(async function init() {
  $('#langSlot').appendChild(langToggle(() => { if (ctx) { paintCats(); paintVendors(); setBtn(lastLookup ? lastLookup.next : 'IN'); } }));
  $('#credit').innerHTML = credit(); applyI18n();
  let code = (q.get('s') || '').toUpperCase();
  if (q.get('mod') === '1') {
    const me = await requireSession(['store']); if (!me) return;
    modToken = me.token; code = me.store_code;
    $('#btnBack').hidden = false; $('#btnBack').onclick = () => location.href = 'store.html';
    $('#modNote').hidden = false; $('#modNote').textContent = `${t('modMode')}: ${me.name} (Emp ${me.emp})`;
    $('#noPhone').hidden = true; $('#nameWrap').querySelector('label').textContent = t('associate'); $('#modConsentWrap').hidden = false;
  }
  if (!/^[A-Z]{2}\d{2}$/.test(code)) { $('#loading').hidden = true; document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="note r">${esc(t('storeHint'))}</div>`); return; }
  ctx = await rpc('punch_context', { p_store: code });
  if (!ctx || !ctx.ok) { $('#loading').hidden = true; document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="note r">${esc(errText(ctx && ctx.error))}</div>`); return; }
  $('#hTitle').textContent = `${t('punchTitle')} · ${ctx.store.code}`; $('#hSub').textContent = ctx.store.name;
  if (!modToken) {
    const ready = await permissionsReady('associate', true);
    if (!ready) { $('#loading').hidden = true; await consentGate({ kind: 'associate', store: ctx.store.code, testMode: ctx.test_mode, needCamera: true }); }
  }
  $('#storeNote').textContent = `${ctx.store.code} · ${ctx.store.name} ✓ ${modToken ? '' : t('fromQr')}`;
  paintCats(); paintBrands(); paintVendors(); setBtn('IN'); show('form'); locate();

  $('#cats').addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (!b) return; cat = ctx.categories.find((c) => c.id === b.dataset.c); brand = ''; paintCats(); paintBrands(); paintVendors(); paintRoster(); lookup(); });
  $('#brands').addEventListener('click', (e) => { const b = e.target.closest('[data-b]'); if (!b) return; brand = b.dataset.b; paintBrands(); lookup(); });
  $('#vendor').addEventListener('change', () => { $('#vendorOther').hidden = $('#vendor').value !== '__other'; });
  $('#name').addEventListener('input', () => { clearTimeout(lookTimer); lookTimer = setTimeout(lookup, 400); });
  $('#roster').addEventListener('click', (e) => {
    const li = e.target.closest('.li'); if (!li) return;
    if (li.dataset.new) { $('#name').value = ''; $('#name').focus(); lookup(); return; }
    $('#name').value = li.dataset.n; if (li.dataset.b) { brand = li.dataset.b; paintBrands(); }
    if (li.dataset.v) { if (![...$('#vendor').options].some((o) => o.value === li.dataset.v)) $('#vendor').insertAdjacentHTML('afterbegin', `<option>${esc(li.dataset.v)}</option>`); $('#vendor').value = li.dataset.v; }
    lookup(); $('#btnPunch').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#btnPunch').addEventListener('click', doPunch);
  $('#cam').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) onPhotoFile(f); e.target.value = ''; });
  $('#btnShutter').addEventListener('click', capture);
  $('#btnRetake').addEventListener('click', openCam);
  $('#btnUse').addEventListener('click', sendPhoto);
  $('#btnAgain').addEventListener('click', () => resetForm(!!modToken));
})();
</script>
</body>
</html>
