<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punch · 3rd Party Attendance</title>
<meta name="theme-color" content="#1565C0">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="hdr">
  <div class="t"><b id="hTitle">Punch</b><small id="hSub"></small></div>
  <span id="langSlot"></span>
  <button class="x" id="btnBack" hidden>✕</button>
</header>

<main class="wrap">
  <div id="loading" class="spin"></div>

  <!-- form -->
  <section id="form" hidden style="display:flex;flex-direction:column;gap:12px">
    <div id="storeNote" class="note k"></div>
    <div id="gpsNote" class="note i" data-t="getLocation"></div>
    <div id="modNote" class="note w" hidden></div>

    <div><div class="lbl" data-t="department"></div><div class="pills" id="cats"></div></div>
    <div id="brandWrap" hidden><div class="lbl" data-t="brand"></div><div class="pills" id="brands"></div></div>

    <div id="rosterWrap" hidden>
      <div class="lbl" data-t="selectAssociate"></div>
      <div class="list" id="roster"></div>
    </div>

    <div class="field" id="vendorWrap"><label class="lbl" for="vendor" data-t="vendor"></label>
      <select class="in" id="vendor"></select>
      <input class="in" id="vendorOther" style="margin-top:6px" hidden maxlength="60">
    </div>
    <div class="field" id="nameWrap"><label class="lbl" for="name" data-t="yourName"></label>
      <input class="in" id="name" maxlength="40" autocomplete="name" data-tp="nameHint"></div>
    <div id="lookupNote" class="note i" hidden></div>
    <div id="err" class="note r" hidden></div>
    <button class="btn" id="btnPunch" data-t="punchIn"></button>
    <div class="note i" id="noPhone" data-t="noPhone"></div>
  </section>

  <!-- photo -->
  <section id="photo" hidden style="display:flex;flex-direction:column;gap:12px;align-items:stretch">
    <h2 class="ttl" data-t="photoToday"></h2>
    <p class="sub" id="photoWho" style="margin:0"></p>
    <div style="background:#2A3442;border-radius:14px;height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden">
      <img id="photoPrev" alt="" style="max-height:100%;display:none">
      <div id="photoRing" style="width:140px;height:180px;border:3px dashed rgba(255,255,255,.7);border-radius:50%"></div>
    </div>
    <p class="sub" style="margin:0" data-t="photoHint"></p>
    <label class="btn" for="cam" style="text-align:center">📷 <span data-t="takePhoto"></span></label>
    <input id="cam" type="file" accept="image/*" capture="user" hidden>
    <div id="photoErr" class="note r" hidden></div>
  </section>

  <!-- done -->
  <section id="done" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="check">✓</div>
    <h2 class="ttl" id="doneTitle"></h2>
    <p class="sub" id="doneSub" style="margin:0"></p>
    <div class="list" id="doneList"></div>
    <button class="btn" id="btnAgain" data-t="nextPunch"></button>
  </section>

  <p class="foot" id="credit"></p>
</main>

<script src="assets/app.js"></script>
<script>
const q = new URLSearchParams(location.search);
let ctx = null, modToken = null, pos = null, cat = null, brand = '', lastLookup = null, punchRes = null, lookTimer = null;

function show(id) { ['loading','form','photo','done'].forEach((s) => $('#' + s).hidden = s !== id); }
function err(msg, el = '#err') { $(el).hidden = !msg; $(el).textContent = msg || ''; }

async function locate() {
  $('#gpsNote').className = 'note i'; $('#gpsNote').textContent = t('getLocation');
  pos = await getPosition();
  if (ctx.test_mode) { $('#gpsNote').className = 'note w'; $('#gpsNote').textContent = t('testMode'); return; }
  if (!pos) { $('#gpsNote').className = 'note r'; $('#gpsNote').innerHTML = esc(t('noGps')) + ' <button class="link" id="gpsRetry">↻</button>'; $('#gpsRetry').onclick = locate; return; }
  $('#gpsNote').className = 'note k';
  $('#gpsNote').textContent = '📍 ' + t('locFound', { a: Math.round(pos.acc || 0) });
}

function paintCats() {
  $('#cats').innerHTML = ctx.categories.map((c) => `<button type="button" class="pill${cat && cat.id === c.id ? ' on' : ''}" data-c="${c.id}">${esc(catName(c))}</button>`).join('');
}
function paintBrands() {
  const b = cat ? cat.brands : [];
  $('#brandWrap').hidden = !b.length;
  $('#brands').innerHTML = b.map((x) => `<button type="button" class="pill${brand === x ? ' on' : ''}" data-b="${esc(x)}">${esc(x)}</button>`).join('');
}
function paintVendors() {
  const v = cat ? cat.vendors : [];
  $('#vendor').innerHTML = `<option value="">${esc(t('selectVendor'))}</option>` + v.map((x) => `<option>${esc(x)}</option>`).join('') + `<option value="__other">${esc(t('otherVendor'))}</option>`;
  if (v.length === 1) $('#vendor').value = v[0];
  $('#vendorOther').hidden = true;
}
async function paintRoster() {
  if (!modToken || !cat) { $('#rosterWrap').hidden = true; return; }
  $('#rosterWrap').hidden = false; $('#roster').innerHTML = '<div class="spin"></div>';
  const r = await rpc('store_roster', { p_token: modToken, p_cat: cat.id });
  const rows = (r && r.rows) || [];
  $('#roster').innerHTML = rows.map((a) => `<div class="li click" data-n="${esc(a.name)}" data-b="${esc(a.brand)}" data-v="${esc(a.vendor || '')}">
      <div class="m">${esc(a.name)}<span>${esc(a.code)}${a.brand ? ' · ' + esc(a.brand) : ''} · ${a.last_kind ? a.last_kind + ' ' + a.last_time : '—'}</span></div>
      <span class="tag ${a.last_kind === 'IN' ? 'w' : 'ok'}">${a.last_kind === 'IN' ? 'OUT' : 'IN'}</span></div>`).join('')
    + `<div class="li click" data-new="1"><div class="m">${esc(t('newName'))}</div><span class="tag ok">+</span></div>`;
}

async function lookup() {
  const name = $('#name').value.trim();
  if (!cat || name.length < 2 || (cat.brands.length && !brand)) { $('#lookupNote').hidden = true; lastLookup = null; setBtn('IN'); return; }
  const r = await rpc('punch_lookup', { p_store: ctx.store.code, p_cat: cat.id, p_brand: brand, p_name: name });
  if (!r || !r.ok) return;
  lastLookup = r; $('#lookupNote').hidden = false;
  $('#lookupNote').textContent = r.exists ? t('alreadyReg', { code: r.code }) : t('newReg');
  setBtn(r.next);
}
function setBtn(kind) { $('#btnPunch').textContent = kind === 'OUT' ? t('punchOut') : t('punchIn'); $('#btnPunch').classList.toggle('blue', kind === 'OUT'); }

async function doPunch() {
  err();
  if (!cat) return err(t('chooseCat'));
  if (cat.brands.length && !brand) return err(t('brandRequired'));
  const name = $('#name').value.trim();
  if (!/^[\p{L} .]{2,40}$/u.test(name)) return err(t('badName'));
  if (!ctx.test_mode && ctx.store.mapped && !pos) { await locate(); if (!pos) return err(t('noGps')); }
  let vendor = $('#vendor').value; if (vendor === '__other') vendor = $('#vendorOther').value.trim();
  $('#btnPunch').disabled = true;
  const r = await rpc('punch_submit', { p_store: ctx.store.code, p_cat: cat.id, p_brand: brand, p_vendor: vendor || null, p_name: name,
    p_lat: pos ? pos.lat : null, p_lng: pos ? pos.lng : null, p_device: deviceId(), p_mod_token: modToken });
  $('#btnPunch').disabled = false;
  if (!r || !r.ok) {
    if (r && r.error === 'OUT_OF_RANGE') return err(t('outside', { d: r.dist_m, r: r.radius_m }));
    if (r && r.error === 'NO_GPS') return err(t('noGps'));
    return err(errText(r && r.error));
  }
  punchRes = r;
  if (r.photo_required) { $('#photoWho').textContent = `${r.name} · ${catName(cat)} · ${ctx.store.code}`; $('#photoPrev').style.display = 'none'; $('#photoRing').style.display = ''; err('', '#photoErr'); show('photo'); return; }
  showDone();
}

async function onPhoto(file) {
  err('', '#photoErr');
  try {
    const p = await compressPhoto(file, 8);
    $('#photoPrev').src = p.b64; $('#photoPrev').style.display = ''; $('#photoRing').style.display = 'none';
    const r = await photoFn({ action: 'upload', token: punchRes.photo_token, b64: p.b64 });
    if (!r || !r.ok) return err(t('photoFailed') + (r && r.error ? ` (${r.error})` : ''), '#photoErr');
    punchRes.photoKB = (p.bytes / 1024).toFixed(1);
    showDone();
  } catch (e) { err(t('photoFailed'), '#photoErr'); }
}

function showDone() {
  const r = punchRes;
  $('#doneTitle').textContent = `${r.name} · ${r.kind} ${r.time}`;
  $('#doneSub').textContent = `${r.shift === 'M' ? t('morning') : t('evening')} · ${catName(cat)}${brand ? ' · ' + brand : ''} · ${r.code}`;
  const rows = [];
  if (r.photoKB) rows.push(`<div class="li"><div class="m">${esc(t('photoSaved'))}<span>${r.photoKB} KB</span></div><span class="tag ok">✓</span></div>`);
  rows.push(`<div class="li"><div class="m">📍<span>${r.dist_m != null ? r.dist_m + ' m' : (ctx.test_mode ? t('testMode') : '—')}</span></div><span class="tag ok">✓</span></div>`);
  if (modToken) rows.push(`<div class="li"><div class="m">${esc(t('modMode'))}<span>${esc((Session.get() || {}).name || '')}</span></div><span class="tag w">MOD</span></div>`);
  $('#doneList').innerHTML = rows.join('');
  show('done');
}

function resetForm(keepCat) {
  $('#name').value = ''; lastLookup = null; $('#lookupNote').hidden = true; err(); setBtn('IN');
  if (!keepCat) { cat = null; brand = ''; paintCats(); paintBrands(); paintVendors(); }
  if (modToken) paintRoster();
  show('form');
}

(async function init() {
  $('#langSlot').appendChild(langToggle(() => { if (ctx) { paintCats(); paintVendors(); setBtn(lastLookup ? lastLookup.next : 'IN'); } }));
  $('#credit').innerHTML = credit(); applyI18n();
  let code = (q.get('s') || '').toUpperCase();
  if (q.get('mod') === '1') {
    const me = await requireSession(['store']); if (!me) return;
    modToken = me.token; code = me.store_code;
    $('#btnBack').hidden = false; $('#btnBack').onclick = () => location.href = 'store.html';
    $('#modNote').hidden = false; $('#modNote').textContent = `${t('modMode')}: ${me.name} (Emp ${me.emp})`;
    $('#noPhone').hidden = true; $('#nameWrap').querySelector('label').textContent = t('associate');
  }
  if (!/^[A-Z]{2}\d{2}$/.test(code)) { $('#loading').hidden = true; document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="note r">${esc(t('storeHint'))}</div>`); return; }
  ctx = await rpc('punch_context', { p_store: code });
  if (!ctx || !ctx.ok) { $('#loading').hidden = true; document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="note r">${esc(errText(ctx && ctx.error))}</div>`); return; }
  $('#hTitle').textContent = `${t('punchTitle')} · ${ctx.store.code}`; $('#hSub').textContent = ctx.store.name;
  $('#storeNote').textContent = `${ctx.store.code} · ${ctx.store.name} ✓ ${modToken ? '' : t('fromQr')}`;
  paintCats(); paintBrands(); paintVendors(); setBtn('IN'); show('form'); locate();

  $('#cats').addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (!b) return; cat = ctx.categories.find((c) => c.id === b.dataset.c); brand = ''; paintCats(); paintBrands(); paintVendors(); paintRoster(); lookup(); });
  $('#brands').addEventListener('click', (e) => { const b = e.target.closest('[data-b]'); if (!b) return; brand = b.dataset.b; paintBrands(); lookup(); });
  $('#vendor').addEventListener('change', () => { $('#vendorOther').hidden = $('#vendor').value !== '__other'; });
  $('#name').addEventListener('input', () => { clearTimeout(lookTimer); lookTimer = setTimeout(lookup, 400); });
  $('#roster').addEventListener('click', (e) => {
    const li = e.target.closest('.li'); if (!li) return;
    if (li.dataset.new) { $('#name').value = ''; $('#name').focus(); lookup(); return; }
    $('#name').value = li.dataset.n; if (li.dataset.b) { brand = li.dataset.b; paintBrands(); }
    if (li.dataset.v) { if (![...$('#vendor').options].some((o) => o.value === li.dataset.v)) $('#vendor').insertAdjacentHTML('afterbegin', `<option>${esc(li.dataset.v)}</option>`); $('#vendor').value = li.dataset.v; }
    lookup(); $('#btnPunch').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#btnPunch').addEventListener('click', doPunch);
  $('#cam').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) onPhoto(f); e.target.value = ''; });
  $('#btnAgain').addEventListener('click', () => resetForm(!!modToken));
})();
</script>
</body>
</html>
