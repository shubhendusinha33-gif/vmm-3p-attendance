<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punch · 3rd Party Attendance</title>
<meta name="theme-color" content="#1E293B">
<link rel="preconnect" href="https://phyllziizajuphenpwxz.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/app.css">
<style>
  body{margin:0;background:var(--bg)}
  @media(min-width:461px){body{background:var(--side)}.phone{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.25)}}
  .phone{max-width:460px}
  .phd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px}
  .phd .t{flex:1;min-width:0}.phd .t b,.phd .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phd .x{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;height:34px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer}
  .phd .lang{border-color:rgba(255,255,255,.5)}.phd .lang button{color:#fff}.phd .lang button.on{background:#fff;color:var(--side)}
  .pbody{padding:14px 14px 24px;gap:14px;flex:1}
  .pbody section{display:flex;flex-direction:column;gap:14px}.pbody section[hidden]{display:none}
  .stp{font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center}
  .stp i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .stp.done i{background:var(--ok)}
  .stp small{font-weight:400;color:var(--mut)}
  .pills .pill{padding:9px 16px;font-size:14px}
  .vlist{display:flex;flex-direction:column;gap:8px}
  .vlist .post{background:var(--card);text-align:left;cursor:pointer;font:inherit;color:var(--ink);width:100%;padding:12px 14px}
  .vlist .post.on{background:var(--acc-l);border-color:var(--acc)}
  .vlist .post small{color:var(--mut)}
  .pname{width:100%;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .pname:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-l)}
  .bigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bigbtn{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font)}
  .bigbtn small{font-size:12px;font-weight:500;opacity:.9}
  .bigbtn.in{background:var(--ok)}.bigbtn.out{background:var(--red)}
  .bigbtn:disabled{background:var(--track);color:var(--mut);cursor:not-allowed}
  .bigbtn.busy{opacity:.7;cursor:wait}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center}
  .pcard .av{width:52px;height:52px;border-radius:50%;background:var(--pri-l);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
  .pcard .m{flex:1;min-width:0}.pcard h2{font-size:18px;margin:0;color:var(--ink);text-transform:none;letter-spacing:0}
  .pcard .sub{font-size:13px}
  .rost{max-height:260px;overflow:auto}
  .done{text-align:center;padding-top:30px;align-items:center}
  .done .ck{width:88px;height:88px;border-radius:50%;background:var(--ok-l);color:var(--ok);font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center;animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
  .done h1{font-size:22px;color:var(--pri-d);margin:0}
  .done .note{text-align:left;width:100%}
  .gps{display:flex;gap:8px;align-items:center}
  /* instant camera (like DDR) */
  .cam{gap:16px;padding:16px}
  .cam .vf{width:min(300px,82vw);height:min(390px,62vh)}
  .cam .oval{width:62%;height:64%}
  .cam .oval.seen{border-color:#FFD27A}
  .cam .vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cam .ct{font-weight:700;font-size:16px;text-align:center;min-height:22px}
  .cam .cs{font-size:13px;opacity:.8;text-align:center;margin-top:-10px}
  .cam .shutter{border-color:var(--acc)}
  .cam .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .cam .note{max-width:320px}
  .cam .btn{padding:10px 16px;font-size:14px}
  .cam .hold{position:absolute;left:19%;right:19%;bottom:8%;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  .cam .hold i{display:block;height:100%;width:0;background:#52C878;transition:width .1s linear}
</style>
</head>
<body>
<div class="phone">
  <header class="phd">
    <div class="t"><b id="hTitle">Punch</b><small id="hSub">3rd Party Attendance</small></div>
    <span id="langSlot"></span>
    <button class="x" id="btnBack" hidden>✕</button>
  </header>
  <main class="pbody">
    <div id="loading" class="spin"></div>
    <div id="fatal" class="note r" hidden></div>

    <!-- remembered phone: person card -->
    <section id="me" hidden>
      <div class="pcard"><div class="av" id="meAv"></div><div class="m"><h2 id="meName"></h2><div class="sub" id="meSub"></div></div><span class="tg ok" data-t="saved"></span></div>
      <div class="note gps" id="gpsNote2"></div>
      <div id="meErr" class="note r" hidden></div>
      <div class="bigs"><button class="bigbtn in" data-k="IN"><span data-t="punchIn"></span><small id="meInSub"></small></button><button class="bigbtn out" data-k="OUT"><span data-t="punchOut"></span><small id="meOutSub"></small></button></div>
      <div class="note" data-t="camAuto"></div>
      <button class="btn ghost sm" id="btnChange" style="align-self:center" data-t="notYouVendor"></button>
    </section>

    <!-- first time on this phone (or store login punching for staff) -->
    <section id="form" hidden>
      <div id="modNote" class="note w" hidden></div>
      <div class="note gps" id="gpsNote"></div>

      <div><div class="stp" id="st1"><i>1</i><span data-t="department"></span></div><div class="pills" id="cats" style="margin-top:8px"></div></div>

      <div id="vWrap" hidden>
        <div class="stp" id="st2"><i>2</i><span data-t="yourVendor"></span> <small id="vFor"></small></div>
        <div class="vlist" id="vendors" style="margin-top:8px"></div>
        <div id="brandWrap" hidden style="margin-top:8px"><div class="sub" style="font-weight:700" data-t="brand"></div><div class="pills" id="brands" style="margin-top:6px"></div></div>
      </div>

      <div id="rosterWrap" hidden>
        <div class="stp"><i>·</i><span data-t="selectAssociate"></span></div>
        <div class="list rost" id="roster" style="margin-top:8px"></div>
      </div>

      <div id="nWrap" hidden>
        <div class="stp" id="st3"><i>3</i><span id="nameLbl" data-t="fullNameP"></span></div>
        <input class="pname" id="name" maxlength="40" autocomplete="name" style="margin-top:8px">
        <div id="lookupNote" class="sub" hidden style="margin-top:6px"></div>
      </div>

      <label id="modConsentWrap" hidden style="display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer">
        <input type="checkbox" id="modConsent" style="width:22px;height:22px;flex-shrink:0"><span data-t="modConsent"></span></label>
      <div id="err" class="note r" hidden></div>
      <div class="bigs" id="punchBtns" hidden><button class="bigbtn in" data-k="IN"><span data-t="punchIn"></span></button><button class="bigbtn out" data-k="OUT"><span data-t="punchOut"></span></button></div>
      <div class="note" id="rememberNote" data-t="rememberNote"></div>
      <div class="note i" id="noPhone" data-t="noPhone"></div>
    </section>

    <!-- done -->
    <section id="done" class="done" hidden>
      <div class="ck">✓</div>
      <h1 id="doneTitle"></h1>
      <div class="sub" id="doneSub" style="font-size:14px"></div>
      <div class="note k" id="doneNote"></div>
      <button class="btn s" id="btnAgain" style="min-width:160px;padding:10px 18px" data-t="doneBtn"></button>
    </section>
  </main>
  <p class="foot" id="credit"></p>
</div>

<script src="assets/app.js"></script>
<script>
Object.assign(I18N.en, {
  saved: 'Saved', camAuto: 'Camera opens and takes the selfie by itself as soon as your face is inside the oval. No blink or head-turn needed.',
  notYouVendor: 'Not you, or vendor changed?', yourVendor: 'Your vendor', listedFor: '(listed for {s} · {c})', fullNameP: 'Your full name',
  noVendor: 'No vendor is set up for this department at this store. Ask the store manager.', pickVendor: 'Pick your vendor first.',
  rememberNote: 'After the first punch this phone remembers you, so next time it opens straight on Punch IN / OUT.',
  firstSub: 'First time on this phone · 3 quick steps', meSubT: 'This phone is registered to you', doneBtn: 'Done',
  punchSaved: 'Punch {k} saved', camFind: 'Looking for your face…', camHold: 'Face found ✓ hold still', camOne: 'Only one face in the oval, please',
  camCloser: 'Come a little closer', camCenter: 'Bring your face inside the oval', camSlow: 'Tap the button to take the selfie', camStart: 'Opening camera…',
  camUp: 'Saving selfie…', camRetry: 'Try again', camRetake: 'Retake', camNoCam: 'Camera could not open. Use the phone camera instead.', camAppBtn: 'Open phone camera',
  liveOk: 'Live face ✓', liveNo: 'No face seen', selfieKB: 'selfie {n} KB', insideM: 'inside store ({d} m)', noSelfie: 'No selfie needed this time',
  nextIs: 'Next: {k}', lastWas: 'Last: {k} {t}', youAreIn: 'You are punched IN. Tap Punch OUT when you leave.',
  outNotNow: 'Not punched IN yet today: tap Punch IN.',
});
Object.assign(I18N.hi, {
  saved: 'सेव है', camAuto: 'कैमरा खुलेगा और जैसे ही चेहरा अंडाकार में आएगा, सेल्फी अपने-आप ले लेगा। आंख झपकाने या सिर घुमाने की ज़रूरत नहीं।',
  notYouVendor: 'आप नहीं हैं, या वेंडर बदल गया?', yourVendor: 'आपका वेंडर', listedFor: '({s} · {c} के लिए)', fullNameP: 'आपका पूरा नाम',
  noVendor: 'इस स्टोर में इस विभाग का कोई वेंडर सेट नहीं है। स्टोर मैनेजर से बात करें।', pickVendor: 'पहले अपना वेंडर चुनें।',
  rememberNote: 'पहले पंच के बाद यह फ़ोन आपको याद रखेगा, अगली बार सीधे पंच IN / OUT खुलेगा।',
  firstSub: 'इस फ़ोन पर पहली बार · 3 आसान स्टेप', meSubT: 'यह फ़ोन आपके नाम पर है', doneBtn: 'ठीक है',
  punchSaved: 'पंच {k} सेव हुआ', camFind: 'आपका चेहरा ढूंढ रहे हैं…', camHold: 'चेहरा मिला ✓ स्थिर रहें', camOne: 'अंडाकार में सिर्फ एक चेहरा रखें',
  camCloser: 'थोड़ा पास आएं', camCenter: 'चेहरा अंडाकार के अंदर लाएं', camSlow: 'सेल्फी के लिए बटन दबाएं', camStart: 'कैमरा खुल रहा है…',
  camUp: 'सेल्फी सेव हो रही है…', camRetry: 'फिर कोशिश करें', camRetake: 'दोबारा लें', camNoCam: 'कैमरा नहीं खुला। फ़ोन का कैमरा इस्तेमाल करें।', camAppBtn: 'फ़ोन कैमरा खोलें',
  liveOk: 'लाइव चेहरा ✓', liveNo: 'चेहरा नहीं दिखा', selfieKB: 'सेल्फी {n} KB', insideM: 'स्टोर के अंदर ({d} मी)', noSelfie: 'इस बार सेल्फी की ज़रूरत नहीं',
  nextIs: 'अगला: {k}', lastWas: 'पिछला: {k} {t}', youAreIn: 'आप पंच IN हैं। जाते समय पंच OUT दबाएं।',
  outNotNow: 'आज अभी पंच IN नहीं हुआ: पंच IN दबाएं।',
});

const q = new URLSearchParams(location.search);
let ctx = null, modToken = null, me = null, pos = null, posAt = 0;
let cat = null, vendor = '', brand = '', lastLookup = null, lookTimer = null, punchRes = null, punchBusy = false, mem = null, memNext = 'IN';

function show(id) { ['loading', 'me', 'form', 'done'].forEach((s) => { $('#' + s).hidden = s !== id; }); window.scrollTo(0, 0); }
function err(msg, el = '#err') { $(el).hidden = !msg; $(el).textContent = msg || ''; }
function fatal(msg) { $('#loading').hidden = true; $('#fatal').hidden = false; $('#fatal').textContent = msg; }
const catById = (id) => (ctx.categories || []).find((c) => c.id === id);

/* ---------- location ---------- */
function gpsPaint() {
  const els = [$('#gpsNote'), $('#gpsNote2')];
  let cls = 'note i gps', html = '📍 ' + esc(t('getLocation'));
  if (ctx.test_mode) { cls = 'note w gps'; html = esc(t('testMode')); }
  else if (pos) { cls = 'note k gps'; html = '📍 ' + esc(t('locFound', { a: Math.round(pos.acc || 0) })); }
  else if (posAt) { cls = 'note r gps'; html = `${esc(t('noGps'))} <button class="link" data-gps>↻</button>`; }
  els.forEach((e) => { e.className = cls; e.innerHTML = html; });
}
async function locate() {
  posAt = 0; pos = null; gpsPaint();
  pos = await getPosition(); posAt = Date.now(); gpsPaint();
}

/* ---------- same phone remembers who punched here ---------- */
const memKey = () => 'vmm3p_me_' + ctx.store.code;
const memGet = () => { try { return JSON.parse(localStorage.getItem(memKey()) || 'null'); } catch (e) { return null; } };
const memSet = (o) => { try { if (o) localStorage.setItem(memKey(), JSON.stringify(o)); else localStorage.removeItem(memKey()); } catch (e) {} };

async function openMe() {
  mem = memGet();
  if (!mem || !catById(mem.cat)) { memSet(null); return false; }
  const r = await rpc('punch_lookup', { p_store: ctx.store.code, p_cat: mem.cat, p_brand: mem.brand || '', p_name: mem.name, p_device: deviceId(), p_mod_token: null });
  if (!r || !r.ok || !r.exists) { if (r && r.ok) memSet(null); return false; }
  const c = catById(mem.cat);
  memNext = r.next === 'OUT' ? 'OUT' : 'IN';
  $('#meAv').textContent = (mem.name.trim()[0] || '?').toUpperCase();
  $('#meName').textContent = mem.name;
  $('#meSub').textContent = [catName(c), mem.vendor, mem.brand, r.code || mem.code].filter(Boolean).join(' · ');
  $('#hSub').textContent = t('meSubT');
  paintBig($('#me'), memNext);
  maxGuard($('#me'), r);
  $('#meInSub').textContent = memNext === 'IN' ? t('nextIs', { k: 'IN' }) : '';
  $('#meOutSub').textContent = memNext === 'OUT' ? t('nextIs', { k: 'OUT' }) : '';
  err('', '#meErr'); show('me');
  return true;
}
function paintBig(root, next) {
  $$('.bigbtn', root).forEach((b) => { b.disabled = b.dataset.k !== next; b.classList.remove('busy'); });
}

/* ---------- first-time form: dept → vendor → name ---------- */
function vendorsFor(c) {
  if (!c) return [];
  if (Array.isArray(ctx.vendors)) return ctx.vendors.filter((v) => v.cat === c.id).map((v) => ({ vendor: v.vendor, brand: v.brand || '' }));
  return (c.vendors || []).map((v) => ({ vendor: v, brand: '' }));   // older backend: vendor names only
}
function paintCats() {
  $('#cats').innerHTML = (ctx.categories || []).map((c) => `<button type="button" class="pill${cat && cat.id === c.id ? ' on' : ''}" data-c="${esc(c.id)}">${esc(catName(c))}</button>`).join('');
  $('#st1').classList.toggle('done', !!cat);
}
function paintVendors() {
  $('#vWrap').hidden = !cat;
  if (!cat) return;
  $('#vFor').textContent = t('listedFor', { s: ctx.store.code, c: catName(cat) });
  const V = vendorsFor(cat);
  $('#vendors').innerHTML = V.length
    ? V.map((x) => { const on = vendor === x.vendor && (brand || '') === (x.brand || ''); return `<button type="button" class="post${on ? ' on' : ''}" data-v="${esc(x.vendor)}" data-b="${esc(x.brand)}"><span><b>${esc(x.vendor)}</b>${x.brand ? `<br><small>${esc(t('brand'))} ${esc(x.brand)}</small>` : ''}</span>${on ? `<span class="tg acc">✓</span>` : ''}</button>`; }).join('')
    : `<div class="note w">${esc(t('noVendor'))}</div>`;
  const needBrand = vendor && (cat.brands || []).length && !brand;
  $('#brandWrap').hidden = !(vendor && (cat.brands || []).length && (needBrand || !V.some((x) => x.vendor === vendor && x.brand)));
  $('#brands').innerHTML = (cat.brands || []).map((b) => `<button type="button" class="pill${brand === b ? ' on' : ''}" data-br="${esc(b)}">${esc(b)}</button>`).join('');
  $('#st2').classList.toggle('done', !!vendor);
  const ready = !!vendor && (!(cat.brands || []).length || !!brand);
  $('#nWrap').hidden = !ready; $('#punchBtns').hidden = !ready;
  if (ready) paintFormBtns();
}
async function paintRoster() {
  if (!modToken || !cat) { $('#rosterWrap').hidden = true; return; }   // only a store login may see the people list
  $('#rosterWrap').hidden = false; $('#roster').innerHTML = '<div class="spin"></div>';
  const r = await rpc('store_roster', { p_token: modToken, p_cat: cat.id });
  const rows = (r && r.rows) || [];
  $('#roster').innerHTML = rows.map((a) => { const k = a.last_kind; return `<div class="li click" data-n="${esc(a.name)}" data-b="${esc(a.brand || '')}" data-v="${esc(a.vendor || '')}" data-k="${k || ''}">
      <div class="m">${esc(a.name)}<span>${esc(a.code)}${a.brand ? ' · ' + esc(a.brand) : ''}${a.vendor ? ' · ' + esc(a.vendor) : ''} · ${k ? k + ' ' + esc(a.last_time || '') : '—'}</span></div>
      <span class="tag ${k === 'IN' ? 'w' : 'ok'}">${k === 'IN' ? 'OUT' : 'IN'}</span></div>`; }).join('')
    + `<div class="li click" data-new="1"><div class="m">${esc(t('newName'))}</div><span class="tag ok">+</span></div>`;
}
// v5.3: max 4 punches a day (2 IN + 2 OUT)
function maxGuard(root, r) {
  const on = !!(r && r.max_reached);
  $$('.bigbtn', root).forEach((b) => { if (on) b.disabled = true; });
  const b0 = $$('.bigbtn', root)[0], host = b0 ? b0.parentElement : root;
  let n = host.nextElementSibling && host.nextElementSibling.classList.contains('maxnote') ? host.nextElementSibling : null;
  if (on && !n) { n = document.createElement('div'); n.className = 'note w maxnote'; n.style.marginTop = '8px'; host.after(n); }
  if (n) { n.hidden = !on; n.textContent = lang() === 'hi' ? 'आज के 4 पंच (2 IN + 2 OUT) पूरे हो गए।' : 'All 4 punches for today are used (2 IN + 2 OUT).'; }
}
function paintFormBtns() {
  const next = lastLookup ? (lastLookup.next === 'OUT' ? 'OUT' : 'IN') : 'IN';
  paintBig($('#punchBtns'), next);
  maxGuard($('#punchBtns'), lastLookup);
  $('#st3').classList.toggle('done', $('#name').value.trim().length >= 3);
}
async function lookup() {
  const name = $('#name').value.trim();
  if (!cat || name.length < 2 || ((cat.brands || []).length && !brand)) { $('#lookupNote').hidden = true; lastLookup = null; paintFormBtns(); return; }
  const r = await rpc('punch_lookup', { p_store: ctx.store.code, p_cat: cat.id, p_brand: brand, p_name: name, p_device: deviceId(), p_mod_token: modToken });
  if (!r || !r.ok || $('#name').value.trim() !== name) return;
  lastLookup = r; $('#lookupNote').hidden = false;
  $('#lookupNote').textContent = r.exists ? t('alreadyReg', { code: r.code }) : t('newReg');
  paintFormBtns();
}

/* ---------- punch ---------- */
async function doPunch(fromMe) {
  if (punchBusy) return;
  const errEl = fromMe ? '#meErr' : '#err';
  err('', errEl);
  let c = cat, v = vendor, b = brand, name;
  if (fromMe) { c = catById(mem.cat); v = mem.vendor || ''; b = mem.brand || ''; name = mem.name; }
  else {
    name = $('#name').value.trim();
    if (!c) return err(t('chooseCat'), errEl);
    if (!v) return err(t('pickVendor'), errEl);
    if ((c.brands || []).length && !b) return err(t('brandRequired'), errEl);
    if (!/^[\p{L} .]{2,40}$/u.test(name) || name.replace(/[ .]/g, '').length < 2) { $('#name').focus(); return err(t('badName'), errEl); }
    if (modToken && !$('#modConsent').checked) return err(t('consentRequired'), errEl);
  }
  const root = fromMe ? $('#me') : $('#punchBtns');
  punchBusy = true; $$('.bigbtn', root).forEach((x) => x.classList.add('busy'));
  if (!ctx.test_mode && (!pos || Date.now() - posAt > 300000)) await locate();
  if (!ctx.test_mode && !pos) { punchBusy = false; $$('.bigbtn', root).forEach((x) => x.classList.remove('busy')); return err(t('noGps') + ' ' + t('permHow'), errEl); }
  const r = await rpc('punch_submit', { p_store: ctx.store.code, p_cat: c.id, p_brand: b, p_vendor: v || null, p_name: name,
    p_lat: pos ? pos.lat : null, p_lng: pos ? pos.lng : null, p_device: deviceId(), p_mod_token: modToken,
    p_consent: true, p_policy: CONFIG.policy });
  punchBusy = false; $$('.bigbtn', root).forEach((x) => x.classList.remove('busy'));
  if (!r || !r.ok) {
    if (r && r.error === 'OUT_OF_RANGE') return err(t('outside', { d: r.dist_m, r: r.radius_m }), errEl);
    if (r && r.error === 'NO_GPS') return err(t('noGps'), errEl);
    if (r && r.error === 'MAX_PUNCHES') return err(lang() === 'hi' ? 'आज के 4 पंच (2 IN + 2 OUT) पूरे हो गए। ज़रूरत हो तो SMT से बात करें।' : 'You have used all 4 punches for today (2 IN + 2 OUT). Talk to the SMT if needed.', errEl);
    if (r && r.error === 'OTHER_STORE') {
      const hi = lang() === 'hi', home = `${r.home_store}${r.home_store_name ? ' · ' + r.home_store_name : ''}`;
      const msg = r.sent_to_sm
        ? (r.status === 'rejected'
          ? (hi ? `यह फ़ोन स्टोर ${home} में रजिस्टर है। इस स्टोर के SM ने आज के लिए मना कर दिया है।` : `This phone is registered at store ${home}. The SM of this store has refused it for today.`)
          : (hi ? `यह फ़ोन स्टोर ${home} में रजिस्टर है। आज यहाँ पंच करने की रिक्वेस्ट इस स्टोर के SM को भेज दी गई है। SM के अप्रूव करने के बाद फिर से पंच करें।` : `This phone is registered at store ${home}. A request to punch here today has been sent to the SM of this store. Punch again after the SM approves.`))
        : (hi ? `यह फ़ोन स्टोर ${home} में रजिस्टर है, यहाँ पंच नहीं हो सकता (कोशिश ${r.tries} / 3)। हर कोशिश रिकॉर्ड होती है।` : `This phone is registered at store ${home}. It cannot punch at this store (try ${r.tries} of 3). Every try is recorded.`);
      return err(msg, errEl);
    }
    if (r && (r.error === 'OTHER_PHONE' || r.error === 'PHONE_IN_USE') && fromMe) memSet(null);
    return err(errText(r && r.error), errEl);
  }
  punchRes = { ...r, cat: c, vendor: v, brand: b };
  if (!modToken) memSet({ name: r.name, cat: c.id, brand: b, vendor: v, code: r.code });
  if (r.photo_required) { Cam.open(); return; }
  showDone();
}

/* ---------- instant camera: front camera, tiny face detector, auto-snap ~0.7 s after one face is in the oval ---------- */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function loadFaceApi() {
  if (!loadFaceApi.p) {
    loadFaceApi.p = new Promise((res, rej) => {
      if (window.faceapi) return res();
      const sc = document.createElement('script'); sc.src = 'assets/face/face-api.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    }).then(() => faceapi.nets.tinyFaceDetector.loadFromUri('assets/face'));
    loadFaceApi.p.catch(() => { loadFaceApi.p = null; });
  }
  return loadFaceApi.p;
}
const Cam = {
  ov: null, stop: null, run: 0, result: null, shot: null, ready: false, sawFace: false,
  el(s) { return this.ov.querySelector(s); },
  text(a, b) { this.el('.ct').textContent = a || ''; this.el('.cs').textContent = b || ''; },
  close() { this.run++; if (this.stop) { this.stop(); this.stop = null; } if (this.ov) { this.ov.remove(); this.ov = null; } },
  async open() {
    this.close();
    const run = ++this.run; this.shot = null; this.result = null; this.sawFace = false; this.ready = false;
    const ov = document.createElement('div'); ov.className = 'cam'; this.ov = ov;
    ov.innerHTML = `<div class="ct"></div><div class="cs"></div>
      <div class="vf"><video autoplay playsinline muted></video><img alt="" hidden><div class="oval"></div><div class="ln" hidden></div><div class="hold"><i></i></div></div>
      <div class="spinr"></div>
      <button class="shutter" type="button" aria-label="${esc(t('shutter'))}" hidden></button>
      <div class="note r" data-c="err" hidden></div>
      <div class="row" data-c="fail" hidden><button type="button" class="btn" data-c="retry">${esc(t('camRetry'))}</button><button type="button" class="btn s" data-c="retake">${esc(t('camRetake'))}</button></div>
      <div class="row" data-c="file" hidden><div class="note w">${esc(t('camNoCam'))}</div><label class="btn" style="cursor:pointer">📷 ${esc(t('camAppBtn'))}<input type="file" accept="image/*" capture="user" hidden></label></div>`;
    document.body.appendChild(ov);
    this.text(t('camStart'), `${punchRes.name} · ${punchRes.kind} ${punchRes.time}`);
    this.el('.shutter').addEventListener('click', () => this.capture(this.sawFace ? 'pass' : (this.ready ? 'noface' : 'skip')));
    this.el('[data-c="retry"]').addEventListener('click', () => this.upload());
    this.el('[data-c="retake"]').addEventListener('click', () => this.open());
    this.el('input[type=file]').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) this.fromFile(f); e.target.value = ''; });
    const v = this.el('video');
    try { this.stop = await startCamera(v); }
    catch (e) { if (run !== this.run) return; this.el('.spinr').hidden = true; this.el('video').hidden = true; this.el('.oval').hidden = true; this.el('.hold').hidden = true; this.el('[data-c="file"]').hidden = false; this.text(t('photoToday'), ''); return; }
    if (run !== this.run) return;
    this.el('.ln').hidden = false;
    if (ctx.live_check === false) { this.manual(); return; }   // live check off in Settings: plain shutter
    this.text(t('camFind'), '');
    const slow = setTimeout(() => { if (run === this.run && !this.shot) this.manual(); }, 3000);   // models slow: show the shutter, keep looking
    try { await loadFaceApi(); } catch (e) { clearTimeout(slow); if (run === this.run) this.manual(); return; }
    if (run !== this.run) return;
    this.ready = true;
    this.loop(run);
  },
  manual() {
    if (!this.ov) return;
    this.el('.spinr').hidden = true; this.el('.shutter').hidden = false;
    if (!this.ready) this.text(t('camSlow'), '');
  },
  async loop(run) {
    const v = this.el('video'), oval = this.el('.oval'), bar = this.el('.hold i');
    const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 });
    const vf = this.el('.vf');
    let since = 0;
    while (run === this.run && !this.shot) {
      if (!v.videoWidth) { await sleep(120); continue; }
      let dets = [];
      try { dets = await faceapi.detectAllFaces(v, opt); } catch (e) { this.manual(); return; }
      if (run !== this.run || this.shot) return;
      // visible part of the frame (object-fit: cover), then face centre inside the oval?
      const W = v.videoWidth, H = v.videoHeight, bw = vf.clientWidth || 300, bh = vf.clientHeight || 390;
      const sc = Math.max(bw / W, bh / H), visW = bw / sc, visH = bh / sc, x0 = (W - visW) / 2, y0 = (H - visH) / 2;
      let state = 'none';
      if (dets.length > 1) state = 'many';
      else if (dets.length === 1) {
        const b = dets[0].box, nx = (b.x + b.width / 2 - x0) / visW, ny = (b.y + b.height / 2 - y0) / visH, nw = b.width / visW;
        const inside = ((nx - 0.5) / 0.31) ** 2 + ((ny - 0.5) / 0.32) ** 2 <= 1;
        state = !inside ? 'out' : nw < 0.22 ? 'far' : 'ok';
      }
      if (state === 'ok') {
        this.sawFace = true;
        if (!since) since = Date.now();
        const p = Math.min(1, (Date.now() - since) / 700);
        oval.className = 'oval ok'; bar.style.width = (p * 100) + '%';
        this.text(t('camHold'), '');
        if (p >= 1) { this.capture('pass'); return; }
      } else {
        since = 0; bar.style.width = '0';
        oval.className = 'oval' + (state === 'none' ? '' : ' seen');
        this.text(state === 'many' ? t('camOne') : state === 'far' ? t('camCloser') : state === 'out' ? t('camCenter') : t('camFind'), '');
      }
      await sleep(state === 'ok' ? 30 : 80);
    }
  },
  async capture(result) {
    if (this.shot || !this.ov) return;
    const v = this.el('video'); if (!v.videoWidth) return;
    this.result = result;
    this.el('.shutter').disabled = true;
    const s = await compressDrawable(v, v.videoWidth, v.videoHeight, 8, 240, 320, true);
    if (!this.ov) return;
    this.shot = s;
    if (this.stop) { this.stop(); this.stop = null; }
    const img = this.el('.vf img'); img.src = s.b64; img.hidden = false; v.hidden = true;
    this.el('.ln').hidden = true; this.el('.hold').hidden = true; this.el('.shutter').hidden = true;
    this.upload();
  },
  async fromFile(file) {
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
      this.shot = await compressDrawable(img, img.width, img.height, 8);
      this.result = 'skip';
      const el = this.el('.vf img'); el.src = this.shot.b64; el.hidden = false;
      this.el('[data-c="file"]').hidden = true;
      this.upload();
    } catch (e) { this.el('[data-c="err"]').hidden = false; this.el('[data-c="err"]').textContent = t('photoFailed'); }
  },
  async upload() {
    if (!this.shot || !this.ov) return;
    this.el('[data-c="fail"]').hidden = true; this.el('[data-c="err"]').hidden = true;
    this.el('.spinr').hidden = false; this.text(t('camUp'), '');
    const res = this.result || 'skip';
    let lr = await rpc('punch_live', { p_photo_token: punchRes.photo_token, p_result: res });
    if (lr && lr.ok === false && lr.error === 'BAD_RESULT' && res === 'noface') await rpc('punch_live', { p_photo_token: punchRes.photo_token, p_result: 'fail' });   // backend without 'noface'
    const r = await photoFn({ action: 'upload', token: punchRes.photo_token, b64: this.shot.b64 });
    if (!this.ov) return;
    this.el('.spinr').hidden = true;
    if (!r || !r.ok) {
      this.text(t('photoFailed'), '');
      this.el('[data-c="err"]').hidden = false; this.el('[data-c="err"]').textContent = t('photoFailed') + (r && r.error ? ` (${r.error})` : '');
      this.el('[data-c="fail"]').hidden = false; return;
    }
    punchRes.photoKB = (this.shot.bytes / 1024).toFixed(1); punchRes.live = res;
    this.close(); showDone();
  },
};

function showDone() {
  const r = punchRes;
  $('#doneTitle').textContent = t('punchSaved', { k: r.kind });
  $('#doneSub').textContent = [r.name, catName(r.cat), r.vendor, r.brand, r.time, r.shift === 'M' ? t('morning') : t('evening')].filter(Boolean).join(' · ');
  const bits = [];
  if (r.photoKB) bits.push(`📷 ${r.live === 'pass' ? t('liveOk') + ' · ' : r.live === 'noface' ? t('liveNo') + ' · ' : ''}${t('selfieKB', { n: r.photoKB })}`);
  bits.push(r.dist_m != null ? '📍 ' + t('insideM', { d: r.dist_m }) : (ctx.test_mode ? t('testMode') : '📍 —'));
  if (modToken) bits.push(`${t('modMode')}: ${(me && me.name) || ''}`);
  $('#doneNote').textContent = bits.join(' · ');
  $('#doneNote').className = 'note ' + (r.live === 'noface' ? 'w' : 'k');
  show('done');
}
async function afterDone() {
  if (modToken) { resetForm(true); return; }
  show('loading');
  if (!(await openMe())) { resetForm(false); }
}
function resetForm(keepCat) {
  $('#name').value = ''; $('#modConsent').checked = false; lastLookup = null; $('#lookupNote').hidden = true; err();
  if (!keepCat) { cat = null; vendor = ''; brand = ''; }
  paintCats(); paintVendors(); paintRoster();
  $('#hSub').textContent = modToken ? ctx.store.name : t('firstSub');
  show('form');
}

/* ---------- init ---------- */
(async function init() {
  $('#langSlot').appendChild(langToggle(() => {
    if (!ctx) return;
    paintCats(); paintVendors(); gpsPaint();
    if (!$('#me').hidden && mem) { $('#meSub').textContent = [catName(catById(mem.cat)), mem.vendor, mem.brand, mem.code].filter(Boolean).join(' · '); $('#hSub').textContent = t('meSubT'); }
    else if (!$('#form').hidden) $('#hSub').textContent = modToken ? ctx.store.name : t('firstSub');
  }));
  $('#credit').innerHTML = credit(); applyI18n();
  let code = (q.get('s') || '').toUpperCase();
  if (q.get('mod') === '1') {
    me = await requireSession(['store']); if (!me) return;
    modToken = me.token; code = me.store_code;
    Idle.start({ minutes: me.idle_min || 60 });
    $('#btnBack').hidden = false; $('#btnBack').onclick = () => { location.href = 'store.html#pn'; };
    $('#modNote').hidden = false; $('#modNote').textContent = `${t('modMode')}: ${me.name} (Emp ${me.emp})`;
    $('#noPhone').hidden = true; $('#rememberNote').hidden = true; $('#nameLbl').textContent = t('associate'); $('#modConsentWrap').hidden = false;
  }
  if (!/^[A-Z]{2}\d{2}$/.test(code)) return fatal(t('storeHint'));
  ctx = await rpc('punch_context', { p_store: code });
  if (!ctx || !ctx.ok) return fatal(errText(ctx && ctx.error));
  $('#hTitle').textContent = `${ctx.store.code} · ${ctx.store.name}`;
  $('#hSub').textContent = modToken ? t('punchTitle') : t('firstSub');
  document.title = `${t('punchTitle')} ${ctx.store.code} · 3rd Party Attendance`;
  if (!modToken) {
    const ready = await permissionsReady('associate', true);
    if (!ready) { $('#loading').hidden = true; const g = await consentGate({ kind: 'associate', store: ctx.store.code, testMode: ctx.test_mode, needCamera: true }); if (g && g.pos) { pos = g.pos; posAt = Date.now(); } }
    else if (ready.pos) { pos = ready.pos; posAt = Date.now(); }
  }
  gpsPaint(); if (!pos) locate();
  setTimeout(() => loadFaceApi().catch(() => {}), 500);   // models load while the person is on the form: no wait at the selfie
  if (modToken || !(await openMe())) resetForm(false);

  document.addEventListener('click', (e) => { if (e.target.closest('[data-gps]')) locate(); });
  $('#cats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    cat = catById(b.dataset.c); vendor = ''; brand = ''; lastLookup = null;
    const V = vendorsFor(cat); if (V.length === 1) { vendor = V[0].vendor; brand = V[0].brand || ''; }
    paintCats(); paintVendors(); paintRoster(); lookup();
    setTimeout(() => $('#vWrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 30);
  });
  $('#vendors').addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    vendor = b.dataset.v; brand = b.dataset.b || ''; err();
    paintVendors(); lookup();
    if (!$('#nWrap').hidden) setTimeout(() => { $('#nWrap').scrollIntoView({ behavior: 'smooth', block: 'center' }); if (!$('#name').value) $('#name').focus(); }, 30);
  });
  $('#brands').addEventListener('click', (e) => { const b = e.target.closest('[data-br]'); if (!b) return; brand = b.dataset.br; paintVendors(); lookup(); });
  $('#name').addEventListener('input', () => { $('#st3').classList.toggle('done', $('#name').value.trim().length >= 3); clearTimeout(lookTimer); lookTimer = setTimeout(lookup, 400); });
  $('#name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doPunch(false); } });
  $('#roster').addEventListener('click', (e) => {
    const li = e.target.closest('.li'); if (!li) return;
    if (li.dataset.new) { $('#name').value = ''; $('#name').focus(); lookup(); return; }
    if (li.dataset.v) vendor = li.dataset.v;
    if (li.dataset.b) brand = li.dataset.b;
    paintVendors();
    $('#name').value = li.dataset.n; lookup();
    $('#punchBtns').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#punchBtns').addEventListener('click', (e) => { const b = e.target.closest('.bigbtn'); if (b && !b.disabled) doPunch(false); });
  $('#me').addEventListener('click', (e) => { const b = e.target.closest('.bigbtn'); if (b && !b.disabled) doPunch(true); });
  $('#btnChange').addEventListener('click', () => { memSet(null); mem = null; resetForm(false); });
  $('#btnAgain').addEventListener('click', afterDone);
})();
