<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://phyllziizajuphenpwxz.supabase.co; media-src 'self' blob:; connect-src 'self' https://phyllziizajuphenpwxz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Statement · 3rd Party Attendance</title>
<link rel="preconnect" href="https://phyllziizajuphenpwxz.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* the A4 sheet is paper: fixed light colours in every theme (only the header strip follows the theme colour) */
  @page { size: A4 portrait; margin: 0; }
  .sheet { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; color: #1A2130; padding: 14mm; display: flex; flex-direction: column; gap: 5mm; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .sheet .shd { display: flex; justify-content: center; align-items: center; text-align: center; border-bottom: 3px solid var(--pri); padding-bottom: 4mm; font-size: 16pt; font-weight: 800; letter-spacing: .3px; }
  :root[data-theme="dark"] .sheet .shd { border-bottom-color: #334155; }
  .sheet .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm 6mm; font-size: 10pt; color: #5A6472; }
  .sheet .meta b { color: #1A2130; }
  .sheet .grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #E2E6EC; }
  .sheet .grid > div { border: .5px solid #E2E6EC; min-height: 22mm; padding: 1.5mm 2mm; font-size: 9pt; }
  .sheet .grid .h { min-height: auto; background: #334155; color: #fff; font-weight: 700; text-align: center; padding: 1.5mm 0; font-size: 8.5pt; }
  .sheet .grid .n { font-weight: 700; color: #5A6472; }
  .sheet .grid .blank { background: #FAFBFC; }
  .sheet .st { margin-top: 2mm; display: inline-block; font-weight: 800; font-size: 11pt; padding: .5mm 3mm; border-radius: 2mm; }
  .sheet .st.P { background: #E9F5EC; color: #1E8E3E; }
  .sheet .st.A { background: #FDEDEC; color: #C0392B; }
  .sheet .st.H { background: #FFF4E0; color: #B26A00; }
  .sheet .st.CO { background: #EEF2F6; color: #334155; font-size: 8pt; }
  .sheet .sum { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 3mm; }
  .sheet .sum div { border-radius: 2mm; padding: 3mm; text-align: center; font-size: 9pt; background: #F3F6FA; color: #1A2130; }
  .sheet .sum b { display: block; font-size: 15pt; margin-top: 1mm; }
  .sheet .sum .p { background: #E9F5EC; color: #1E8E3E; } .sheet .sum .a { background: #FDEDEC; color: #C0392B; } .sheet .sum .h { background: #FFF4E0; color: #B26A00; } .sheet .sum .c { background: #EEF2F6; color: #334155; }
  .sheet .leg { font-size: 8.5pt; color: #5A6472; }
  .sheet .rs { display: block; margin-top: 1mm; color: #F59E0B; font-size: 8.5pt; letter-spacing: .3px; white-space: nowrap; }
  .sheet .rs i { color: #D5DAE1; font-style: normal; }
  .sheet .rs.m { color: #8A94A3; font-size: 7.5pt; letter-spacing: 0; }
  .sheet .rtab { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
  .sheet .rtab th { background: #EEF2F6; color: #334155; text-align: left; padding: 1mm 2mm; font-size: 8pt; }
  .sheet .rtab td, .sheet .rtab th { text-align: left; }
  .sheet .rtab td { border-top: .5px solid #E2E6EC; padding: 1mm 2mm; vertical-align: top; }
  .sheet .rtab .bad { color: #C0392B; }
  .sheet .rh { font-weight: 800; font-size: 10pt; }
  .sheet .sign { display: flex; gap: 12mm; margin-top: auto; }
  .sheet .sign div { flex: 1; text-align: center; font-size: 9pt; color: #5A6472; }
  .sheet .sign .box { height: 22mm; border: 1px dashed #C9D0DA; border-radius: 2mm; }
  .sheet .sign .ln { height: 22mm; border-bottom: 1px solid #1A2130; }
  .ctl .frm { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .ctl .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .solo { max-width: 860px; margin: 0 auto; width: 100%; }
  @media screen and (max-width: 840px) {
    .sheet { width: 100%; min-height: auto; margin: 0; padding: 16px; }
    .sheet .grid > div { min-height: 56px; font-size: 11px; padding: 3px; }
    .sheet .st { font-size: 11px; padding: 0 4px; }
    .sheet .meta { grid-template-columns: 1fr 1fr; font-size: 12px; }
    .sheet .sum { grid-template-columns: repeat(3, 1fr); }
    .sheet .sign { margin-top: 12px; }
  }
  /* phone-app chrome (store login): the sheet fits the 480 px column on screen */
  .mapp .sheet { width: 100%; min-height: auto; margin: 0; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.1); border-radius: 6px; }
  .mapp .sheet .grid > div { min-height: 48px; font-size: 11px; padding: 3px; }
  .mapp .sheet .st { font-size: 11px; padding: 0 4px; }
  .mapp .sheet .meta { grid-template-columns: 1fr 1fr; font-size: 12px; }
  .mapp .sheet .sum { grid-template-columns: repeat(3, 1fr); }
  .mapp .sheet .shd { font-size: 17px; }
  @media print {
    html, body { background: #fff !important; }
    .noprint, .mhd, .mmenu, .mtab, .hdr, .foot, .viewbar { display: none !important; }
    .mapp { max-width: none !important; box-shadow: none !important; background: #fff !important; min-height: 0 !important; display: block !important; }
    .mapp .wrap, .wrap { padding: 0 !important; display: block !important; }
    .sheet, .mapp .sheet { width: 210mm !important; min-height: 297mm !important; margin: 0 !important; padding: 14mm !important; box-shadow: none !important; border-radius: 0 !important; }
    .sheet .grid > div, .mapp .sheet .grid > div { min-height: 22mm !important; font-size: 9pt !important; padding: 1.5mm 2mm !important; }
    .sheet .grid > .h, .mapp .sheet .grid > .h { min-height: 0 !important; padding: 1.5mm 0 !important; font-size: 8.5pt !important; }
    .sheet .st, .mapp .sheet .st { font-size: 11pt !important; padding: .5mm 3mm !important; }
    .sheet .st.CO { font-size: 8pt !important; }
    .sheet .meta, .mapp .sheet .meta { grid-template-columns: repeat(3, 1fr) !important; font-size: 10pt !important; }
    .sheet .sum, .mapp .sheet .sum { grid-template-columns: repeat(var(--n, 4), 1fr) !important; }
    .sheet .shd { font-size: 16pt !important; }
    .sheet .sign { margin-top: auto !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/app.js"></script>
<script src="assets/store-app.js"></script>
<script>
let me = null, data = null, assocRows = [], wrap = null;
const q = new URLSearchParams(location.search);
const STL = { P: 'P', A: 'A', H: 'H', CO: 'Comp-Off' };

function err(m) { const e = $('#err'); if (!e) return; e.hidden = !m; e.textContent = m || ''; }

function controls(isStore) {
  return `<div class="card ctl noprint"><div class="frm">
      ${isStore ? '' : `<label>Store<input class="f" id="store" maxlength="4" style="text-transform:uppercase" placeholder="AA01" autocomplete="off"></label>`}
      <label>${esc(t('dept'))}<select id="dept"><option value="">${esc(t('allDepts'))}</option></select></label>
      <label>${esc(t('associate'))}<select id="assoc"><option value="">${esc(t('selAssoc'))}</option></select></label>
      <label>From<input class="f" type="date" id="dFrom"></label><label>To<input class="f" type="date" id="dTo"></label></div>
    <div class="acts" style="margin-top:0"><button class="btn ghost sm" data-rng="tm">This month</button><button class="btn ghost sm" data-rng="lm">Last month</button><button class="btn ghost sm" data-rng="30">Last 30 days</button><span style="color:var(--mut);font-size:12px;align-self:center">Any range up to 62 days (match your payroll cycle)</span></div>
    <div class="acts"><button class="btn sm" id="btnShow">${esc(t('show'))}</button><button class="btn s sm" id="btnPrint">${esc(t('print'))}</button><button class="btn s sm" id="btnXls">${esc(t('excel'))}</button></div>
    <div id="err" class="note r" hidden style="margin-top:8px"></div></div>
  <section class="sheet" id="sheet" hidden>
    <div class="shd">Attendance Statement</div>
    <div class="meta" id="meta"></div>
    <div class="grid" id="grid"></div>
    <div class="sum" id="sum"></div>
    <div class="leg" id="leg"></div>
    <div id="rate"></div>
    <div class="sign"><div><div class="box"></div>Store Stamp</div><div><div class="ln"></div>Store Manager Signature</div></div>
  </section>`;
}

function paintAssoc() {
  const d = $('#dept').value, cur = $('#assoc').value || q.get('a') || '';
  const cats = [...new Map(assocRows.map((a) => [a.c, a.cat_name || a.c])).entries()];
  const dsel = $('#dept').value;
  $('#dept').innerHTML = `<option value="">${esc(t('allDepts'))}</option>` + cats.map(([c, n]) => `<option value="${esc(c)}" ${c === dsel ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const L = assocRows.filter((a) => !d || a.c === d);
  $('#assoc').innerHTML = `<option value="">${esc(t('selAssoc'))}</option>` + L.map((a) => `<option value="${a.id}">${esc(a.name)} · ${esc(a.cat_name || a.c)}${a.brand ? ' ' + esc(a.brand) : ''} · ${esc(a.code)}</option>`).join('');
  if (cur && L.some((a) => String(a.id) === String(cur))) $('#assoc').value = cur;
}
const CATN = { HK: 'Housekeeping', SEC: 'Security', TRAVEL: 'Travel', CDIT: 'CDIT' };
async function loadAssoc() {
  const code = me.role === 'store' ? me.store_code : ($('#store').value || '').trim().toUpperCase();
  if (!/^[A-Z]{2}\d{2}$/.test(code)) return;
  err();
  const r = await rpc('associates_list', { p_token: me.token, p_store: code });
  if (!r || !r.ok) return err(errText(r && r.error));
  assocRows = r.rows.map((a) => ({ ...a, cat_name: CATN[a.c] || a.c }));
  paintAssoc();
}

async function show(touched) {
  err();
  const id = Number($('#assoc').value); if (!id) return err(t('selAssoc') + '.');
  const from = $('#dFrom').value, to = $('#dTo').value;
  if (!from || !to) return err('Select From and To dates.');
  if (to < from) return err('To date must be on or after From date.');
  if ((parseYmd(to) - parseYmd(from)) / 864e5 > 61) return err('Range can be at most 62 days.');
  $('#btnShow').disabled = true;
  const r = await rpc('statement', { p_token: me.token, p_associate: id, p_from: from, p_to: to });
  $('#btnShow').disabled = false;
  if (!r || !r.ok) return err(errText(r && r.error));
  data = r; render();
}

function statusOf(d) {
  // v5: statement RPC gives st = P / H / A / CO / '' (future). Older backend: fall back to co / in.
  if (d.st !== undefined && d.st !== null) return d.st;
  if (d.co) return 'CO';
  if (d.in) return 'P';
  return d.d >= todayIST() ? '' : 'A';
}

function render() {
  const r = data, a = r.associate, sec = a.c === 'SEC';
  const first = parseYmd(r.from);
  $('#meta').innerHTML = `<div>Store: <b>${esc(r.store.code)} · ${esc(r.store.name || '')}</b></div><div>Vendor: <b>${esc(a.vendor || '—')}</b></div>
    <div>Period: <b>${fmtDay(r.from)} – ${fmtDate(r.to)}</b></div><div>Department: <b>${esc(a.cat_name || a.c)}${a.brand ? ' – ' + esc(a.brand) : ''}</b></div>
    <div>Associate: <b>${esc(a.name)}</b></div><div>Employee Code: <b>${esc(a.code)}</b></div>`;
  let cells = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) cells += '<div class="blank"></div>';
  const n = { P: 0, A: 0, H: 0, CO: 0 };
  r.days.forEach((d) => {
    let st = statusOf(d);
    if (st === 'H' && !sec) st = 'P';
    if (n[st] !== undefined) n[st]++;
    cells += `<div><div class="n">${parseYmd(d.d).getDate()}</div>${st ? `<span class="st ${st}">${STL[st]}</span>` : ''}${starsOf(d)}</div>`;
  });
  let total = first.getDay() + r.days.length;
  while (total % 7) { cells += '<div class="blank"></div>'; total++; }
  $('#grid').innerHTML = cells;
  const W = n.P + n.A + n.H;
  $('#sum').style.setProperty('--n', sec ? 5 : 4);
  $('#sum').innerHTML = `<div>Working Days<b>${W}</b></div><div class="p">Present<b>${n.P}</b></div>${sec ? `<div class="h">Half day<b>${n.H}</b></div>` : ''}
    <div class="a">Absent<b>${n.A}</b></div><div class="c">Comp-Off<b>${n.CO}</b></div>`;
  const set = r.store.sg_set || 8;
  $('#leg').textContent = `P = Present · A = Absent${sec ? ` · H = Half day (Security ${set}-hr set)` : ''} · Comp-Off = approved comp-off. No punch timings are shown on this statement.`;
  $('#sheet').hidden = false;
  document.title = `Statement ${a.code} ${r.from} to ${r.to} · 3rd Party Attendance`;
  data.summary = { W, ...n };
  paintRate();
}
/* v5.5: SM/ASM daily rating (1–5 ★) under each day + list with reasons */
const STARS = (k) => '★'.repeat(k) + `<i>${'★'.repeat(5 - k)}</i>`;
function starsOf(d) {
  if (d.rs) return `<span class="rs" title="Rating ${d.rs}/5${d.rtag ? ' · ' + esc(d.rtag) : ''}">${STARS(d.rs)}</span>`;
  if (d.rmiss) return '<span class="rs m">Not rated</span>';
  return '';
}
function paintRate() {
  const el = $('#rate'); if (!el) return;
  const rated = data.days.filter((d) => d.rs), miss = data.days.filter((d) => d.rmiss).length;
  if (!rated.length && !miss) { el.innerHTML = ''; return; }
  const avg = rated.length ? (rated.reduce((a, d) => a + d.rs, 0) / rated.length).toFixed(1) : '—';
  el.innerHTML = `<div class="rh">Daily rating by SM / ASM · average <span style="color:#F59E0B">★ ${avg}</span> <span style="font-weight:400;color:#5A6472;font-size:8.5pt">(${rated.length} day${rated.length === 1 ? '' : 's'} rated${miss ? ` · ${miss} not rated` : ''})</span></div>
    ${rated.length ? `<table class="rtab" style="margin-top:2mm"><thead><tr><th>Date</th><th>Rating</th><th>Reason (1–2 ★)</th><th>Rated by</th></tr></thead><tbody>
    ${rated.map((d) => `<tr><td>${esc(fmtDay(d.d))}</td><td><span class="rs" style="display:inline">${STARS(d.rs)}</span> ${d.rs}/5</td><td class="${d.rs <= 2 ? 'bad' : ''}">${d.rtag ? esc(d.rtag) + (d.rnote ? ' · ' + esc(d.rnote) : '') : ''}</td><td>${esc(d.rby || '')}</td></tr>`).join('')}</tbody></table>` : ''}`;
  data.summary.avg = avg;
}

function xls() {
  if (!data) return err(t('show') + ' ›');
  const a = data.associate, sec = a.c === 'SEC';
  const rows = data.days.map((d) => { let st = statusOf(d); if (st === 'H' && !sec) st = 'P';
    return { Date: d.d, Store: data.store.code, Name: a.name, Dept: (a.cat_name || a.c) + (a.brand ? ' – ' + a.brand : ''), Vendor: a.vendor || '', Status: STL[st] || '',
      'Rating (★)': d.rs || (d.rmiss ? 'Not rated' : ''), 'Reason': d.rtag ? d.rtag + (d.rnote ? ' · ' + d.rnote : '') : '', 'Rated by': d.rby || '' }; });
  downloadXlsx(rows, `Statement_${a.code}_${data.from}_${data.to}.xlsx`, 'Statement');
}

(async function init() {
  me = await requireSession(); if (!me) return;
  const isStore = me.role === 'store';
  const root = $('#root');
  if (isStore) {
    const sh = storeShell(root, me, 'stm', { onLang: () => location.reload() });
    sh.setTitle(t('tabStm'));
    wrap = sh.wrap;
  } else {
    root.innerHTML = `<header class="hdr noprint"><div class="t"><b>${esc(t('stmTitle'))}</b><small id="hSub" style="display:block;opacity:.8;font-size:12px">${esc(roleLabel(me.role))} · ${esc(me.name || '')}</small></div>
      <button class="x" id="btnClose" style="margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;width:38px;height:36px;font-size:16px" aria-label="Close">✕</button></header>
      <div class="wrap solo"></div><p class="foot noprint">${credit()}</p>`;
    wrap = root.querySelector('.wrap');
    $('#btnClose').addEventListener('click', () => (history.length > 1 ? history.back() : (location.href = homeFor(me.role))));
  }
  wrap.innerHTML = controls(isStore);
  Idle.start({ minutes: me.idle_min || 60 });
  const td = todayIST();
  $('#dFrom').value = q.get('from') || monthStart(td); $('#dTo').value = q.get('to') || td;
  $('#dFrom').max = td; $('#dTo').max = td;
  $$('[data-rng]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.rng, n = istNow();
    if (k === 'tm') { $('#dFrom').value = monthStart(td); $('#dTo').value = td; }
    else if (k === 'lm') { $('#dFrom').value = ymd(new Date(n.getFullYear(), n.getMonth() - 1, 1)); $('#dTo').value = ymd(new Date(n.getFullYear(), n.getMonth(), 0)); }
    else { $('#dFrom').value = ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 29)); $('#dTo').value = td; }
    if ($('#assoc').value) show(true);
  }));
  if (!isStore && q.get('s')) $('#store').value = q.get('s').toUpperCase();
  if (isStore || q.get('s')) await loadAssoc();
  if (q.get('a')) {
    if (![...$('#assoc').options].some((o) => o.value === q.get('a'))) $('#assoc').insertAdjacentHTML('beforeend', `<option value="${esc(q.get('a'))}">#${esc(q.get('a'))}</option>`);
    $('#assoc').value = q.get('a'); show(false);
  }
  if (!isStore) { $('#store').addEventListener('change', loadAssoc); $('#store').addEventListener('input', (e) => { if (e.target.value.length === 4) loadAssoc(); }); }
  $('#dept').addEventListener('change', paintAssoc);
  $('#assoc').addEventListener('change', () => { if ($('#assoc').value) show(true); });
  ['#dFrom', '#dTo'].forEach((x) => $(x).addEventListener('change', () => { if ($('#assoc').value) show(true); }));
  $('#btnShow').addEventListener('click', () => show(true));
  $('#btnPrint').addEventListener('click', () => { if (!data) return err(t('selAssoc') + '.'); window.print(); });
  $('#btnXls').addEventListener('click', xls);
})();
</script>
</body>
</html>
