<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Statement · 3rd Party Attendance</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  @page { size: A4 portrait; margin: 0; }
  .a4 { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; padding: 14mm; display: flex; flex-direction: column; gap: 5mm; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .hd { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--blue); padding-bottom: 4mm; }
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm 6mm; font-size: 10pt; color: var(--mut); }
  .meta b { color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); }
  .grid > div { border: .5px solid var(--line); min-height: 22mm; padding: 1.5mm 2mm; font-size: 9pt; }
  .grid .h { min-height: auto; background: var(--blue); color: #fff; font-weight: 700; text-align: center; padding: 1.5mm 0; font-size: 8.5pt; }
  .grid .n { font-weight: 700; color: var(--mut); }
  .grid .tm { margin-top: 2mm; font-weight: 600; font-size: 8.5pt; }
  .grid .ab { margin-top: 2mm; display: inline-block; background: var(--red-l); color: var(--red); font-weight: 700; font-size: 8pt; padding: .5mm 2mm; border-radius: 2mm; }
  .grid .co { margin-top: 2mm; display: inline-block; background: var(--ok-l); color: var(--ok); font-weight: 700; font-size: 8pt; padding: .5mm 2mm; border-radius: 2mm; }
  .grid .blank { background: #FAFBFC; }
  .sum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3mm; }
  .sum div { border-radius: 2mm; padding: 3mm; text-align: center; font-size: 9pt; background: var(--bg); }
  .sum b { display: block; font-size: 15pt; margin-top: 1mm; }
  .sign { display: flex; gap: 12mm; margin-top: auto; }
  .sign div { flex: 1; text-align: center; font-size: 9pt; color: var(--mut); }
  @media screen and (max-width: 840px) { .a4 { width: 100%; min-height: auto; margin: 0; padding: 16px; box-shadow: none; } .grid > div { min-height: 56px; font-size: 11px; } .meta { grid-template-columns: 1fr 1fr; } .sum { grid-template-columns: repeat(3, 1fr); } }
  @media print { body { background: #fff; } .a4 { margin: 0; box-shadow: none; } }
</style>
</head>
<body>
<header class="hdr noprint">
  <div class="t"><b>Monthly statement</b><small id="hSub"></small></div>
  <button class="x" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">✕</button>
</header>
<div class="wrap noprint" style="max-width:820px">
  <div class="panel">
    <div class="row">
      <div class="field grow" id="storeField" hidden><label class="lbl" for="store">Store</label><input class="in" id="store" maxlength="4" style="text-transform:uppercase" placeholder="AA01"></div>
      <div class="field grow"><label class="lbl" for="assoc">Associate</label><select class="in" id="assoc"><option value="">Select associate</option></select></div>
      <div class="field"><label class="lbl" for="month">Month</label><input class="in" type="month" id="month"></div>
    </div>
    <div class="row"><button class="btn sm" id="btnShow">Show</button><button class="btn o sm" id="btnPrint">🖨 Print / Save as PDF</button><button class="btn o sm" id="btnXls">⬇ Excel</button></div>
    <div id="err" class="note r" hidden></div>
  </div>
</div>
<section class="a4" id="sheet" hidden>
  <div class="hd"><img src="assets/logo.png" alt="Vishal Mega Mart" style="height:12mm">
    <div style="text-align:right"><div style="font-size:15pt;font-weight:800">Monthly Attendance Statement</div><div style="font-size:9pt;color:var(--mut)">3rd Party Staff · VMM Central Ops &amp; BI</div></div></div>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div class="sum" id="sum"></div>
  <div class="sign"><div><div style="height:22mm;border:1px dashed #C9D0DA;border-radius:2mm"></div>Store Stamp</div><div><div style="height:22mm;border-bottom:1px solid var(--ink)"></div>Store Manager Signature</div></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
<script>
let me = null, data = null;
const q = new URLSearchParams(location.search);
function err(m) { $('#err').hidden = !m; $('#err').textContent = m || ''; }

async function loadAssoc() {
  const code = me.role === 'store' ? me.store_code : $('#store').value.trim().toUpperCase();
  if (!/^[A-Z]{2}\d{2}$/.test(code)) return;
  const r = await rpc('associates_list', { p_token: me.token, p_store: code });
  if (!r || !r.ok) return err(errText(r && r.error));
  $('#assoc').innerHTML = '<option value="">Select associate</option>' + r.rows.map((a) => `<option value="${a.id}">${esc(a.name)} · ${esc(a.code)}</option>`).join('');
  if (q.get('a')) $('#assoc').value = q.get('a');
}

async function show() {
  err();
  const id = Number($('#assoc').value); if (!id) return err('Select an associate.');
  const [y, m] = $('#month').value.split('-').map(Number);
  const from = q.get('from') && !show.touched ? q.get('from') : ymd(new Date(y, m - 1, 1));
  const to = q.get('to') && !show.touched ? q.get('to') : ymd(new Date(y, m, 0));
  const r = await rpc('statement', { p_token: me.token, p_associate: id, p_from: from, p_to: to });
  if (!r || !r.ok) return err(errText(r && r.error));
  data = r; render();
}

function render() {
  const r = data, a = r.associate, today = todayIST();
  const first = parseYmd(r.from);
  $('#meta').innerHTML = `<div>Store: <b>${esc(r.store.code)} · ${esc(r.store.name)}</b></div><div>Vendor: <b>${esc(a.vendor || '—')}</b></div>
    <div>Period: <b>${fmtDay(r.from)} – ${fmtDate(r.to)}</b></div><div>Department: <b>${esc(a.cat_name)}${a.brand ? ' – ' + esc(a.brand) : ''}</b></div>
    <div>Associate: <b>${esc(a.name)}</b></div><div>Employee Code: <b>${esc(a.code)}</b></div>`;
  let cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d) => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) cells += '<div class="blank"></div>';
  let P = 0, A = 0, CO = 0, H = 0, W = 0;
  r.days.forEach((d) => {
    const n = parseYmd(d.d).getDate(); let inner = '';
    if (d.d > today) inner = '';
    else if (d.co) { inner = '<span class="co">Comp-Off</span>'; CO++; }
    else if (d.in) { inner = `<div class="tm">${d.in}–${d.out || '…'}</div>`; P++; H += Number(d.hours || 0); W++; }
    else { inner = '<span class="ab">Absent</span>'; A++; W++; }
    cells += `<div><div class="n">${n}</div>${inner}</div>`;
  });
  let total = first.getDay() + r.days.length;
  while (total % 7) { cells += '<div class="blank"></div>'; total++; }
  $('#grid').innerHTML = cells;
  $('#sum').innerHTML = `<div>Working Days<b>${W}</b></div><div style="background:var(--ok-l);color:var(--ok)">Present<b>${P}</b></div>
    <div style="background:var(--red-l);color:var(--red)">Absent<b>${A}</b></div><div style="background:var(--blue-l);color:var(--blue)">Comp-Off<b>${CO}</b></div><div>Total Hours<b>${H.toFixed(1)}</b></div>`;
  $('#sheet').hidden = false; $('#hSub').textContent = `${a.name} · ${a.code}`;
  data.summary = { W, P, A, CO, H };
}

(async function init() {
  me = await requireSession(); if (!me) return;
  $('#storeField').hidden = me.role === 'store';
  const m0 = q.get('from') ? q.get('from').slice(0, 7) : todayIST().slice(0, 7);
  $('#month').value = m0; $('#month').max = todayIST().slice(0, 7);
  if (q.get('s')) $('#store').value = q.get('s');
  if (me.role === 'store' || q.get('s')) await loadAssoc();
  if (q.get('a')) { if (![...$('#assoc').options].some((o) => o.value === q.get('a'))) $('#assoc').insertAdjacentHTML('beforeend', `<option value="${q.get('a')}">#${q.get('a')}</option>`); $('#assoc').value = q.get('a'); show(); }
  $('#store').addEventListener('change', loadAssoc);
  $('#btnShow').addEventListener('click', () => { show.touched = true; show(); });
  $('#month').addEventListener('change', () => { show.touched = true; });
  $('#btnPrint').addEventListener('click', () => { if (!data) return err('Click Show first.'); window.print(); });
  $('#btnXls').addEventListener('click', () => { if (!data) return err('Click Show first.');
    const a = data.associate;
    const rows = data.days.map((d) => ({ Date: d.d, Store: data.store.code, Code: a.code, Name: a.name, Department: a.cat_name, Brand: a.brand, Vendor: a.vendor,
      IN: d.in || '', OUT: d.out || '', Hours: d.hours || '', Status: d.co ? 'Comp-Off' : d.in ? 'Present' : (d.d > todayIST() ? '' : 'Absent') }));
    downloadXlsx(rows, `Statement_${a.code}_${data.from}_${data.to}.xlsx`); });
})();
</script>
</body>
</html>
