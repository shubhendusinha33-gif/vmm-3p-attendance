<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3PA Portal Preview v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap">
<style>
/* Default theme = Slate & Orange. Users can switch theme from the menu (saved on their device). Status colours never change. */
:root{--pri:#334155;--pri-d:#0F172A;--pri-l:#EEF2F6;--acc:#EA580C;--acc-l:#FFF1E8;--side:#1E293B;--wk:#94A3B8;--thead:#EDF1F5;
--ink:#1A2130;--mut:#5A6472;--line:#E2E6EC;--bg:#F3F6FA;--card:#fff;--hover:#F7F8FC;--track:#E6EBF2;--grey:#98A1AE;
--ok:#1E8E3E;--ok-l:#E9F5EC;--red:#C0392B;--red-l:#FDEDEC;--amb:#B26A00;--amb-l:#FFF4E0;--font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-pal="p1"]{--pri:#4338CA;--pri-d:#312E81;--pri-l:#EEF2FF;--acc:#0D9488;--acc-l:#E6F6F4;--side:#312E81;--wk:#A5B4FC;--thead:#EEF0FB}
:root[data-pal="p2"]{--pri:#0F766E;--pri-d:#134E4A;--pri-l:#E7F5F3;--acc:#7C3AED;--acc-l:#F1EBFE;--side:#0F4C5C;--wk:#8FD3CB;--thead:#E6F2F0}
:root[data-pal="p4"]{--pri:#6B2C91;--pri-d:#4C1D60;--pri-l:#F4ECF8;--acc:#0284C7;--acc-l:#E6F4FB;--side:#4C1D60;--wk:#C4A3D9;--thead:#F2EAF6}
:root[data-pal="p5"]{--pri:#1D4E89;--pri-d:#0B2545;--pri-l:#E8F0F9;--acc:#0891B2;--acc-l:#E3F5F9;--side:#0B2545;--wk:#93B4DB;--thead:#E7EEF7}
:root[data-pal="p6"]{--pri:#374151;--pri-d:#111827;--pri-l:#F0F1F4;--acc:#7C3AED;--acc-l:#F1EBFE;--side:#111827;--wk:#9CA3AF;--thead:#EEF0F3}
:root[data-pal="p7"]{--pri:#5D4037;--pri-d:#3E2723;--pri-l:#F5EFEC;--acc:#0D9488;--acc-l:#E6F6F4;--side:#3E2723;--wk:#BCA59B;--thead:#F3ECE8}
:root[data-pal="p8"]{--pri:#7A2840;--pri-d:#5B1A2E;--pri-l:#F8ECF0;--acc:#2563EB;--acc-l:#EAF1FE;--side:#5B1A2E;--wk:#D3A3B1;--thead:#F5E9ED}
:root[data-pal="cur"]{--pri:#1565C0;--pri-d:#0D47A1;--pri-l:#EAF3FC;--acc:#E91E8C;--acc-l:#FDE8F3;--side:#1565C0;--wk:#90B6E4;--thead:#EAF0F8}
:root[data-theme="dark"]{--ink:#E8ECF2;--mut:#9AA5B5;--line:#2A3342;--bg:#0F141C;--card:#171E29;--hover:#1B2432;--track:#2A3342;--grey:#6B7686;--thead:#1D2736;
--ok:#52C878;--ok-l:#12301D;--red:#F0766A;--red-l:#3A1C19;--amb:#E8A640;--amb-l:#382A10;--pri:#A5B4C8;--pri-d:#DCE3EC;--pri-l:#1E2733;--acc:#FB8A3C;--acc-l:#3A2010;--side:#0B1220;--wk:#4B5A6E;color-scheme:dark}
:root[data-theme="dark"][data-pal="p1"]{--pri:#8B93F5;--pri-d:#C3C8FB;--pri-l:#1E2147;--acc:#2DD4BF;--acc-l:#0F2F2C;--side:#1B1A4B;--wk:#4B4F9A}
:root[data-theme="dark"][data-pal="p2"]{--pri:#3CC2B5;--pri-d:#9BE3DA;--pri-l:#0E2B29;--acc:#A78BFA;--acc-l:#2A1D4A;--side:#0A2E37;--wk:#2A6F68}
:root[data-theme="dark"][data-pal="p4"]{--pri:#C08AE0;--pri-d:#E4C9F2;--pri-l:#2B1638;--acc:#38BDF8;--acc-l:#0D2C3D;--side:#2C0F3A;--wk:#6E4A85}
:root[data-theme="dark"][data-pal="p5"]{--pri:#7FB0EC;--pri-d:#C2DAF7;--pri-l:#13243A;--acc:#22D3EE;--acc-l:#0B2E36;--side:#071A31;--wk:#355C8A}
:root[data-theme="dark"][data-pal="p6"]{--pri:#B3BAC6;--pri-d:#E2E5EA;--pri-l:#1F242D;--acc:#A78BFA;--acc-l:#2A1D4A;--side:#0A0F18;--wk:#4B5361}
:root[data-theme="dark"][data-pal="p7"]{--pri:#C9A89B;--pri-d:#EAD9D2;--pri-l:#2A1E1A;--acc:#2DD4BF;--acc-l:#0F2F2C;--side:#24160F;--wk:#6E5449}
:root[data-theme="dark"][data-pal="p8"]{--pri:#E08AA3;--pri-d:#F3C8D4;--pri-l:#33141E;--acc:#60A5FA;--acc-l:#10233F;--side:#3A0F1C;--wk:#7A4352}
:root[data-theme="dark"][data-pal="cur"]{--pri:#6AA8F0;--pri-d:#A9CDF8;--pri-l:#14243B;--acc:#F0509F;--acc-l:#3A1528;--side:#0B2A52;--wk:#3F6FA8}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button{font-family:var(--font);cursor:pointer;color:inherit}input,select,textarea{font-family:var(--font);color:var(--ink)}
[hidden]{display:none!important}a{color:var(--pri)}
@keyframes pgin{from{opacity:0;transform:translateY(6px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes scan{0%,100%{top:18%}50%{top:78%}}@keyframes spin{to{transform:rotate(360deg)}}
.pg-in>*{animation:pgin .25s ease-out both}
svg.ch rect.br{transform-box:fill-box;transform-origin:bottom;animation:grow .45s cubic-bezier(.2,.8,.2,1) both}
.stack .pr,.track i{transform-origin:left;animation:growx .5s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;padding:2px 8px 16px}.brand .lg{height:28px;background:#fff;border-radius:6px;padding:3px 8px;color:var(--side);font-weight:800;font-size:12px;display:flex;align-items:center}
.brand b{font-size:14px;display:block;line-height:1.15}.brand small{font-size:10px;opacity:.72}
.grp{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;padding:12px 10px 4px}
.nav{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;color:#fff;background:none;border:0;text-align:left;opacity:.88;width:100%}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav:hover{background:rgba(255,255,255,.1)}.nav.on{background:var(--acc);font-weight:700;opacity:1}
.nav .bd{margin-left:auto;background:#fff;color:var(--acc);border-radius:999px;font-size:10.5px;font-weight:800;padding:0 7px}
.who{margin-top:auto;font-size:12px;padding:10px;border-top:1px solid rgba(255,255,255,.18)}.who b{display:block}.who span{opacity:.75}
.who button,.who select{margin-top:8px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px}
.who select option{color:#1A2130}
main{min-width:0}
.preview{background:var(--acc-l);font-size:12px;padding:6px 20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.preview button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:12px}.preview button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sep{width:1px;height:16px;background:var(--line);margin:0 4px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--mut)}.crumb b{color:var(--ink)}
.lvz{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--mut);margin-left:auto}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-l)}.dot.off{background:var(--grey);box-shadow:none}
select,input.f,textarea.f{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.btn{font:700 13px var(--font);background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;white-space:nowrap}
.btn.s{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}.btn.g{background:var(--ok)}.btn.r{background:var(--red)}.btn.sm{padding:4px 10px;font-size:12px}.btn.ghost{background:none;color:var(--pri);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{padding:14px 20px 28px;display:flex;flex-direction:column;gap:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font:500 13px var(--font);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex-wrap:nowrap}
.seg button{border:0;background:none;padding:5px 12px;font-size:12.5px;color:var(--mut);white-space:nowrap}.seg button.on{background:var(--pri);color:#fff;font-weight:700}.seg button:disabled{opacity:.4;cursor:default}
.toolrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--pri-d)}
h1.pt{font-size:20px;font-weight:800;color:var(--pri-d)}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.hd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--mut);text-transform:uppercase}.kpi .v{font-size:22px;font-weight:800;line-height:1.1}.kpi .d{font-size:12px;color:var(--mut)}
button.kpi{width:100%}button.kpi.fl{border-width:1.5px}button.kpi.fl.r{border-color:var(--red)}button.kpi.fl.a{border-color:var(--amb)}
button.kpi.fl.on.r{background:var(--red-l)}button.kpi.fl.on.a{background:var(--amb-l)}.kpi .go{font-size:11px;font-weight:700;color:var(--acc)}
.tg{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;display:inline-block;white-space:nowrap}
.tg.ok{background:var(--ok-l);color:var(--ok)}.tg.amb{background:var(--amb-l);color:var(--amb)}.tg.red{background:var(--red-l);color:var(--red)}.tg.info{background:var(--pri-l);color:var(--pri-d)}.tg.grey{background:var(--track);color:var(--mut)}.tg.acc{background:var(--acc-l);color:var(--acc)}
.track{height:6px;background:var(--track);border-radius:3px;position:relative;margin-top:5px}.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px}.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lad{display:grid;grid-template-columns:118px minmax(0,1fr) 136px;gap:10px 12px;align-items:center;margin-top:12px;font-size:13px}
.lad button.rn{font-weight:700;text-align:left;background:none;border:0;padding:0;font-size:13px}.lad button.rn.on{color:var(--acc)}
.stack{position:relative;height:22px}.stack .bm{position:absolute;inset:0;border:1.5px dashed var(--grey);border-radius:4px}.stack .pr{position:absolute;left:0;top:5px;bottom:5px;border-radius:3px}
.nums{font-size:12px;color:var(--mut);text-align:right}.nums b{color:var(--ink)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:12px;flex-wrap:wrap}.leg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg.ch text{font-family:var(--font);fill:var(--mut);font-size:10.5px}svg.ch text.b{fill:var(--ink);font-weight:700}
/* thin action strip */
.astrip{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.astrip .t{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--pri-d);margin-right:4px}
.ach{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.ach b{font-size:13px}.ach.r b{color:var(--red)}.ach.a b{color:var(--amb)}.ach.i b{color:var(--pri)}.ach.on{border-color:var(--acc);background:var(--acc-l)}.ach.zero{opacity:.55}
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{background:var(--thead);color:var(--pri-d);font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;text-align:right;padding:7px 10px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr:hover td{background:var(--hover)}
td small{display:block;color:var(--mut);font-size:11.5px}
.lk{color:var(--pri);font-weight:700;background:none;border:0;font-size:13px;padding:0}
.heat{display:inline-block;min-width:50px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-size:12px}.h1{background:var(--ok-l);color:var(--ok)}.h2{background:var(--amb-l);color:var(--amb)}.h3{background:var(--red-l);color:var(--red)}
.hm{display:inline-flex;gap:3px}.hm i{width:30px;height:20px;border-radius:4px;font:700 10.5px/20px var(--font);text-align:center;font-style:normal;color:#fff}
.hm i.g{background:var(--ok)}.hm i.a{background:var(--amb)}.hm i.r{background:var(--red)}.hm i.n{background:var(--track)}
.bc{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);flex-wrap:wrap}.bc button{border:0;background:none;color:var(--pri);font-weight:700;font-size:12.5px;padding:0}
.chip{border:1px solid var(--acc);background:var(--acc-l);color:var(--acc);border-radius:999px;font-size:12px;font-weight:700;padding:2px 10px}
.note{font-size:12.5px;color:var(--pri-d);background:var(--pri-l);border-radius:8px;padding:8px 12px}.note.w{background:var(--amb-l);color:var(--amb)}.note.r{background:var(--red-l);color:var(--red)}.note.k{background:var(--ok-l);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A2130;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:200;max-width:92vw}
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;align-items:end}.frm label{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.frm select,.frm input,.frm textarea{width:100%}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.tgl b{display:block;font-size:13.5px}.tgl span{font-size:12px;color:var(--mut)}
.swi{width:42px;height:24px;border-radius:12px;background:var(--track);border:0;position:relative;flex:none}.swi:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.swi.on{background:var(--ok)}.swi.on:after{left:21px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px;flex-wrap:wrap}.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;color:var(--mut);border-bottom:2.5px solid transparent}.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:700}
.reqc{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--card)}
.post{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stat{display:flex;gap:8px;flex-wrap:wrap}.stat button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--mut)}.stat button b{font-size:17px;color:var(--ink)}.stat button.on{border-color:var(--acc);background:var(--acc-l)}.stat button.r b{color:var(--red)}.stat button.a b{color:var(--amb)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.md h3{font-size:16px;color:var(--pri-d)}
.ckl{display:flex;gap:10px;flex-wrap:wrap}.ckl label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500;color:var(--ink);flex-direction:row}
/* mail preview */
.mailv{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;color:#1A2130}
.mailv .mh{background:#F6F7F9;padding:10px 14px;font-size:12.5px;border-bottom:1px solid #E2E6EC;line-height:1.7}.mailv .mh b{display:inline-block;width:62px;color:#5A6472;font-weight:500}
.mailv .mb{padding:16px 18px;font-size:13.5px;line-height:1.6}
.mcode{display:inline-block;font:800 22px/1 monospace;letter-spacing:6px;background:#FFF1E8;color:#C2410C;border-radius:8px;padding:8px 14px;margin:6px 0}
.mkv{border-collapse:collapse;margin:8px 0;min-width:0;width:auto}.mkv td{border:1px solid #E2E6EC;padding:5px 10px;text-align:left;font-size:13px}.mkv td:first-child{background:#F6F7F9;color:#5A6472}
.rlist{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.rlist label{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}.rlist label:first-child{border-top:0}.rlist label.on{background:var(--acc-l)}.rlist small{color:var(--mut);margin-left:auto;font-size:11.5px}
/* statement A4 */
.a4{width:100%;max-width:210mm;margin:0 auto;background:#fff;color:#1A2130;padding:12mm;display:flex;flex-direction:column;gap:5mm;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.a4 .hd2{display:flex;justify-content:center;text-align:center;border-bottom:3px solid var(--pri);padding-bottom:4mm;font-size:16pt;font-weight:800}
.a4 .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm 6mm;font-size:10pt;color:#5A6472}.a4 .meta b{color:#1A2130}
.a4 .grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #E2E6EC}
.a4 .grid>div{border:.5px solid #E2E6EC;min-height:17mm;padding:1.5mm 2mm;font-size:9pt}
.a4 .grid .h{min-height:auto;background:var(--pri);color:#fff;font-weight:700;text-align:center;padding:1.5mm 0;font-size:8.5pt}
.a4 .grid .n{font-weight:700;color:#5A6472}.a4 .grid .blank{background:#FAFBFC}
.a4 .st{margin-top:2mm;display:inline-block;font-weight:800;font-size:11pt;padding:.5mm 3mm;border-radius:2mm}
.a4 .st.P{background:#E9F5EC;color:#1E8E3E}.a4 .st.A{background:#FDEDEC;color:#C0392B}.a4 .st.H{background:#FFF4E0;color:#B26A00}.a4 .st.CO{background:#EEF2F6;color:#334155;font-size:8pt}
.a4 .sum{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm}.a4 .sum div{border-radius:2mm;padding:3mm;text-align:center;font-size:9pt;background:#F3F6FA}.a4 .sum b{display:block;font-size:15pt;margin-top:1mm}
.a4 .sign{display:flex;gap:12mm;margin-top:4mm}.a4 .sign div{flex:1;text-align:center;font-size:9pt;color:#5A6472}

function pinHtml(id,n=4){return `<div class="pins" data-pins="${id}">${Array.from({length:n},(_,i)=>`<input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit ${i+1}" data-pi="${i}">`).join('')}</div>`}
function pinVal(id){return[...document.querySelectorAll(`[data-pins="${id}"] input`)].map(i=>i.value).join('')}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.pi==null)return;el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value){const nx=el.nextElementSibling;if(nx)nx.focus();else{const box=el.parentElement,next=document.querySelector(`[data-pins]:not([data-pins="${box.dataset.pins}"]) input`);const all=[...document.querySelectorAll('[data-pins] input')];const k=all.indexOf(el);if(all[k+1])all[k+1].focus();else{const b=document.querySelector('[data-pinsubmit]');if(b)b.focus()}}}});
document.addEventListener('keydown',e=>{const el=e.target;if(el.dataset.pi==null)return;
  if(e.key==='Backspace'&&!el.value){const pv=el.previousElementSibling;if(pv){e.preventDefault();pv.value='';pv.focus()}}
  else if(e.key==='ArrowLeft'&&el.previousElementSibling){el.previousElementSibling.focus()}else if(e.key==='ArrowRight'&&el.nextElementSibling){el.nextElementSibling.focus()}
  else if(e.key==='Enter'){const b=document.querySelector('[data-pinsubmit]');if(b)b.click()}});
document.addEventListener('paste',e=>{const el=e.target;if(el.dataset.pi==null)return;const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'');if(!d)return;e.preventDefault();const ins=[...el.parentElement.querySelectorAll('input')];d.split('').slice(0,ins.length).forEach((c,i)=>ins[i].value=c);(ins[Math.min(d.length,ins.length)-1]||el).focus()});
document.addEventListener('focusin',e=>{if(e.target.dataset.pi!=null)e.target.select&&e.target.select()});
