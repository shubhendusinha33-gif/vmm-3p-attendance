<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://phyllziizajuphenpwxz.supabase.co; media-src 'self' blob:; connect-src 'self' https://phyllziizajuphenpwxz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store Dashboard · 3rd Party Attendance</title>
<meta name="theme-color" content="#1565C0">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="hdr">
  <div class="t"><b id="hTitle">Store</b><small id="hSub"></small></div>
  <span id="langSlot"></span>
  <button class="x" id="btnLogout" data-t="logout"></button>
</header>

<main class="wrap">
  <div class="seg" id="mode">
    <button data-m="today" class="on" data-t="today"></button>
    <button data-m="pick" data-t="pickDate"></button>
    <button data-m="mtd" data-t="mtd"></button>
  </div>

  <!-- calendar (pick date / month) -->
  <section id="calBox" class="list" style="padding:12px" hidden>
    <div class="calhd"><button id="calPrev" aria-label="Previous month">‹</button><span id="calTitle"></span><button id="calNext" aria-label="Next month">›</button></div>
    <div class="cal" id="cal" style="margin-top:8px"></div>
  </section>

  <!-- day view -->
  <section id="day" style="display:flex;flex-direction:column;gap:12px">
    <div class="seg blue" id="shift">
      <button data-s="M" data-t="morning"></button><button data-s="E" data-t="evening"></button><button data-s="B" class="on" data-t="both"></button>
    </div>
    <div class="crumb" id="dayLabel"></div>
    <button class="banner" id="banner"></button>
    <div class="k2" id="kpis"></div>
    <div class="sec" data-t="present"></div>
    <div class="list" id="presentList"></div>
  </section>

  <!-- missing detail -->
  <section id="missing" hidden style="display:flex;flex-direction:column;gap:12px">
    <button class="link" id="missBack" style="align-self:flex-start" data-t="back"></button>
    <div class="sec" data-t="emptySlots"></div>
    <div class="list" id="slotList"></div>
    <div class="sec" data-t="regularsMissing"></div>
    <div class="list" id="regList"></div>
    <button class="btn wa" id="btnWa" data-t="shareWa"></button>
  </section>

  <!-- month to date -->
  <section id="mtd" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="crumb" id="mtdLabel"></div>
    <div class="k2" id="mtdKpis"></div>
    <div class="list" id="mtdList"></div>
    <div class="row"><button class="btn o sm" id="btnXls">⬇ Excel</button></div>
  </section>

  <section id="reqBox" hidden style="display:flex;flex-direction:column;gap:8px">
    <div class="sec" data-t="myRequests"></div>
    <div class="list" id="reqList"></div>
  </section>

  <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
    <button class="btn" id="btnMod" data-t="punchForStaff"></button>
    <button class="btn o" id="btnQr" data-t="qrPoster"></button>
    <button class="btn o" id="btnStmt" data-t="statement"></button>
    <button class="link" id="btnPin" data-t="changePin" style="align-self:center"></button>
  </div>
  <p class="foot" id="credit"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
<script>
let me = null, mode = 'today', shift = 'B', date = todayIST(), calMonth = todayIST().slice(0, 7), cats = {}, dayData = null, mtdData = null, lastTouch = Date.now();
const CATS = { HK: { name: 'Housekeeping', name_hi: 'हाउसकीपिंग' }, SEC: { name: 'Security', name_hi: 'सिक्योरिटी' }, TRAVEL: { name: 'Travel', name_hi: 'ट्रैवल' }, CDIT: { name: 'CDIT', name_hi: 'CDIT' } };
const cn = (id) => catName(cats[id] || CATS[id] || { name: id });

function setMode(m) {
  mode = m;
  $$('#mode button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  $('#calBox').hidden = m !== 'pick' && m !== 'mtd';
  $('#cal').hidden = m === 'mtd';
  $('#day').hidden = m === 'mtd'; $('#missing').hidden = true; $('#mtd').hidden = m !== 'mtd';
  if (m === 'today') { date = todayIST(); loadDay(); }
  if (m === 'pick') { paintCal(); loadDay(); }
  if (m === 'mtd') { paintCal(); loadMtd(); }
}

function paintCal() {
  const [y, mo] = calMonth.split('-').map(Number);
  const first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate(), today = todayIST();
  $('#calTitle').textContent = first.toLocaleDateString(lang() === 'hi' ? 'hi-IN' : 'en-GB', { month: 'long', year: 'numeric' });
  $('#calNext').disabled = calMonth >= today.slice(0, 7);
  const hd = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<div class="h">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const s = `${calMonth}-${String(d).padStart(2, '0')}`;
    const on = mode === 'pick' ? s === date : false;
    cells += `<button data-d="${s}" class="${on ? 'on' : ''}" ${s > today || mode === 'mtd' ? 'disabled' : ''}>${d}</button>`;
  }
  $('#cal').innerHTML = hd + cells;
}

async function loadDay() {
  $('#kpis').innerHTML = '<div class="spin"></div>'; $('#presentList').innerHTML = '';
  const r = await rpc('dash_store', { p_token: me.token, p_store: me.store_code, p_date: date, p_shift: shift });
  if (!r || !r.ok) { $('#kpis').innerHTML = `<div class="note r">${esc(errText(r && r.error))}</div>`; return; }
  dayData = r;
  $('#dayLabel').textContent = fmtDate(date) + (date === todayIST() ? ` · ${t('today')}` : '');
  const byCat = {};
  r.slots.forEach((s) => { const c = byCat[s.c] || (byCat[s.c] = { req: 0, p: 0 }); c.req += s.req; c.p += s.p; });
  const missingN = r.slots.reduce((a, s) => a + Math.max(s.req - s.p, 0), 0);
  $('#banner').className = 'banner' + (missingN ? '' : ' ok');
  $('#banner').innerHTML = missingN ? `<span>⚠ ${esc(t('notPunched', { n: missingN }))}</span><span>›</span>` : `<span>✓ ${esc(t('allPunched'))}</span>`;
  $('#banner').disabled = !missingN && !r.regulars_missing.length;
  $('#kpis').innerHTML = Object.entries(byCat).map(([c, v]) => { const p = pct(v.p, v.req); return `<div class="kpi"><div class="l">${esc(cn(c))}</div>
      <span class="v">${v.p}/${v.req}</span><span class="p" style="color:${pctColor(p)}">${p}%</span>
      <div class="bar"><i style="width:${Math.min(p, 100)}%;background:${pctColor(p)}"></i></div></div>`; }).join('') || `<div class="empty">—</div>`;
  $('#presentList').innerHTML = r.present.map((a) => `<div class="li"><div class="m">${esc(a.name)} · ${esc(cn(a.c))}${a.brand ? ' ' + esc(a.brand) : ''}
      <span>${esc(a.code)} · IN ${a.first_in || '—'}${a.last_out ? ' · OUT ' + a.last_out : ''}${a.hours ? ' · ' + a.hours + ' h' : ''}${a.via_mod ? ' · ' + esc(t('modMode')) : ''}${a.photo === 'done' ? ' · 📷' : a.photo === 'pending' ? ' · 📷?' : ''}</span></div>
      <span style="display:flex;gap:6px;align-items:center"><span class="tag ${a.last_out ? 'i' : 'ok'}">${a.last_out ? 'OUT' : esc(t('present'))}</span>
      ${editTypes.includes('staff') ? `<button class="btn o sm" data-ed="${a.id}" data-n="${esc(a.name)}" data-v="${esc(a.vendor || '')}" data-b="${esc(a.brand || '')}" title="${esc(t('staffReq'))}">✎</button>` : ''}</span></div>`).join('') || `<div class="empty">—</div>`;
}

function showMissing() {
  const r = dayData; if (!r) return;
  $('#day').hidden = true; $('#calBox').hidden = true; $('#missing').hidden = false;
  const slots = r.slots.filter((s) => s.req > s.p);
  $('#slotList').innerHTML = slots.map((s) => `<div class="li"><div class="m">${esc(cn(s.c))}${s.brand ? ' · ' + esc(s.brand) : ''} × ${s.req - s.p}<span>${esc(s.vendor || '')}</span></div><span class="tag r">${esc(t('missing'))}</span></div>`).join('') || `<div class="empty">✓</div>`;
  $('#regList').innerHTML = r.regulars_missing.map((a) => `<div class="li"><div class="m">${esc(a.name)} · ${esc(cn(a.c))}${a.brand ? ' ' + esc(a.brand) : ''}<span>${esc(t('cameDays', { n: a.days }))}</span></div>
      ${editTypes.includes('compoff') ? `<button class="btn o sm" data-co="${a.id}" data-n="${esc(a.name)}">${esc(t('compoffReq'))}</button>` : ''}</div>`).join('') || `<div class="empty">—</div>`;
}

function waText() {
  const r = dayData; const lines = [`${me.store_code} ${r.store_name} · ${fmtDate(date)} · ${t('notPunched', { n: r.slots.reduce((a, s) => a + Math.max(s.req - s.p, 0), 0) })}`];
  r.slots.filter((s) => s.req > s.p).forEach((s) => lines.push(`• ${cn(s.c)}${s.brand ? ' ' + s.brand : ''} × ${s.req - s.p}${s.vendor ? ' (' + s.vendor + ')' : ''}`));
  if (r.regulars_missing.length) { lines.push(t('regularsMissing') + ':'); r.regulars_missing.forEach((a) => lines.push(`• ${a.name} (${cn(a.c)})`)); }
  return lines.join('\n');
}

async function loadMtd() {
  const from = calMonth + '-01';
  const [y, mo] = calMonth.split('-').map(Number); const to = ymd(new Date(y, mo, 0));
  $('#mtdKpis').innerHTML = '<div class="spin"></div>'; $('#mtdList').innerHTML = '';
  const r = await rpc('store_range', { p_token: me.token, p_store: me.store_code, p_from: from, p_to: to });
  if (!r || !r.ok) { $('#mtdKpis').innerHTML = `<div class="note r">${esc(errText(r && r.error))}</div>`; return; }
  mtdData = r;
  $('#mtdLabel').textContent = `${fmtDay(r.from)} – ${fmtDate(r.to)}`;
  $('#mtdKpis').innerHTML = r.by_category.map((c) => { const p = pct(c.p, c.req); return `<div class="kpi"><div class="l">${esc(cn(c.c))}</div>
     <span class="v">${c.p}/${c.req}</span><span class="p" style="color:${pctColor(p)}">${p}%</span></div>`; }).join('') || `<div class="empty">—</div>`;
  $('#mtdList').innerHTML = r.associates.map((a) => { const days = a.present + a.absent; const p = pct(a.present, days);
    return `<div class="li click" data-a="${a.id}"><div class="m">${esc(a.name)} · ${esc(cn(a.c))}${a.brand ? ' ' + esc(a.brand) : ''}
      <span>P ${a.present} · A ${a.absent} · CO ${a.compoff} · ${a.hours} h</span></div><span class="tag ${pctTag(p)}">${p}%</span></div>`; }).join('') || `<div class="empty">—</div>`;
}

let editTypes = ['compoff', 'staff'];
function requestDialog(kind, assoc, inner, payload) {
  const m = modal(`<h3>✎ ${esc(t(kind === 'compoff' ? 'compoffReq' : 'staffReq'))}</h3>${inner}
    <label class="lbl">${esc(t('reasonReq'))}<textarea class="in" name="why" rows="2" maxlength="300"></textarea></label><p class="mini" style="margin:0">${esc(t('nothingChanges'))}</p>`, async (f, close) => {
    if (f.why.value.trim().length < 5) return t('reasonRequired');
    const extra = payload(f);
    const r = await rpc('cr_create', { p_token: me.token, p_kind: kind, p_associate: assoc, p_date: extra.p_date, p_payload: extra.p_payload, p_reason: f.why.value.trim() });
    if (r && r.ok) { close(); toast(t('requestSent')); loadRequests(); return null; }
    return errText(r && r.error);
  });
  m.okLabel(t('sendToAm'));
}
async function loadRequests() {
  const r = await rpc('cr_list', { p_token: me.token, p_status: 'all', p_days: 30 });
  if (!r || !r.ok) return;
  editTypes = r.edit_types || editTypes;
  $('#reqBox').hidden = !r.rows.length;
  const tag = { pending: ['w', 'stPending'], approved: ['ok', 'stApproved'], rejected: ['r', 'stRejected'] };
  $('#reqList').innerHTML = r.rows.slice(0, 15).map((x) => `<div class="li"><div class="m">${esc(x.kind === 'compoff' ? t('compOff') : t('staffReq'))} · ${esc(x.assoc || '')}${x.date ? ' · ' + fmtDay(x.date) : ''}
    <span>${esc(x.reason)}${x.note ? ' · AM: “' + esc(x.note) + '”' : ''}</span></div><span class="tag ${tag[x.status][0]}">${esc(t(tag[x.status][1]))}</span></div>`).join('');
}

(async function init() {
  me = await requireSession(['store']); if (!me) return;
  $('#langSlot').appendChild(langToggle(() => { if (mode === 'mtd') loadMtd(); else loadDay(); paintCal(); }));
  $('#credit').innerHTML = credit(); applyI18n();
  $('#hTitle').textContent = `${me.store_code} · ${me.store_name || ''}`;
  $('#hSub').textContent = `${me.post || ''} ${me.name}`;
  const ctx = await rpc('punch_context', { p_store: me.store_code });
  if (ctx && ctx.categories) ctx.categories.forEach((c) => cats[c.id] = c);
  shift = istNow().getHours() < 14 ? 'M' : 'B';
  $$('#shift button').forEach((b) => b.classList.toggle('on', b.dataset.s === shift));
  setMode('today');

  $('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
  $('#shift').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; shift = b.dataset.s; $$('#shift button').forEach((x) => x.classList.toggle('on', x === b)); loadDay(); });
  $('#cal').addEventListener('click', (e) => { const b = e.target.closest('button[data-d]'); if (!b || b.disabled) return; date = b.dataset.d; paintCal(); loadDay(); });
  $('#calPrev').addEventListener('click', () => { const [y, m] = calMonth.split('-').map(Number); calMonth = ymd(new Date(y, m - 2, 1)).slice(0, 7); paintCal(); if (mode === 'mtd') loadMtd(); });
  $('#calNext').addEventListener('click', () => { const [y, m] = calMonth.split('-').map(Number); calMonth = ymd(new Date(y, m, 1)).slice(0, 7); paintCal(); if (mode === 'mtd') loadMtd(); });
  $('#banner').addEventListener('click', showMissing);
  $('#missBack').addEventListener('click', () => { $('#missing').hidden = true; $('#day').hidden = false; $('#calBox').hidden = mode !== 'pick'; });
  $('#btnWa').addEventListener('click', () => waShare(waText()));
  $('#regList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-co]'); if (!b) return;
    requestDialog('compoff', Number(b.dataset.co), `<div class="note i" style="font-size:13px">${esc(b.dataset.n)} · ${fmtDate(date)} · Absent → ${esc(t('compOff'))}</div>`, () => ({ p_date: date, p_payload: { on: true } }));
  });
  $('#presentList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ed]'); if (!b) return;
    requestDialog('staff', Number(b.dataset.ed), `<label class="lbl">${esc(t('yourName'))}<input class="in" name="nm" value="${esc(b.dataset.n)}" maxlength="40"></label>
      <label class="lbl">${esc(t('vendor'))}<input class="in" name="vd" value="${esc(b.dataset.v)}" maxlength="60"></label>${b.dataset.b ? `<label class="lbl">${esc(t('brand'))}<input class="in" name="br" value="${esc(b.dataset.b)}" maxlength="30"></label>` : ''}`,
      (f) => ({ p_date: null, p_payload: { name: f.nm.value.trim(), vendor: f.vd.value.trim(), brand: f.br ? f.br.value.trim() : b.dataset.b } }));
  });
  loadRequests();
  $('#mtdList').addEventListener('click', (e) => { const li = e.target.closest('[data-a]'); if (li) location.href = `statement.html?a=${li.dataset.a}&from=${mtdData.from}&to=${mtdData.to}`; });
  $('#btnXls').addEventListener('click', () => { if (!mtdData) return;
    downloadXlsx(mtdData.associates.map((a) => ({ Store: me.store_code, Code: a.code, Name: a.name, Category: cn(a.c), Brand: a.brand, Vendor: a.vendor, Present: a.present, Absent: a.absent, 'Comp-off': a.compoff, Hours: a.hours })),
      `${me.store_code}_${mtdData.from}_${mtdData.to}.xlsx`); });
  $('#btnMod').addEventListener('click', () => location.href = 'punch.html?mod=1');
  $('#btnQr').addEventListener('click', () => location.href = 'qr.html');
  $('#btnStmt').addEventListener('click', () => { setMode('mtd'); toast(t('statement') + ': ' + t('associate') + ' ›'); });
  $('#btnLogout').addEventListener('click', logout);
  $('#btnPin').addEventListener('click', () => changePinDialog(me));

  // refresh every 2 min only while someone is using the page (so the store lock can still auto-release)
  ['click', 'touchstart', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, () => lastTouch = Date.now(), { passive: true }));
  setInterval(() => { if (!document.hidden && Date.now() - lastTouch < 25 * 60000 && mode !== 'mtd' && $('#missing').hidden) loadDay(); }, 120000);
})();
</script>
</body>
</html>
