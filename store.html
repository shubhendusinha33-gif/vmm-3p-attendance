<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://phyllziizajuphenpwxz.supabase.co; media-src 'self' blob:; connect-src 'self' https://phyllziizajuphenpwxz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store · 3rd Party Attendance</title>
<meta name="theme-color" content="#1E293B">
<link rel="preconnect" href="https://phyllziizajuphenpwxz.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/logo.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1E293B"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/app.css">
<style>
  .card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .post small{color:var(--mut)}
  .post.miss{border-style:dashed;color:var(--red)}
  .post .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .brs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .kpi.click{cursor:pointer;font:inherit;color:inherit}
  .kpi.click:hover{border-color:var(--acc)}
  .reqc .m{min-width:0;flex:1}
  .reqc .m .sub b{color:var(--ink)}
  .reqc .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .sumln{font-size:13px;font-weight:700}
  .sumln.bad{color:var(--red)}.sumln.good{color:var(--ok)}
  .hist td,.hist th{font-size:12.5px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);text-align:right;padding:6px 10px;background:var(--thead)}
  th.l,td.l{text-align:left}
  .wrap.mob .btn.big,.wrap.mob a.btn.big:visited{display:block;width:100%;padding:12px 16px;font-size:15px;border-radius:10px;text-decoration:none;color:#fff}
  .hist td{white-space:normal}
  .pills .pill{cursor:pointer}
  /* v5.5 rating gate */
  .rg{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
  .rg .rgh{background:var(--side,#1E293B);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rg .rgh small{display:block;opacity:.75;font-size:11px}
  .rg .rgb{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;padding-bottom:90px}
  .rg .rgc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .rg .rgc.bad{border:2px solid var(--red)}
  .rg .rgc.done{opacity:.6}
  .rg .stz{display:flex;gap:4px;margin-top:4px}
  .rg .stz button{background:none;border:0;font-size:34px;line-height:1;color:#D5DAE1;padding:0 2px;cursor:pointer}
  .rg .stz button.on{color:#F59E0B}
  .rg .stz button:disabled{cursor:default}
  .rg .tagz{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .rg .tagz button{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--card);color:var(--ink)}
  .rg .tagz button.on{background:var(--red);border-color:var(--red);color:#fff}
  .rg textarea{width:100%;margin-top:6px;border:1px solid var(--red);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);min-height:44px}
  .rg .need{color:var(--red);font-weight:700;font-size:12.5px;margin-top:4px}
  .rg .rgf{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px;background:var(--bg);border-top:1px solid var(--line)}
  .rg .rgf .btn{width:100%;padding:12px;font-size:15px}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/app.js"></script>
<script src="assets/store-app.js"></script>
<script>
let me = null, sh = null, tab = 'td', date = todayIST(), shift = 'B', cats = {}, day = null, hk = null, crs = [], editTypes = ['compoff', 'staff'];
let assoc = null, rqFilter = 'all', tdView = 'day', mtdMonth = todayIST().slice(0, 7), mtd = null, mtdPct = null, pnCat = null, lastRef = '', lastTouch = Date.now();
const CATS = { HK: { name: 'Housekeeping', name_hi: 'हाउसकीपिंग' }, SEC: { name: 'Security', name_hi: 'सिक्योरिटी' }, TRAVEL: { name: 'Travel', name_hi: 'ट्रैवल' }, CDIT: { name: 'CDIT', name_hi: 'CDIT' } };
const cn = (id) => catName(cats[id] || CATS[id] || { name: id });
const W = () => sh.wrap;
const hhmm = () => { const d = istNow(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const ERR = { BAD_DATE: () => t('badDate'), NOT_SECURITY: () => t('notSecurity'), BAD_VALUE: () => t('hkSum', { s: '?', t: '?' }), NO_HK_TOTAL: () => t('hkNoTotal') };
const err = (e) => (ERR[e] ? ERR[e]() : errText(e));

/* ---------------- shell + routing ---------------- */
function buildShell() {
  sh = storeShell('#root', me, tab, { onNav: (id) => { tdView = 'day'; go(id); }, onLang: () => { buildShell(); render(); }, checkHk: false });
  if (hk) sh.setDot('hks', hk.has_hk && !hk.set);
  paintBadge();
}
function go(id) {
  if (!['td', 'pn', 'hks', 'rq'].includes(id)) id = 'td';
  tab = id; sh.setActive(id); sh.setTitle(t(STORE_TABS.find((x) => x[0] === id)[1]));
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  render();
}
function render() {
  if (tab === 'td') return tdView === 'mtd' ? renderMtd() : renderToday();
  if (tab === 'pn') return renderPunch();
  if (tab === 'hks') return renderHk();
  if (tab === 'rq') return renderReq();
}

/* ---------------- Today ---------------- */
let pushSt = '';
function paintPush() {
  const el = document.getElementById('pushCard'); if (!el) return;
  const hi = lang() === 'hi';
  if (!pushSt || pushSt === 'on' || pushSt === 'unsupported' || Session.isView()) { el.innerHTML = ''; return; }
  if (pushSt === 'ios') { el.innerHTML = `<div class="note i" style="margin-top:8px">🔔 ${hi ? 'हर पंच का फ़ोन अलर्ट पाने के लिए: Safari में Share → “Add to Home Screen”, फिर उसी आइकन से खोलें।' : 'For a phone alert on every punch: in Safari tap Share → “Add to Home Screen”, then open the app from that icon.'}</div>`; return; }
  if (pushSt === 'denied') { el.innerHTML = `<div class="note w" style="margin-top:8px">🔕 ${hi ? 'नोटिफ़िकेशन ब्लॉक हैं। ब्राउज़र सेटिंग में इस साइट के Notifications चालू करें।' : 'Notifications are blocked. Turn on Notifications for this site in the browser settings.'}</div>`; return; }
  el.innerHTML = `<div class="card" style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font-size:22px">🔔</span>
    <div style="flex:1;min-width:180px"><b>${hi ? 'हर पंच पर फ़ोन अलर्ट (आवाज़ के साथ)' : 'Phone alert with sound for every punch'}</b><div class="sub">${hi ? 'ऐप बंद हो या फ़ोन लॉक हो तब भी। Logout करने पर बंद।' : 'Even when the app is closed or the phone is locked. Stops when you log out.'}</div></div>
    <button class="btn sm" data-a="pushon">${hi ? 'चालू करें' : 'Allow alerts'}</button></div>`;
}
async function pushOn(btn) {
  btn.disabled = true; const r = await Push.enable(me); btn.disabled = false;
  if (r && r.ok) { pushSt = 'on'; toast(lang() === 'hi' ? 'फ़ोन अलर्ट चालू' : 'Phone alerts are on'); }
  else { pushSt = await Push.state(); if (r && r.error) toast(r.error === 'DENIED' ? (lang() === 'hi' ? 'अनुमति नहीं मिली' : 'Permission not given') : errText(r.error)); }
  paintPush();
}
function renderToday() { _renderToday(); paintPush(); }
function _renderToday() {
  const isToday = date === todayIST();
  W().innerHTML = `<div class="mrow"><input class="f" type="date" id="tdDate" value="${date}" max="${todayIST()}" aria-label="${esc(t('date'))}">
      <span class="lvz" style="margin:0"><span class="dot ${isToday ? '' : 'off'}"></span><span id="tdLive">${isToday ? esc(t('live')) + (lastRef ? ' · ' + lastRef : '') : esc(t('endOfDay'))}</span></span>
      <button class="btn s sm" data-a="ref" title="${esc(t('refresh'))}" aria-label="${esc(t('refresh'))}">↻</button></div><div id="pushCard"></div>
    <div class="toolrow"><h1 class="pt">${esc(me.store_code)} · ${esc(me.store_name || '')}</h1>
      <div class="seg" id="tdShift">${[['M', 'morning'], ['E', 'evening'], ['B', 'both']].map(([v, k]) => `<button data-s="${v}" class="${shift === v ? 'on' : ''}">${esc(t(k))}</button>`).join('')}</div></div>
    <div id="tdBody" style="display:flex;flex-direction:column;gap:10px"><div class="spin"></div></div>`;
  loadDay();
}
async function loadDay() {
  const d0 = date, s0 = shift;
  const r = await rpc('dash_store', { p_token: me.token, p_store: me.store_code, p_date: date, p_shift: shift });
  if (tab !== 'td' || tdView !== 'day' || d0 !== date || s0 !== shift || !$('#tdBody')) return;
  if (!r || !r.ok) { $('#tdBody').innerHTML = `<div class="note r">${esc(err(r && r.error))}</div>`; return; }
  day = r; lastRef = hhmm();
  if (date === todayIST() && $('#tdLive')) $('#tdLive').textContent = `${t('live')} · ${lastRef}`;
  if (r.hk) { hk = Object.assign(hk || {}, { has_hk: true, set: r.hk.set, total: r.hk.total }); sh.setDot('hks', !r.hk.set); }
  paintDay();
  if (mtdPct === null) loadMtdPct();
}
function paintDay() {
  const r = day; if (!r || !$('#tdBody')) return;
  const by = {};
  r.slots.forEach((s) => {
    const c = by[s.c] || (by[s.c] = { req: 0, p: 0, co: 0, vendors: new Set(), brands: [] });
    c.req += s.req; c.p += s.p; c.co += s.co || 0; if (s.vendor) c.vendors.add(s.vendor); if (s.brand) c.brands.push(s);
  });
  r.present.forEach((a) => { if (!by[a.c]) by[a.c] = { req: 0, p: 0, co: 0, vendors: new Set(a.vendor ? [a.vendor] : []), brands: [] }; });
  const req = r.slots.reduce((a, s) => a + s.req, 0), pIn = r.slots.reduce((a, s) => a + Math.min(s.p, s.req), 0), pAll = r.slots.reduce((a, s) => a + s.p, 0);
  const tp = pct(pIn, req), sgSet = r.sg_set || 8, past = date < todayIST();
  const tg = (n, q) => (n >= q ? 'ok' : n ? 'amb' : 'red');
  const order = Object.keys(by).sort((a, b) => (a === 'SEC') - (b === 'SEC') || a.localeCompare(b));
  $('#tdBody').innerHTML = `
    ${r.hk && !r.hk.set ? `<div class="note w">${esc(t('hkNotSet', { n: r.hk.total }))} <button class="btn sm" data-a="go" data-to="hks">${esc(t('hkEnter'))}</button></div>` : ''}
    <div class="kpis k4">
      <div class="kpi"><span class="l">${esc(t('required'))}</span><span class="v">${req}</span><span class="d">${esc(t(shift === 'M' ? 'morning' : shift === 'E' ? 'evening' : 'both'))}</span></div>
      <div class="kpi"><span class="l">${esc(t('present'))}</span><span class="v">${pIn} <span class="tg ${pctTag(tp) === 'w' ? 'amb' : pctTag(tp) === 'r' ? 'red' : 'ok'}" style="vertical-align:4px">${tp}%</span></span>${pAll > pIn ? `<span class="d">${esc(t('extra', { n: pAll - pIn }))}</span>` : ''}</div>
      <div class="kpi"><span class="l">${esc(t('notPunchedK'))}</span><span class="v" style="color:${req - pIn ? 'var(--red)' : 'var(--ok)'}">${req - pIn}</span></div>
      <button type="button" class="kpi click" data-a="mtd"><span class="l">${esc(t('monthToDate'))}</span><span class="v" id="mtdPct">${mtdPct === null ? '…' : mtdPct + '%'}</span><span class="d">${fmtDay(monthStart(todayIST()))} – ${fmtDay(todayIST())} ›</span></button>
    </div>
    <div class="cols2">${order.map((c) => {
      const v = by[c], sec = c === 'SEC', ppl = r.present.filter((a) => a.c === c), miss = Math.max(v.req - v.p, 0);
      const vend = [...v.vendors].join(', ');
      return `<div class="card"><div class="hd"><div><h2>${esc(cn(c))}</h2><div class="sub">${vend ? esc(t('vendor')) + ' ' + esc(vend) : ''}${sec ? ` · ${esc(t('hrSet', { n: sgSet }))} · ${esc(t('statusOnly'))}` : ''}${v.co ? ` · ${esc(t('compoffShort'))} ${v.co}` : ''}</div></div><span class="tg ${tg(v.p, v.req)}">${v.p} / ${v.req}</span></div>
        ${v.brands.length ? `<div class="brs">${v.brands.map((s) => `<span class="tg ${tg(s.p, s.req)}">${esc(s.brand)} ${s.p}/${s.req}</span>`).join('')}</div>` : ''}
        <div class="dlist">${sec
          ? ppl.map((g) => `<div class="post"><b>${esc(g.name)}</b><span class="acts">${SG_TAG(g.st)}${past && g.st === 'MP' ? `<button class="btn s sm" data-a="sgreq" data-id="${g.id}">${esc(t('misPunchReq'))}</button>` : ''}</span></div>`).join('')
          : ppl.map((a) => `<div class="post"><span><b>${esc(a.name)}</b>${a.brand ? ` <small>${esc(a.brand)}</small>` : ''}<br><small>IN ${esc(a.first_in || '—')}${a.last_out ? ' · OUT ' + esc(a.last_out) : a.out_done ? ' · OUT ✓' : ' · ' + esc(t('stillIn'))}${a.hours ? ' · ' + a.hours + ' h' : ''}</small>${(a.src || []).length ? `<br>${a.src.map((p) => `<small style="color:var(--mut)">${esc(p.k)}</small> ${punchSrc(p, true)}`).join(' ')}` : a.via_mod ? ' · ' + esc(t('punchedByStore')) : ''}</span>
              <span class="acts">${a.photo === 'done' ? `${a.live === 'pass' ? `<span class="tg ok">${esc(t('liveOk'))}</span> ` : ''}<button class="btn ghost sm" style="padding:2px 6px" title="View selfie" data-selfie="${esc(a.id)}|${esc(date)}">📷</button>` : a.photo === 'pending' ? '<span class="tg amb">📷?</span>' : ''}
              ${editTypes.includes('staff') ? `<button class="btn s sm" data-a="staff" data-id="${a.id}" title="${esc(t('staffReq'))}" aria-label="${esc(t('staffReq'))}">✎</button>` : ''}</span></div>`).join('')}
          ${miss ? `<div class="post miss"><b>${esc(t(sec ? 'notOnDuty' : 'notPunchedN', { n: miss }))}</b>${!sec && !past ? `<button class="btn sm" data-a="go" data-to="pn">${esc(t('punchForStaffT'))}</button>` : ''}</div>` : ''}
          ${!ppl.length && !miss ? '<div class="sub">—</div>' : ''}</div></div>`;
    }).join('') || `<div class="card"><div class="empty">—</div></div>`}</div>
    ${r.regulars_missing.length ? `<div class="card"><h2>${esc(t('regularsMissing'))}</h2><div class="dlist">${r.regulars_missing.map((a) => `<div class="post"><span><b>${esc(a.name)}</b> <small>· ${esc(cn(a.c))}${a.brand ? ' ' + esc(a.brand) : ''}</small><br><small>${esc(t('cameDays', { n: a.days }))}</small></span>
        ${editTypes.includes('compoff') ? `<button class="btn s sm" data-a="compoff" data-id="${a.id}">${esc(t('compoffReq'))}</button>` : ''}</div>`).join('')}</div></div>` : ''}`;
}
async function loadMtdPct() {
  const r = await rpc('store_range', { p_token: me.token, p_store: me.store_code, p_from: monthStart(todayIST()), p_to: todayIST() });
  if (!r || !r.ok) return;
  const q = r.by_category.reduce((a, c) => a + c.req, 0), p = r.by_category.reduce((a, c) => a + c.p, 0);
  mtdPct = pct(p, q); if ($('#mtdPct')) $('#mtdPct').textContent = mtdPct + '%';
}

/* month to date (kept from v4: per associate P / A / CO, opens the statement) */
function renderMtd() {
  W().innerHTML = `<div class="mrow"><button class="btn s sm" data-a="mtdback">${esc(t('back2'))}</button><input class="f" type="month" id="mtdMonth" value="${mtdMonth}" max="${todayIST().slice(0, 7)}" aria-label="${esc(t('month'))}"><button class="btn sm" data-a="mtdxls" style="margin-left:auto">${esc(t('excel'))}</button></div>
    <h1 class="pt">${esc(t('monthToDate'))}</h1><div class="crumb" id="mtdLabel"></div>
    <div class="kpis k4" id="mtdKpis"><div class="spin"></div></div><div class="list" id="mtdList"></div>`;
  loadMtd();
}
async function loadMtd() {
  const [y, m] = mtdMonth.split('-').map(Number);
  const r = await rpc('store_range', { p_token: me.token, p_store: me.store_code, p_from: `${mtdMonth}-01`, p_to: ymd(new Date(y, m, 0)) });
  if (!$('#mtdKpis')) return;
  if (!r || !r.ok) { $('#mtdKpis').innerHTML = `<div class="note r">${esc(err(r && r.error))}</div>`; return; }
  mtd = r;
  $('#mtdLabel').textContent = `${fmtDay(r.from)} – ${fmtDate(r.to)}`;
  $('#mtdKpis').innerHTML = r.by_category.map((c) => { const p = pct(c.p, c.req); return `<div class="kpi"><span class="l">${esc(cn(c.c))}</span><span class="v">${c.p}/${c.req}</span><span class="d" style="color:${pctColor(p)};font-weight:700">${p}%</span></div>`; }).join('') || '<div class="empty">—</div>';
  $('#mtdList').innerHTML = r.associates.map((a) => { const days = a.present + a.absent, p = pct(a.present, days);
    return `<div class="li click" data-a="stm" data-id="${a.id}"><div class="m">${esc(a.name)} · ${esc(cn(a.c))}${a.brand ? ' ' + esc(a.brand) : ''}
      <span>P ${a.present} · A ${a.absent} · CO ${a.compoff}${a.c !== 'SEC' && a.hours != null ? ' · ' + a.hours + ' h' : ''}</span></div><span class="tag ${pctTag(p)}">${p}% ›</span></div>`; }).join('') || '<div class="empty">—</div>';
}

/* ---------------- Punch for staff ---------------- */
function renderPunch() {
  const list = Object.values(cats);
  if (!pnCat && list.length) pnCat = list[0].id;
  W().innerHTML = `<h1 class="pt">${esc(t('punchForStaffT'))}</h1>
    <div class="card"><div class="sub" style="margin-bottom:10px">${esc(t('punchHelp'))}</div><a class="btn big" href="punch.html?mod=1">${esc(t('openPunch'))}</a></div>
    <div class="card"><h2>${esc(t('whoIn'))}</h2><div class="pills" style="margin-top:8px" id="pnCats">${list.map((c) => `<button class="pill ${pnCat === c.id ? 'on' : ''}" data-a="pncat" data-c="${esc(c.id)}">${esc(catName(c))}</button>`).join('')}</div><div class="dlist" id="pnRoster"><div class="spin"></div></div></div>
    <div class="card"><h2>${esc(t('byStoreToday'))}</h2><div class="dlist" id="pnMod"><div class="spin"></div></div></div>`;
  loadRoster(); loadModToday();
}
async function loadRoster() {
  if (!pnCat) { $('#pnRoster').innerHTML = `<div class="sub">${esc(t('noneYet'))}</div>`; return; }
  const c0 = pnCat, r = await rpc('store_roster', { p_token: me.token, p_cat: pnCat });
  if (!$('#pnRoster') || c0 !== pnCat) return;
  if (!r || !r.ok) { $('#pnRoster').innerHTML = `<div class="note r">${esc(err(r && r.error))}</div>`; return; }
  const sec = pnCat === 'SEC';
  const rows = r.rows.slice().sort((a, b) => (b.last_kind === 'IN') - (a.last_kind === 'IN') || a.name.localeCompare(b.name));
  $('#pnRoster').innerHTML = rows.map((a) => `<div class="post"><span><b>${esc(a.name)}</b> <small>${esc(a.code)}${a.brand ? ' · ' + esc(a.brand) : ''}</small><br><small>${a.last_kind ? (sec ? esc(t('lastPunch')) + ' ' + esc(a.last_kind) : esc(t('lastPunch')) + ' ' + esc(a.last_kind) + ' ' + esc(a.last_time || '')) : esc(t('notToday'))}</small></span>
    ${a.last_kind === 'IN' ? '<span class="tg ok">IN</span>' : a.last_kind === 'OUT' ? '<span class="tg grey">OUT</span>' : '<span class="tg grey">—</span>'}</div>`).join('') || `<div class="sub">${esc(t('noneYet'))}</div>`;
}
async function loadModToday() {
  const r = await rpc('dash_store', { p_token: me.token, p_store: me.store_code, p_date: todayIST(), p_shift: 'B' });
  if (!$('#pnMod')) return;
  if (!r || !r.ok) { $('#pnMod').innerHTML = `<div class="note r">${esc(err(r && r.error))}</div>`; return; }
  const L = r.present.filter((a) => a.via_mod);
  $('#pnMod').innerHTML = L.map((a) => `<div class="post"><span><b>${esc(a.name)}</b> <small>· ${esc(cn(a.c))}</small>${a.c !== 'SEC' ? `<br><small>IN ${esc(a.first_in || '—')}${a.last_out ? ' · OUT ' + esc(a.last_out) : a.out_done ? ' · OUT ✓' : ''}</small>` : ''}</span>${a.c === 'SEC' ? SG_TAG(a.st) : `<span class="tg info">${esc(t('modMode'))}</span>`}</div>`).join('') || `<div class="sub">${esc(t('noneYet'))}</div>`;
}

/* ---------------- HK split ---------------- */
async function loadHk() {
  const r = await rpc('hk_split_get', { p_token: me.token });

async function sendRequest(kind, id, d, payload, reason, errEl, btn) {

  if (!id) { show(t('selectAssociate')); return false; }
  if ((reason || '').trim().length < 5) { show(t('reasonRequired')); return false; }
  if (btn) btn.disabled = true;
  const r = await rpc('cr_create', { p_token: me.token, p_kind: kind, p_associate: Number(id), p_date: d || null, p_payload: payload || {}, p_reason: reason.trim() });
  if (btn) btn.disabled = false;
  if (!r || !r.ok) { show(err(r && r.error)); return false; }
  toast(r.no_rlpo ? t('noRlpo') : r.route === 'rlpo' ? t('sentRlpo') : t('requestSent'));
  await loadCr();
  return true;
}
async function rqSend() {
  const kind = $('#rqT').value, id = $('#rqW').value, d = $('#rqD') ? $('#rqD').value : null;

  if (kind === 'compoff') payload = { on: true };
  if (kind === 'staff') payload = { name: $('#rqNm').value.trim(), vendor: $('#rqVd').value.trim(), brand: $('#rqBr') ? $('#rqBr').value.trim() : undefined };
  if (kind.startsWith('sg_')) payload = { in: $('#rqIn').value || null, out: $('#rqOut').value || null, missing: $('#rqMs') ? $('#rqMs').value : null };
  if (kind !== 'staff' && !d) { $('#rqErr').hidden = false; $('#rqErr').textContent = t('badDate'); return; }
  $('#rqErr').hidden = true;
  if (await sendRequest(kind, id, d, payload, $('#rqR').value, $('#rqErr'), $('#rqSend'))) { paintReqForm(kind); $('#rqR') && ($('#rqR').value = ''); rqFilter = 'all'; paintReqList(); }
}

/* ---------------- events ---------------- */
function wire() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]'); if (!b || !W().contains(b)) return;
    const a = b.dataset.a, find = (id) => day && (day.present.find((x) => String(x.id) === id) || day.regulars_missing.find((x) => String(x.id) === id));
    if (a === 'ref') { if (tdView === 'day') { $('#tdBody').innerHTML = '<div class="spin"></div>'; loadDay(); } }
    else if (a === 'go') go(b.dataset.to);
    else if (a === 'mtd') { tdView = 'mtd'; renderMtd(); }
    else if (a === 'mtdback') { tdView = 'day'; renderToday(); }
    else if (a === 'mtdxls') { if (!mtd) return; downloadXlsx(mtd.associates.map((x) => ({ Store: me.store_code, Code: x.code, Name: x.name, Dept: cn(x.c), Brand: x.brand || '', Vendor: x.vendor || '', Present: x.present, Absent: x.absent, 'Comp-off': x.compoff, Hours: x.c === 'SEC' || x.hours == null ? '' : x.hours })), `${me.store_code}_${mtd.from}_${mtd.to}.xlsx`, 'Month'); }
    else if (a === 'stm') location.href = `statement.html?a=${b.dataset.id}&from=${mtd.from}&to=${mtd.to}`;
    else if (a === 'staff' || a === 'compoff') { const x = find(b.dataset.id); if (x) quickRequest(a, x); }
    else if (a === 'sgreq') { const x = find(b.dataset.id); if (x) quickRequest('sg_mispunch', x); }
    else if (a === 'pncat') { pnCat = b.dataset.c; $$('#pnCats .pill').forEach((p) => p.classList.toggle('on', p === b)); $('#pnRoster').innerHTML = '<div class="spin"></div>'; loadRoster(); }
    else if (a === 'hksave') hkSave();
    else if (a === 'rqsend') rqSend();
    else if (a === 'pushon') pushOn(b);
    else if (a === 'cxok' || a === 'cxno') cxDecide(b.dataset.id, a === 'cxok', b);
    else if (a === 'rqf') { rqFilter = b.dataset.f; paintReqList(); }
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('#tdShift button'); if (!b) return;
    shift = b.dataset.s; $$('#tdShift button').forEach((x) => x.classList.toggle('on', x === b)); $('#tdBody').innerHTML = '<div class="spin"></div>'; loadDay();
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'tdDate') { const v = e.target.value; if (!v || v > todayIST()) { e.target.value = date; return; } date = v; renderToday(); }
    else if (id === 'mtdMonth') { if (e.target.value) { mtdMonth = e.target.value; $('#mtdKpis').innerHTML = '<div class="spin"></div>'; loadMtd(); } }
    else if (id === 'rqT') paintReqForm(e.target.value);
    else if (id === 'rqW' && $('#rqT').value === 'staff') paintReqForm('staff');
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'hkM' || e.target.id === 'hkE') hkSum(); });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== tab) { if (h === 'stm' || h === 'qr') return; tdView = 'day'; go(h); } });
}

function ratingGate(rp) {
  return new Promise((done) => {
    const root = $('#root'), tags = rp.tags || ['Late', 'Not at post', 'Uniform', 'Behaviour', 'Mobile use', 'Other'];
    const S = {}; (rp.rows || []).forEach((a) => { S[a.id] = { s: a.stars || 0, tag: a.tag || '', note: a.note || '', locked: !!a.stars }; });
    const day = fmtDay(rp.date);
    const valid = (x) => x.s >= 3 || (x.s >= 1 && x.tag && (x.note || '').trim().length >= 3);
    const open = () => (rp.rows || []).filter((a) => !S[a.id].locked);
    function paint() {
      const L = rp.rows || [], left = open(), ok = left.filter((a) => valid(S[a.id])).length;
      root.innerHTML = `<div class="rg"><div class="rgh"><div><b>${esc(me.store_code)} · ${esc(me.store_name || '')}</b><small>${esc(me.name || '')}${me.post ? ' (' + esc(me.post) + ')' : ''} · ${esc(fmtDay(todayIST()))}</small></div>
        <button type="button" class="btn s sm" id="rgOut">${esc(t('logout') || 'Logout')}</button></div>
        <div class="rgb"><div class="note w" style="font-weight:600">⏳ Rate yesterday’s staff to continue · कल के स्टाफ को रेट करें<br><span style="font-weight:400">${esc(day)} · ${L.length} staff punched · ${L.length - left.length + ok} of ${L.length} rated</span></div>
        <div class="sub">Tap 1–5 stars. 1 or 2 stars needs a reason · 1–2 स्टार पर कारण ज़रूरी. One rating per staff per day; it cannot be changed after Submit.</div>
        ${L.map((a) => { const x = S[a.id], bad = x.s && x.s <= 2 && !x.locked;
          return `<div class="rgc ${bad ? 'bad' : ''} ${x.locked ? 'done' : ''}" data-a="${a.id}"><b>${esc(a.name)}</b> <span class="sub">· ${esc(cn(a.c))}${a.brand ? ' · ' + esc(a.brand) : a.vendor ? ' · ' + esc(a.vendor) : ''}</span>${x.locked ? ' <span class="tg ok">Saved</span>' : ''}
            <div class="stz">${[1, 2, 3, 4, 5].map((k) => `<button type="button" data-st="${k}" class="${k <= x.s ? 'on' : ''}" aria-label="${k} star"${x.locked ? ' disabled' : ''}>★</button>`).join('')}</div>
            ${bad ? `<div class="need">${x.s} ★ — reason is required · कारण ज़रूरी</div><div class="tagz">${tags.map((g) => `<button type="button" data-tg="${esc(g)}" class="${x.tag === g ? 'on' : ''}">${esc(g)}</button>`).join('')}</div>
              <textarea data-nt maxlength="300" placeholder="Write what happened (min 3 letters)">${esc(x.note)}</textarea>` : ''}</div>`; }).join('')}
        <div id="rgErr" class="note r" hidden></div></div>
        <div class="rgf"><button type="button" class="btn" id="rgGo" ${ok === left.length && left.length ? '' : 'disabled'}>${ok === left.length ? `Submit ${left.length} rating${left.length === 1 ? '' : 's'} ✓` : `Submit (${ok} of ${left.length} done)`}</button></div></div>`;
    }
    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    function onInput(e) { const c = e.target.closest('[data-a]'); if (!c || !e.target.matches('[data-nt]')) return; S[c.dataset.a].note = e.target.value; refreshBtn(); }
    function refreshBtn() { const left = open(), ok = left.filter((a) => valid(S[a.id])).length, b = $('#rgGo'); if (!b) return;
      b.disabled = !(ok === left.length && left.length); b.textContent = ok === left.length ? `Submit ${left.length} rating${left.length === 1 ? '' : 's'} ✓` : `Submit (${ok} of ${left.length} done)`; }
    async function onClick(e) {
      if (e.target.closest('#rgOut')) { logout(); return; }
      const c = e.target.closest('[data-a]'), x = c && S[c.dataset.a];
      if (x && !x.locked) {
        const st = e.target.closest('[data-st]'), tg = e.target.closest('[data-tg]');
        if (st) { x.s = Number(st.dataset.st); if (x.s >= 3) { x.tag = ''; x.note = ''; } const y = window.scrollY; paint(); window.scrollTo(0, y); return; }
        if (tg) { x.tag = tg.dataset.tg; c.querySelectorAll('[data-tg]').forEach((b) => b.classList.toggle('on', b === tg)); refreshBtn(); return; }
        return;
      }
      const go = e.target.closest('#rgGo'); if (!go || go.disabled) return;
      go.disabled = true; go.textContent = '…';
      const items = open().map((a) => ({ a: a.id, s: S[a.id].s, tag: S[a.id].tag || null, note: (S[a.id].note || '').trim() || null }));
      const r = await rpc('rating_submit', { p_token: me.token, p_items: items });
      if (!r || !r.ok) { const el = $('#rgErr'); el.hidden = false; el.textContent = { REASON_REQUIRED: '1–2 ★ needs a reason and a short note.', ONLY_SM_ASM: 'Only SM / ASM can rate.' }[r && r.error] || errText(r && r.error); refreshBtn(); return; }
      if (r.left > 0) { const n = await rpc('rating_pending', { p_token: me.token }); if (n && n.ok && n.need) { rp.rows = n.rows; Object.keys(S).forEach((k) => delete S[k]); n.rows.forEach((a) => { S[a.id] = { s: a.stars || 0, tag: a.tag || '', note: a.note || '', locked: !!a.stars }; }); paint(); return; } }
      root.removeEventListener('click', onClick); root.removeEventListener('input', onInput);
      root.innerHTML = ''; toast(`Thank you · ${items.length} rating${items.length === 1 ? '' : 's'} saved`); done();
    }
    paint();
  });
}

(async function init() {
  me = await requireSession(['store']); if (!me) return;
  const h = location.hash.slice(1); tab = ['td', 'pn', 'hks', 'rq'].includes(h) ? h : 'td';
  const bootDay = todayIST();
  // v5.5: SM / ASM must rate yesterday's staff before the app opens (DM Apps and view-as are not blocked)
  const rp = await rpc('rating_pending', { p_token: me.token });
  if (rp && rp.ok && rp.need) await ratingGate(rp);
  buildShell();
  Idle.start({ minutes: me.idle_min || 60 });
  // v5.4 punch alerts: phone push (consent) + in-page pop-up/sound while the app is open (skipped when push is on, to avoid double alerts)
  Push.state().then((st) => { pushSt = st; paintPush(); });
  Live.start(me, { showStore: false, skip: () => pushSt === 'on' });
  shift = istNow().getHours() < 14 ? 'M' : 'B';
  const [ctx] = await Promise.all([rpc('punch_context', { p_store: me.store_code }), loadCr()]);
  if (ctx && ctx.categories) ctx.categories.forEach((c) => { cats[c.id] = c; });
  wire();
  go(tab);
  if (tab !== 'hks') loadHk();
  // refresh Today every 2 min while someone is using the page (so the store lock can still auto-release)
  ['click', 'touchstart', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true }));
  setInterval(() => { if (todayIST() !== bootDay && !document.querySelector('.ov')) { location.reload(); return; } }, 60000);   // new day → rating check again
  setInterval(() => { if (!document.hidden && Date.now() - lastTouch < 25 * 60000 && tab === 'td' && tdView === 'day' && date === todayIST() && !document.querySelector('.ov')) loadDay(); }, 120000);
})();
</script>
